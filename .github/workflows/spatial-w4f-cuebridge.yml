name: Spatial W4f canonical annotated cue and source transport batch
on:
  pull_request:
    paths:
      - '.github/workflows/spatial-w4f-cuebridge.yml'
      - 'spatial-contract/cuebridge/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cue-source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: spatial-contract/go.mod
          cache: false
      - name: Race and vet all canonical cue/source-offset/footfall/phoneme annotations
        run: |
          set -euo pipefail
          git rev-parse HEAD
          (cd spatial-contract && go test -race -count=1 -v ./cuebridge ./avsync ./canonicalbridge ./contract && go vet ./cuebridge ./avsync ./canonicalbridge ./contract)
          echo W4F_CANONICAL_ANNOTATION_SOURCE_TRANSPORT_PASS
