name: R16 public release intake tests
on:
  pull_request:
    paths:
      - 'tools/release/**'
      - '.github/workflows/r16-release-intake.yml'
permissions:
  contents: read
jobs:
  source-only-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/release -p 'test_*.py' -v
