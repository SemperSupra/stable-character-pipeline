name: Audio control R0 adversarial model traces
on:
  pull_request:
    paths:
      - 'audio-control/control/adversarial_test.go'
      - '.github/workflows/audio-control-r0-adversarial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deterministic-model-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Run deterministic interleavings with race checks
        working-directory: audio-control/control
        run: go test -race -count=1 -run TestParallelAdversarialSeeds ./...
  fuzz-short:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Reproducible seed corpus then bounded mutation fuzz
        working-directory: audio-control/control
        run: |
          go test -run '^$' -fuzz '^FuzzAudioControlTrace$' -fuzztime=6s -parallel=2 .
