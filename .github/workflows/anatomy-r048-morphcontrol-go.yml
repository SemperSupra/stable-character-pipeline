name: R048 Three-Mesh Morph Control-Plane Contract (Go stdlib only)

on:
  pull_request:
    paths:
      - 'research/anatomy-native-mpfb/morphcontrol/**'
      - '.github/workflows/anatomy-r048-morphcontrol-go.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-transaction-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: research/anatomy-native-mpfb/morphcontrol/go.mod
          cache: false
      - name: Unit, deterministic plan, concurrent and adversarial mutation controls
        working-directory: research/anatomy-native-mpfb/morphcontrol
        shell: bash
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off
          go version
          go vet ./...
          go test -count=1 -race -v ./...
          echo "R048_GO_TRANSACTION_RECEIPT status=PASS_NARROW_GO_PREPARED_CONTROLLER_ONLY runtime_Godot_transport=NOT_INTEGRATED"
