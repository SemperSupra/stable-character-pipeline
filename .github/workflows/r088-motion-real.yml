name: R088 real 100STYLE BVH source FK and actual MPFB contact preflight
on:
  push:
    branches: [research/r088-100style-real-bvh-mpfb-preflight-20261118]
    paths:
      - 'research/r088-motion-real/**'
      - '.github/workflows/r088-motion-real.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r088-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-source-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Source-only hostile BVH and motion-FK oracle tests
        run: |
          set -euo pipefail
          cd research/r088-motion-real
          python3 -m unittest -v test_bvh_preflight
          python3 -m py_compile bvh_preflight.py native_source_target.py
      - name: Acquire actual bounded 100STYLE CC BY 4.0 derivative motion by immutable Git source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r088"
          upstream="https://raw.githubusercontent.com/tomcatmew/simple_motion_matching/10938b4881b55c5801faded89e427407ddf14bce/data/100style"
          for pair in "Neutral_FW.bvh:a534f69b1d7a867f9b7d4dccefcf3f1d255c4a61" "Neutral_TR1.bvh:1b7af92a4df47d4f5e12db32bac90a968a03e0b9" "Old_FW.bvh:a3b13a437de7d2151f3c9743d51b5ccfe332b3bd"; do
            name="${pair%%:*}"
            pin="${pair#*:}"
            curl --retry 2 --connect-timeout 12 --max-time 60 -fLsS "$upstream/$name" -o "$RUNNER_TEMP/r088/$name"
            test "$(stat -c %s "$RUNNER_TEMP/r088/$name")" -lt 2000000
            test "$(git hash-object "$RUNNER_TEMP/r088/$name")" = "$pin"
            python3 research/r088-motion-real/bvh_preflight.py --source "$RUNNER_TEMP/r088/$name" --sha1 "$pin" --out "$RUNNER_TEMP/r088/${name%.bvh}.json"
          done
      - name: JSON receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r088-real-bvh-numeric-json-${{ github.run_id }}
          path: ${{ runner.temp }}/r088/*.json
          retention-days: 3
          if-no-files-found: ignore
  actual-native-source-target:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact Blender 4.5.16 verified CPU binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r088-standalone"
          cd "$RUNNER_TEMP/r088-standalone"
          base="https://download.blender.org/release/Blender4.5"
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-4.5.16.sha256" -o blender.sha256
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          hash="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "$(printf '%s' "$hash" | wc -c)" -eq 64
          printf '%s  %s\n' "$hash" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r088-standalone" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Real official CC0 MakeHuman core and native rig
        env:
          SOURCE: 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" init -q
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin "$SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = "$SOURCE"
          test "$(git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          blender --command extension build --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" --output-filepath "$RUNNER_TEMP/mpfb-pinned.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned.zip"
          blender -b -t 2 --python-exit-code 12 --python research/r078-r009-mpfb-pair/makehuman_pair.py -- --stage build --source "$RUNNER_TEMP/mpfb2" --out "$RUNNER_TEMP/r078"
      - name: Native independently loaded 163-bone source-target preflight
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r088-native"
          src="$RUNNER_TEMP/r088-native/Neutral_FW.bvh"
          curl --retry 2 --connect-timeout 12 --max-time 60 -fLsS "https://raw.githubusercontent.com/tomcatmew/simple_motion_matching/10938b4881b55c5801faded89e427407ddf14bce/data/100style/Neutral_FW.bvh" -o "$src"
          test "$(git hash-object "$src")" = a534f69b1d7a867f9b7d4dccefcf3f1d255c4a61
          scene="$RUNNER_TEMP/r078/aster-juniper-official-mpfb.blend"
          sha="$(sha256sum "$scene" | cut -d ' ' -f1)"
          blender -b "$scene" -t 2 --python-exit-code 12 --python research/r088-motion-real/native_source_target.py -- --scene "$scene" --sha "$sha" --source "$src" --sha1 a534f69b1d7a867f9b7d4dccefcf3f1d255c4a61 --out "$RUNNER_TEMP/r088-native/report.json"
      - name: Metadata-only native source-target measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r088-native-source-target-json-${{ github.run_id }}
          path: ${{ runner.temp }}/r088-native/*.json
          retention-days: 3
          if-no-files-found: ignore
