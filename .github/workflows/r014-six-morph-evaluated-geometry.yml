name: R014 Independent Six-Body Evaluated MPFB Shape-Key Geometry Falsifier
on:
  push:
    branches: [research/r014-six-morph-actual-evaluated-geometry-oracle-20261112]
    paths:
      - r014/six_morph_evaluated_oracle.py
      - .github/workflows/r014-six-morph-evaluated-geometry.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: r014-six-morph-eval-geometry
  cancel-in-progress: true
jobs:
  independently-reopen-actual-six-characters:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - name: Checkout independent original source audit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile static source before model downloads
        run: python3 -m compileall -q r014/six_morph_evaluated_oracle.py
      - name: Acquire both independent real source BLEND artifacts from original qualification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-eval-source/0" "$RUNNER_TEMP/r014-eval-source/1" "$RUNNER_TEMP/r014-eval-out"
          for shard in 0 1; do
            gh run download 43286258004 --repo "$GITHUB_REPOSITORY" \
              --name "r014-real-six-morph-shard-$shard" \
              --dir "$RUNNER_TEMP/r014-eval-source/$shard"
            test -s "$RUNNER_TEMP/r014-eval-source/$shard/R014_ThreeAdultMorphs_Shard$shard.blend"
            test -s "$RUNNER_TEMP/r014-eval-source/$shard/generation_$shard.json"
          done
      - name: Use exact verified Blender 4.5.16 executable in disposable filesystem
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r014-eval-out"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 4 "$base/blender-4.5.16.sha256" -o official.sha256
          curl -fL --retry 4 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          expected="$(grep -F blender-4.5.16-linux-x64.tar.xz official.sha256 | awk '{print $1}')"
          test "${#expected}" -eq 64
          printf '%s  blender-4.5.16-linux-x64.tar.xz\n' "$expected" | sha256sum -c -
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014-eval-out" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Reopen real Blender scene and compare evaluated shape-key geometry for all six
        run: |
          set -euo pipefail
          for shard in 0 1; do
            "$BLENDER_BIN" --background "$RUNNER_TEMP/r014-eval-source/$shard/R014_ThreeAdultMorphs_Shard$shard.blend" \
              --python-exit-code 3 --python r014/six_morph_evaluated_oracle.py -- \
              --blend "$RUNNER_TEMP/r014-eval-source/$shard/R014_ThreeAdultMorphs_Shard$shard.blend" \
              --generation "$RUNNER_TEMP/r014-eval-source/$shard/generation_$shard.json" \
              --out "$RUNNER_TEMP/r014-eval-out/evaluated_shard_$shard.json"
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          base=Path(os.environ["RUNNER_TEMP"])/"r014-eval-out"
          docs=[json.loads((base/f"evaluated_shard_{i}.json").read_text()) for i in (0,1)]
          assert all(d["status"]=="PASS_THREE_INDEPENDENT_ACTUAL_EVALUATED_MORPHOLOGIES" for d in docs)
          cases=[c for d in docs for c in d["characters"]]
          assert len(cases)==6
          observed=len({c["evaluated_rest_pose_sha256"] for c in cases})
          raw_basis=len({c["raw_basis_sha256"] for c in cases})
          outcome={"schema":"r014.six_morph.cross_shard_evaluated_native_geometry.v1",
                   "status":"PASS_SIX_DISTINCT_ACTUAL_SHAPE_KEY_EVALUATED_GEOMETRIES" if observed==6 else "FAIL_CROSS_SHARD_MORPH_DUPLICATION",
                   "six_morph_sources":["r014-real-six-morph-shard-0","r014-real-six-morph-shard-1"],
                   "source_run":43286258004,"actual_evaluated_mesh_unique_count":observed,
                   "raw_unmorphed_basis_unique_count":raw_basis,
                   "evaluated_mesh_digests":{c["name"]:c["evaluated_rest_pose_sha256"] for c in cases},
                   "evaluated_dimensions_by_character":{c["name"]:c["evaluated_extent_xyz_blender_units"] for c in cases},
                   "size_unit":"Blender local mesh coordinates; not certified cm",
                   "cinematic_photoreal_status":"HOLD",
                   "licensed_mesh_assets_redistributed":False,
                   "source_blends_redistributed":False,
                   "release_authorization":"NONE"}
          (base/"cross_shard_diversity.json").write_text(json.dumps(outcome,indent=2,sort_keys=True)+"\n")
          print(json.dumps(outcome,indent=2,sort_keys=True))
          assert outcome["status"].startswith("PASS"),"FAIL_CLOSED_UNKNOWN_GEOMETRY_DIVERSITY"
          PY
      - name: Retain public numeric/hash receipts only; not model binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r014-six-morph-evaluated-geometry-receipts
          path: ${{ runner.temp }}/r014-eval-out/*.json
          if-no-files-found: warn
          retention-days: 7
