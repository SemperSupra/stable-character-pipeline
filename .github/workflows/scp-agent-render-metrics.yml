name: Agent reconstruction PNG measurement (original synthetic)
on:
  pull_request:
    paths:
      - 'qualification/agent_render_metrics/**'
      - '.github/workflows/scp-agent-render-metrics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  png_measurements:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify real PNG mask calculations and hostile inputs
        working-directory: qualification/agent_render_metrics
        run: |
          go test -race -count=1 -v ./...
          go vet ./...
          go run . capabilities
