name: Provider CPE handoff privacy contract offline qualification
on:
  pull_request:
    paths:
      - research/providers/bridge/**
      - .github/workflows/provider-bridge-safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    defaults:
      run:
        working-directory: research/providers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: research/providers/go.mod
          cache: false
      - name: Test original synthetic disclosure guards
        run: |
          go test -race -count=1 -v ./bridge | tee bridge-test.log
          go vet ./bridge
      - name: Capture native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-bridge-offline-evidence
          path: research/providers/bridge-test.log
          retention-days: 14
          if-no-files-found: warn
