name: ROMFMT V1 B - actual Blender native joint annotation and IK constraints
on:
  pull_request:
    paths:
      - 'qualification/rom_fmt_blender/**'
      - '.github/workflows/romfmt-blender.yml'
permissions:
  contents: read
jobs:
  native-bpy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Actual original-only Blender 4.5 .blend save/reopen source metadata and IK
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb libegl1 libgl1 libgl1-mesa-dri
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0'
          xvfb-run -a python qualification/rom_fmt_blender/native_blend.py --out romfmt-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: romfmt-blender-original-only
          path: romfmt-native/
          retention-days: 3
          if-no-files-found: warn
