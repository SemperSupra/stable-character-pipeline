name: R015 true native CC0 full human shape-key anthropometry proxy sweep
on:
  push:
    branches: [research/r015-native-cc0-real-morph-sweep-20261113]
    paths:
      - research/r015-measurement-admission/native_cc0_shape_sweep.py
      - .github/workflows/r015-native-cc0-shape-sweep.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r015-real-native-sweep-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real_evaluated_original_cc0_human:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        sex: [female, male]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate independent numeric script before touching original CC0 source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q research/r015-measurement-admission
          export GO111MODULE=off
          go test -race -count=1 ./research/r015-measurement-admission
          go vet ./research/r015-measurement-admission
      - name: Rehydrate authentic CC0 human native source from original public qualification run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r015-native/source" "$RUNNER_TEMP/r015-native/out"
          gh run download 43368839856 --repo "$GITHUB_REPOSITORY" \
            --name 'r014-real-cc0-source-headturn-${{ matrix.sex }}' \
            --dir "$RUNNER_TEMP/r015-native/source"
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r015-native/source"
          r=json.loads((p/"temporal_fit_receipt.json").read_text())
          assert r["sex_macro"]=="${{ matrix.sex }}"
          assert r["status"]=="PASS_BOUNDED_REAL_SOURCE_NATIVE_TEMPORAL_EVIDENCE_CAPTURE_ONLY"
          path=p/r["native_scene"]["filename"]
          assert path.name=="R014_${{ matrix.sex }}_head_turn_source_native_research.blend"
          assert path.stat().st_size>100000
          h=hashlib.sha256(path.read_bytes()).hexdigest()
          assert h==r["native_scene"]["sha256"]
          print("R015_COLD_NATIVE_SOURCE_DIGEST_VERIFIED",path.name,h)
          PY
      - name: Obtain hash checked Blender 4.5.16 only in temporary public runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r015-native"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
            "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          sha="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#sha}" -eq 64
          printf '%s  %s\n' "$sha" blender-4.5.16-linux-x64.tar.xz | sha256sum -c -
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          exe="$(find "$RUNNER_TEMP/r015-native" -maxdepth 2 -type f -name blender | head -1)"
          test -n "$exe"
          echo "BLENDER_BIN=$exe" >> "$GITHUB_ENV"
      - name: Real original adult human body mesh shape-key DOE and evaluation restoration
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/r015-native/source/R014_${{ matrix.sex }}_head_turn_source_native_research.blend"
          "$BLENDER_BIN" --background "$source" --python-exit-code 4 \
            --python research/r015-measurement-admission/native_cc0_shape_sweep.py -- \
            --sex '${{ matrix.sex }}' --native-source "$source" \
            --source-receipt "$RUNNER_TEMP/r015-native/source/temporal_fit_receipt.json" \
            --out "$RUNNER_TEMP/r015-native/out"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r015-native/out/${{ matrix.sex }}_native_real_morph_doe.json"
          r=json.loads(p.read_text())
          assert r["research_status"]=="PASS_TRUE_NATIVE_EVALUATED_MESH_SWEEP_ONLY"
          assert r["production_morphology"].startswith("HOLD_")
          assert r["source_rig_bones"]==163
          assert r["native_shape_keys"]==(30 if r["sex_macro_file_label"]=="female" else 20)
          assert r["tested_shape_cases"]>25
          assert r["max_reversibility_error_Blender"]<1e-5
          assert r["physical_source_measurement_admission"]=="UNKNOWN_ABSTAIN"
          print("R015_ACTUAL_ORIGINAL_NATIVE_MORPH_GEOMETRY_ONLY",r["sex_macro_file_label"],
                r["tested_shape_cases"],r["triangle_or_area_anomalies_present"])
          PY
          (cd "$RUNNER_TEMP/r015-native/out" && sha256sum *.json > sha256sum.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r015-real-native-cc0-morph-dimensions-${{ matrix.sex }}-UNITS_UNCALIBRATED
          path: ${{ runner.temp }}/r015-native/out/*
          retention-days: 7
