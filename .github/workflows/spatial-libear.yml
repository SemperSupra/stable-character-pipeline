name: EBU libear spatial gain reference qualification
on:
  pull_request:
    paths:
      - 'spatial-reference/**'
      - '.github/workflows/spatial-libear.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ebu-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install free public C++ math dependencies (no private credentials)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build pkg-config g++ libboost-dev libeigen3-dev libxsimd-dev
      - name: Fetch EBU libear at audited exact Apache-2.0 source SHA
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/ebu-libear"
          git init -q "$repo"
          git -C "$repo" remote add origin https://github.com/ebu/libear.git
          git -C "$repo" fetch -q --depth=1 origin 2db69f8fcea0bc5db8a78e14a9c2ae6ed4283c15
          git -C "$repo" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          test "$(git -C "$repo" rev-parse HEAD)" = "2db69f8fcea0bc5db8a78e14a9c2ae6ed4283c15"
          grep -q 'Apache License' "$repo/LICENSE"
          echo "ebu_libear_source_pin_PASS commit=2db69f8fcea0bc5db8a78e14a9c2ae6ed4283c15"
      - name: Compile real EBU gain engine with standalone oracle
        run: |
          set -euo pipefail
          cmake -S spatial-reference/libear -B "$RUNNER_TEMP/ebu-check" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DEAR_SOURCE="$RUNNER_TEMP/ebu-libear"
          cmake --build "$RUNNER_TEMP/ebu-check" -j 2
          "$RUNNER_TEMP/ebu-check/libear_oracle" | tee "$RUNNER_TEMP/libear-results.log"
          grep -q 'libear_gain_oracle_PASS profile=surround_5_1' "$RUNNER_TEMP/libear-results.log"
          grep -q 'libear_gain_oracle_PASS profile=surround_7_1' "$RUNNER_TEMP/libear-results.log"
          grep -q 'libear_reference_PASS profiles=2' "$RUNNER_TEMP/libear-results.log"
          echo "ebu_libear_oracle_PASS reference_only_not_merged"
      - name: Independently compare EBU channel gains with VideoLAN pinned 48k rendered energy ratios
        run: |
          python3 - "$RUNNER_TEMP/libear-results.log" <<'PY'
          import math,pathlib,re,sys
          source=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          # Independent VideoLAN native PCM energy receipts from public exact GHA 40457063123,
          # libspatialaudio@d149ed9744fd399b835c6f2920511f8cbcfce5ea, 24x1024
          # 410 Hz mono, azimuth +70° for first half and -70° for second half.
          native={
            "surround_5_1":[38.2032875,34.3293147,0,0,38.2032875,34.3293147],
            "surround_7_1":[16.8590204,15.1494453,0,0,59.5475559,53.5091852,0,0],
          }
          for name,energy in native.items():
            gains={}
            for az in (70,-70):
              m=re.search(r"libear_gain_OBS profile="+name+r" azimuth="+str(az)+r" direct=([^ ]+) energy=",source)
              assert m, f"missing independent EBU observation {name} {az}"
              gains[az]=[float(v) for v in m.group(1).split(",")]
              assert len(gains[az])==len(energy)
            for az,front,side in ((70,0,4),(-70,1,5)):
              predicted=(gains[az][side]/gains[az][front])**2
              observed=energy[side]/energy[front]
              assert math.isfinite(predicted) and math.isfinite(observed)
              relative=abs(predicted-observed)/predicted
              assert relative < 0.005, f"cross-engine channel ratio mismatch {name} {az} rel={relative}"
              print(f"ebulibear_videolan_ratio_PASS profile={name} az={az} ebu_squared_gain_ratio={predicted:.6f} videolan_pcm_energy_ratio={observed:.6f} relative_error={relative:.6g}")
          print("cross_engine_directional_gain_RATIO_PASS profiles=2 mirrored_positions=4 matched_layout=true full_waveform_equivalence=false")
          PY
      - name: Cleanup ephemeral public synthetic resources
        if: always()
        run: rm -rf "$RUNNER_TEMP/ebu-check" "$RUNNER_TEMP/ebu-libear" "$RUNNER_TEMP/libear-results.log"
