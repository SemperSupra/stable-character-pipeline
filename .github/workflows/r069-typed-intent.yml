name: R069 public CPU typed test-intent model qualification
on:
  push:
    branches:
      - research/r069-model-intent-20261117
    paths:
      - 'research/r069-intent-compiler/**'
      - '.github/workflows/r069-typed-intent.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r069-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typed-model-intent:
    name: R069 / ${{ matrix.suite }} / ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {suite: path-boundaries, mode: fixture, model: none}
          - {suite: strict-json, mode: fixture, model: none}
          - {suite: path-boundaries, mode: model, model: 'qwen2.5-coder:1.5b'}
          - {suite: strict-json, mode: model, model: 'qwen2.5-coder:1.5b'}
          - {suite: path-boundaries, mode: model, model: 'qwen2.5-coder:3b-instruct'}
          - {suite: strict-json, mode: model, model: 'qwen2.5-coder:3b-instruct'}
    env:
      SUITE: ${{ matrix.suite }}
      MODE: ${{ matrix.mode }}
      MODEL: ${{ matrix.model }}
    steps:
      - name: Read-only public checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Go 1.24, no dependency downloads
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: research/r069-intent-compiler/go.mod
          cache: false
      - name: Independent source-safe compiler and source fixture baseline
        shell: bash
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off
          mkdir -p "$RUNNER_TEMP/r069"
          (cd research/r069-intent-compiler && go test -race -count=1 ./... && go vet ./...)
          (cd research/r051-batch && go test -count=1 ./... && go vet ./...)
          echo "R069_COMPILER_PREFLIGHT_PASS source=$GITHUB_SHA suite=$SUITE mode=$MODE model=$MODEL"
      - name: Local-only research checkpoint (model lanes)
        if: matrix.mode == 'model'
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name r069-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_CONTEXT_LENGTH=1536 ollama/ollama:0.13.2
          for i in $(seq 1 35); do
            if curl -fsS --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null
          docker exec r069-ollama ollama pull "$MODEL" > "$RUNNER_TEMP/r069/pull.log" 2>&1
          docker exec r069-ollama ollama list | tee "$RUNNER_TEMP/r069/model-list.txt"
          docker exec r069-ollama ollama show "$MODEL" | head -45 > "$RUNNER_TEMP/r069/model-info.txt"
      - name: Synthesize or solicit ONLY typed JSON test intentions
        shell: bash
        working-directory: research/r069-intent-compiler
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off
          timeout --signal=INT --kill-after=10s 185s go run . --mode "$MODE" --suite "$SUITE" --model "$MODEL" --out ../r051-batch/r069_intent_test.go --raw "$RUNNER_TEMP/r069/model-intent.json" | tee "$RUNNER_TEMP/r069/admission.json"
          test -s ../r051-batch/r069_intent_test.go
          test -s "$RUNNER_TEMP/r069/model-intent.json"
          git status --porcelain | tee "$RUNNER_TEMP/r069/changed-paths.txt"
          test "$(git status --porcelain | wc -l)" -eq 1
          grep -q 'research/r051-batch/r069_intent_test.go' "$RUNNER_TEMP/r069/changed-paths.txt"
      - name: Compile fixture tests and require hostile mutant failure
        shell: bash
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off
          (cd research/r051-batch && go test -race -count=1 ./... && go vet ./...) | tee "$RUNNER_TEMP/r069/test.log"
          cp research/r051-batch/r069_intent_test.go "$RUNNER_TEMP/r069/generated-source-only.go.txt"
          mkdir -p "$RUNNER_TEMP/r069/mutant"
          cp -a research/r051-batch/. "$RUNNER_TEMP/r069/mutant/"
          export MUTANT_DIR="$RUNNER_TEMP/r069/mutant"
          python3 - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ["MUTANT_DIR"])
          suite=os.environ["SUITE"]
          if suite=="path-boundaries":
              path=root/"main.go"
              before='return a==b||strings.HasPrefix(a,b+"/")||strings.HasPrefix(b,a+"/")'
              after='return false'
          elif suite=="strict-json":
              path=root/"r061_strict_input.go"
              before='if _,present:=seen[name];present{return fmt.Errorf("duplicate JSON key %q",name)}'
              after='if false{return fmt.Errorf("duplicate JSON key %q",name)}'
          else:
              raise SystemExit("UNSUPPORTED_SUITE")
          contents=path.read_text()
          if contents.count(before)!=1:raise SystemExit("MUTANT_TARGET_NOT_UNIQUE")
          path.write_text(contents.replace(before,after))
          print("R069_DETERMINISTIC_HOSTILE_SOURCE_MUTATION_APPLIED",suite)
          PY
          set +e
          (cd "$RUNNER_TEMP/r069/mutant" && go test -count=1 -run '^TestR069IntentQualified$' ./...) > "$RUNNER_TEMP/r069/mutant.log" 2>&1
          mutation_exit=$?
          set -e
          cat "$RUNNER_TEMP/r069/mutant.log"
          printf '{"schema":"scp.r069.external-mutant-evidence.v1","source_sha":"%s","suite":"%s","mode":"%s","model":"%s","mutant_exit":%s,"source_code_admitted":false,"model_generated_go":false,"owner_accepted":false,"outcome":"%s"}\n' "$GITHUB_SHA" "$SUITE" "$MODE" "$MODEL" "$mutation_exit" "$([ "$mutation_exit" -ne 0 ] && echo PASS_NARROW || echo FAIL_MUTANT_SURVIVED)" | tee "$RUNNER_TEMP/r069/final.json"
          test "$mutation_exit" -ne 0
      - name: Preserve source-only evidence, including first RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r069-${{ matrix.suite }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r069/*.json
            ${{ runner.temp }}/r069/*.log
            ${{ runner.temp }}/r069/*.txt
          retention-days: 3
          if-no-files-found: warn
