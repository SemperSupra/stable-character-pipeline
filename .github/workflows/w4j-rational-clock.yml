name: W4j exact rational multi-rate AV source clock
on:
  pull_request:
    paths:
      - qualification/spatial_w4j_clock/**
      - .github/workflows/w4j-rational-clock.yml
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s qualification/spatial_w4j_clock -p test_clock.py -v
  independent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 qualification/spatial_w4j_clock/independent.py exact-clock.json
      - uses: actions/upload-artifact@v4
        with:
          name: w4j-exact-rational-independent
          path: exact-clock.json
          retention-days: 3
