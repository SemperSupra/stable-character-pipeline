name: R009 smooth transition native profile DOE
on:
  pull_request:
    paths:
      - 'research/r009-transition-doe/**'
      - '.github/workflows/r009-transition-doe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analytic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: python3 -m unittest discover -s research/r009-transition-doe -v
  native-profile-doe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Acquire pinned official Blender archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive=blender-5.2.4-linux-x64.tar.xz
          expected=2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          ok=0
          for host in https://download.blender.org https://mirror.blender.org https://mirror.nju.edu.cn/blender; do
            if curl -fLsS --connect-timeout 12 --speed-limit 32768 --speed-time 12 --max-time 95 "$host/release/Blender5.2/$archive" -o "$archive" && echo "$expected  $archive" | sha256sum -c -; then ok=1; break; fi
          done
          test "$ok" -eq 1
          timeout 150s tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-5.2.4-linux-x64" >> "$GITHUB_PATH"
      - name: Native saved/reopened six-treatment experiment
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/transition-doe"
          mkdir "$dir"
          src=research/r009-transition-doe
          blender -b --python-exit-code 12 --python-expr 'import bpy; assert bpy.app.version == (5,2,4)'
          produce() {
            local kind="$1" half="$2" label="$3"
            blender -b -t 2 --python-exit-code 12 --python "$src/native_doe.py" -- --stage build --kind "$kind" --half "$half" --scene "$dir/$label.blend"
            blender -b "$dir/$label.blend" -t 2 --python-exit-code 12 --python "$src/native_doe.py" -- --stage sample --kind "$kind" --half "$half" --scene "$dir/$label.blend" --out "$dir/$label.json"
          }
          produce reference 20 reference
          for half in 10 20; do
            for kind in linear cubic quintic; do produce "$kind" "$half" "$kind-$half"; done
          done
          python3 "$src/verify.py" "$dir"
