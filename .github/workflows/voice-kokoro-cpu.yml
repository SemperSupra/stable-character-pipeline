name: Public Kokoro CPU neural voice proof
on:
  pull_request:
    paths:
      - 'voice-foundry/providers/kokoro-onnx/**'
      - '.github/workflows/voice-kokoro-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-synthetic-neural-voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public CPU-only inference dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng
          python -m pip install --disable-pip-version-check --no-cache-dir 'kokoro-onnx==0.6.1' 'soundfile==0.13.1'
      - name: Source-only static test
        run: |
          python -m py_compile voice-foundry/providers/kokoro-onnx/synth.py
      - name: Download exact public model release assets (transient)
        run: |
          set -euo pipefail
          modeldir="$RUNNER_TEMP/kokoro-models"
          mkdir -p "$modeldir"
          base='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1'
          curl --fail --location --retry 3 --max-time 240 -sS "$base/kokoro-v1.0.int8.onnx" --output "$modeldir/kokoro-v1.0.int8.onnx"
          curl --fail --location --retry 3 --max-time 240 -sS "$base/voices-v1.0.bin" --output "$modeldir/voices-v1.0.bin"
          printf '%s  %s\n' \
            'ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c' "$modeldir/kokoro-v1.0.int8.onnx" \
            'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d' "$modeldir/voices-v1.0.bin" | sha256sum --check
      - name: Run pinned open-model synthetic speech and inspect signal
        run: |
          set -euo pipefail
          models="$RUNNER_TEMP/kokoro-models"
          output="$RUNNER_TEMP/kokoro-voices"
          trap 'rm -rf "$models" "$output"' EXIT
          python voice-foundry/providers/kokoro-onnx/synth.py --models "$models" --out "$output"
          python3 - "$output/receipt.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['classification']=='PUBLIC_SYNTHETIC_CANDIDATE_NOT_FINAL'
          assert len(r['voices'])==2
          assert all(a['bytes']>4800 for a in r['voices'])
          assert all(a['peak']<1.01 and a['rms']>0.0001 for a in r['voices'])
          print("neural_voice_receipt_verified")
          PY
          echo 'No model weights or generated audio uploaded; no private data used.'
