name: SCP source-original two-view camera heldout intrinsics challenge
on:
  pull_request:
    paths:
      - 'qualification/agent_camera_calibration/**'
      - '.github/workflows/scp-camera-intrinsics-heldout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-correspondence-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject parent-source or separate workcell modification
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 672edf4842a409deb1e10d573148e292ec05351d HEAD > "$RUNNER_TEMP/changed"
          cat "$RUNNER_TEMP/changed"
          if grep -v -E '^qualification/agent_camera_calibration/|^\.github/workflows/scp-camera-intrinsics-heldout\.yml$' "$RUNNER_TEMP/changed"; then
            echo 'FAIL SOURCE OWNERSHIP' >&2
            exit 2
          fi
      - name: Bounded original synthetic camera reprojection and hostile split tests
        env:
          SCP_CAMERA_VALIDATOR_PERF_OUT: ${{ runner.temp }}/camera-validator-performance.json
        working-directory: qualification/agent_camera_calibration
        run: |
          set -euo pipefail
          python3 -m compileall -q .
          python3 -m unittest discover -v -p 'test_*.py'
      - name: Check independent camera validator performance and capture evidence holds
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"camera-validator-performance.json"
          r=json.loads(p.read_text())
          assert r["schema"]=="scp.validator.performance.v1"
          assert r["case_count"]==16
          assert r["expected_accepted"]==4
          assert r["rejection_detection"]=={"detected":12,"total":12}
          assert r["false_acceptance_count"]==r["false_rejection_count"]==0
          assert r["contract_mismatch_count"]==r["hard_error_count"]==0
          assert r["decision"]=="PASS_DECLARED_SYNTHETIC_ORACLE_CONTROLS_ONLY"
          assert r["external_photo_fit"]=="NOT_RUN"
          assert r["extrinsics_authenticity"]=="UNKNOWN" and not r["merge_release_CPE_approval"]
          print("CAMERA_VALIDATOR_QUALITY",r["validator_sha256"],r["runtime"])
          PY
      - name: Preserve source-bounded camera performance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scp-camera-intrinsics-validator-quality
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/camera-validator-performance.json
      - name: Disposable exact-head parent-plus-child integration witness (no git writes)
        if: github.event_name == 'pull_request'
        env:
          PARENT_HEAD_PIN: 8f07eca9ebc20e50543b1559f7a0da6a7a40341a
          OLD_PARENT_PIN: 672edf4842a409deb1e10d573148e292ec05351d
          CHILD_HEAD: ${{ github.event.pull_request.head.sha }}
          PARENT_REF: refs/heads/workcell/agent-observation-admission-20261106
          INTEGRATION_RECEIPT: ${{ runner.temp }}/camera-admission-disposable-integration.json
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "$PARENT_REF" | cut -f1)" = "$PARENT_HEAD_PIN"
          test "$(git ls-remote origin refs/heads/workcell/agent-camera-heldout-intrinsics-20261106 | cut -f1)" = "$CHILD_HEAD"
          git cat-file -e "$PARENT_HEAD_PIN^{commit}"
          git cat-file -e "$CHILD_HEAD^{commit}"
          test "$(git merge-base "$PARENT_HEAD_PIN" "$CHILD_HEAD")" = "$OLD_PARENT_PIN"
          tree="$(git merge-tree --write-tree "$PARENT_HEAD_PIN" "$CHILD_HEAD")"
          test "$tree" = "$(git rev-parse --verify "$tree^{tree}")"
          test "$(git ls-tree -r --name-only "$tree" | grep -c '^qualification/agent_camera_calibration/calibration.py$')" = 1
          test "$(git ls-tree -r --name-only "$tree" | grep -c '^qualification/agent_observation_admission/validator_quality_test.go$')" = 1
          mkdir -p "$RUNNER_TEMP/camera-admission-trial"
          git archive "$tree" | tar -x -C "$RUNNER_TEMP/camera-admission-trial"
          (cd "$RUNNER_TEMP/camera-admission-trial/qualification/agent_observation_admission"; go test -race -count=1 ./...; go vet ./...)
          (cd "$RUNNER_TEMP/camera-admission-trial/qualification/agent_camera_calibration"; python3 -m unittest discover -v -p 'test_*.py')
          python3 - <<'PY'
          import json,os,pathlib,re
          p=pathlib.Path(os.environ["INTEGRATION_RECEIPT"])
          parent=os.environ["PARENT_HEAD_PIN"]; child=os.environ["CHILD_HEAD"]; base=os.environ["OLD_PARENT_PIN"]
          result={
            "schema":"scp.source_disposable_integration.v1",
            "source_class":"PUBLIC_ORIGINAL_SYNTHETIC_ONLY",
            "parent_pr":325,"parent_head":parent,
            "child_pr":332,"child_head":child,"old_base":base,
            "source_combination":"GIT_MERGE_TREE_NO_COMMIT_NO_REMOTE_MUTATION",
            "merge_tree":"NO_SOURCE_CONFLICT",
            "parent_go_race_and_vet":"PASS",
            "child_camera_unit_quality":"PASS",
            "parent_synthetic_admission":"QUALIFIED_ON_COMBINED_TREE",
            "child_camera_synthetic_projection":"QUALIFIED_ON_COMBINED_TREE",
            "external_image_fit":"NOT_RUN",
            "rights_consents_independently_verified":False,
            "independent_extrinsics":"NOT_PROVEN",
            "biological_realism":"UNKNOWN",
            "owner_merge_release_CPE_approval":False
          }
          assert all(re.fullmatch("[0-9a-f]{40}",x) for x in (parent,child,base))
          p.write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
          print("DISPOSABLE_ADMISSION_CAMERA_COMBINED_TREE_TESTED_NOT_MERGED",parent,child)
          PY
          test "$(git ls-remote origin "$PARENT_REF" | cut -f1)" = "$PARENT_HEAD_PIN"
      - name: Preserve disposable exact-head source integration proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scp-disposable-camera-admission-integration
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/camera-admission-disposable-integration.json
      - name: Scientific admission remains held
        run: |
          echo 'CORRESPONDENCE_INTRINSICS_ONLY; PHOTO_IMAGE_BYTES_NOT_READ; EXTRINSICS_NOT_INDEPENDENT; REAL_PERSON_FIT_NOT_RUN; SCIENCE_UNKNOWN; RELEASE_CPE_MERGE_HELD'
