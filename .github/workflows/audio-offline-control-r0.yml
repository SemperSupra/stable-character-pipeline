name: Audio control R0 existing scene offline bridge (synthetic only)
on:
  pull_request:
    paths:
      - 'audio-foundry/offlinecontrol/**'
      - '.github/workflows/audio-offline-control-r0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-ffmpeg-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Check installed ffmpeg and ffprobe
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Reuse exact existing scene Plan/Render with original synthetic PCM16
        working-directory: audio-foundry
        run: |
          go test -race -count=1 -v ./offlinecontrol
          go vet ./offlinecontrol
