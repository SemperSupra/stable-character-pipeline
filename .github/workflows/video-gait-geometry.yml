name: video-gait-geometry-research
on:
  pull_request:
    paths:
      - 'qualification/video_physics_bakeoff/kinematic_geometry/**'
      - '.github/workflows/video-gait-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: CPU-only Python standard-library gait geometry tests
        working-directory: qualification/video_physics_bakeoff/kinematic_geometry
        run: |
          set -euo pipefail
          python3 -VV
          python3 -m compileall -q .
          python3 -m unittest -v
