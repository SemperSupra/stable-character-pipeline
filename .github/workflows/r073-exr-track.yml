name: R073 real semantic head object-index tracking across source-known Cycles frames

on:
  push:
    branches: [research/r073-object-segmentation-motion-public-20261117]
    paths:
      - 'trackprobe/**'
      - '.github/workflows/r073-exr-track.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r073-public-object-index-segmentation
  cancel-in-progress: true

jobs:
  source-projected-segmentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Disposable free original-only Blender CPU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version | head -3
      - name: Actual 3-frame source-known projected multi-mesh semantic head
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          blender -b -t 2 --python trackprobe/scene.py -- --out out
          test -s out/r073_source.json
          for frame in 00 01 02; do
            test -s "out/frame_$frame/beauty.png"
            test -s "out/frame_$frame/render_passes.exr"
          done
      - name: Independent source ray/EXR object ID, projected semantic track and adverse controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r073-pixel"
          "$RUNNER_TEMP/r073-pixel/bin/pip" install --disable-pip-version-check \
            --only-binary=:all: --no-cache-dir numpy==1.26.4 OpenEXR==3.3.3
          "$RUNNER_TEMP/r073-pixel/bin/python" -m unittest discover \
            -s trackprobe -p test_audit.py -v
          "$RUNNER_TEMP/r073-pixel/bin/python" trackprobe/audit.py \
            --root out --out out/r073_report.json
          grep -F '"status": "PASS_NARROW_REAL_EXR_SEMANTIC_TRACK_DIRECTION"' out/r073_report.json
          (cd out && find . -type f ! -name artifact_manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifact_manifest.sha256)
          (cd out && sha256sum -c artifact_manifest.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r073-original-synthetic-exr-semantic-motion-HOLD
          path: out/
          retention-days: 3
          if-no-files-found: warn
