name: R036 Landmark-Laterality Registration Contract
on:
  push:
    branches:
      - research/r036-landmark-gates-20261116
    paths:
      - 'research/anatomy-bakeoff/landmarks/**'
      - '.github/workflows/anatomy-r036-landmarks.yml'
  pull_request:
    paths:
      - 'research/anatomy-bakeoff/landmarks/**'
      - '.github/workflows/anatomy-r036-landmarks.yml'
permissions:
  contents: read
concurrency:
  group: r036-landmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  landmark-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/anatomy-bakeoff
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline original Go source + race/vet
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          go version
          go test -race -count=1 ./...
          go vet ./...
