name: Equine exact integrated 30j GLB hoof/audio independent falsifier
on:
  pull_request:
    paths:
      - ".github/workflows/equine-av-integrated-30j-contact.yml"
      - "qualification/equine/av_observer/**"
      - "qualification/equine/ci_fanout/**"
permissions:
  contents: read
  actions: read
jobs:
  integrated-native-contact:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail-closed source-native proof gate
        id: fanout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/equine/ci_fanout -p 'test_*.py' -q
          if ! python3 qualification/equine/ci_fanout/proof_gate.py --workcell equine-av-integrated-30j-contact --out "$RUNNER_TEMP/scp-ci-fanout-receipt.json"; then
            echo "run_native=true" >> "$GITHUB_OUTPUT"
            echo "FAIL_CLOSED_NATIVE_AFTER_SELECTOR_ERROR"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.fanout.outputs.run_native == 'true'
        with:
          repository: SemperSupra/stable-character-pipeline
          ref: 7e03073f14df7e6103a30a96b8430ccb988914c8
          path: hoof-observer
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.fanout.outputs.run_native == 'true'
        with:
          repository: SemperSupra/stable-character-pipeline
          ref: 497203219d035bafd72be2d4a34786c1396526ff
          path: gait-frozen
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: steps.fanout.outputs.run_native == 'true'
        with:
          go-version: "1.23.2"
          cache: false
      - name: Exact public-original integrated GLB and immutable artifact custody
        if: steps.fanout.outputs.run_native == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: SemperSupra/stable-character-pipeline
        run: |
          set -euo pipefail
          mkdir -p results/integrated
          gh run download 42173374397 --repo "$GH_REPO" \
            --name shetland-face-tail-hair-join-42173374397 --dir results/integrated
          test -f results/integrated/hair/equine_longhair_wind.glb
          (cd results/integrated/hair && sha256sum -c <<'EOF'
          9fbc0b517e1231c4032204c34cf9bed6eb76db349e81b390ee3812e43b331f33  equine_longhair_wind.glb
          EOF
          )
          python3 - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('results/integrated')
          r=json.loads((p/'integration_receipt.json').read_text())
          model=(p/'hair/equine_longhair_wind.glb').read_bytes()
          assert r['schema']=='equine.face_tail_hair.join.v1'
          assert r['sha256']==hashlib.sha256(model).hexdigest()
          assert r['joints']==30 and r['morph_targets']>=13 and r['animations']>=6
          assert r['source']=={'face':'f0a5c6e00869402a672be562d9c1e37117f3469d',
                                'hair':'672eb168c90e29a82a29667b089b861e34504df3',
                                'halter':'6c74c0b0f18c146d435761b4b8ffc959d61541d8',
                                'tail':'d6c68ae01431433acc0b29b69fa00bdd40de5d5c'}
          print('IMMUTABLE_INTEGRATED_30J_SOURCE_GLBSHA_PASS; SCIENTIFIC_ACCEPTANCE_UNKNOWN')
          PY
      - name: Source-only Go and independent hoof hostile tests
        if: steps.fanout.outputs.run_native == 'true'
        run: |
          set -euo pipefail
          (cd qualification/equine/av_observer && go test -race -count=1 ./... && go vet ./... && go build -o "$RUNNER_TEMP/contact-proxy" ./cmd/contact_proxy)
          (cd gait-frozen/qualification/equine/gait && go test -count=1 ./... && go build -o "$RUNNER_TEMP/gaitclock" ./cmd/gaitclock)
          python3 -m unittest discover -s hoof-observer/qualification/equine/contact_eval -p 'test_metrics.py'
          "$RUNNER_TEMP/gaitclock" -actor pony-black -gait walk -surface sand \
             -cycles 1 -frames-per-cycle 48 -fps 24 -out results/planned_48f.json
      - name: Install verified disposable Blender 4.5.15 runtime
        if: steps.fanout.outputs.run_native == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ca-certificates curl xz-utils libegl1 libgl1 libgl1-mesa-dri libgbm1
          curl --fail --location --retry 3 --silent --show-error https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o "$RUNNER_TEMP/blender.sha256"
          curl --fail --location --retry 3 --silent --show-error https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP"; grep 'blender-4.5.15-linux-x64.tar.xz' blender.sha256 | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz" -C "$RUNNER_TEMP"
      - name: Independent actual 48-frame Blender evaluated four-hoof geometry
        if: steps.fanout.outputs.run_native == 'true'
        run: |
          set -euo pipefail
          env LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 \
             --python hoof-observer/qualification/equine/contact_eval/observed_hooves.py -- \
             "$GITHUB_WORKSPACE/results/integrated/hair/equine_longhair_wind.glb" "$GITHUB_WORKSPACE/results/integrated_hoof_science.json"
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('results/integrated_hoof_science.json').read_text())
          assert r['schema']=='equine.foot.science.v1' and r['source_model']=='equine_longhair_wind.glb'
          assert r['frames']==48 and len(r['evaluated_hoof_trajectories'])==4
          print('INTEGRATED_MODEL_48F_EVALUATED_HOOVES',r['scientific_verdict'])
          PY
      - name: Independently cross-check measured hoof geometry with planned sound events
        if: steps.fanout.outputs.run_native == 'true'
        run: |
          set -euo pipefail
          model=results/integrated/hair/equine_longhair_wind.glb
          sha=9fbc0b517e1231c4032204c34cf9bed6eb76db349e81b390ee3812e43b331f33
          set +e
          "$RUNNER_TEMP/contact-proxy" -planned results/planned_48f.json \
              -observed results/integrated_hoof_science.json -glb "$model" -glb-sha256 "$sha" \
              -receipt results/integrated_contact_audio.json
          code=$?
          set -e
          if [[ "$code" != 0 && "$code" != 1 ]]; then
            echo "INVALID SOURCE/CONTRACT, code $code" >&2; exit 1
          fi
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('results/integrated_contact_audio.json').read_text())
          assert r['schema']=='equine.audio-contact-proxy.v1'
          assert r['source_glb_sha256']=='9fbc0b517e1231c4032204c34cf9bed6eb76db349e81b390ee3812e43b331f33'
          assert r['contact_truth']=='UNKNOWN_NO_FORCE_SENSOR'
          assert r['planned_event_count']==4
          assert r['verdict'] in ('NO_PROXY_CONTRADICTION_CONTACT_UNKNOWN','FAIL_PROXY_CONTRADICTS_PLANNED_AUDIO')
          print('SOURCE_EXACT_INTEGRATED_30J_CONTACT_AUDIO',r['verdict'])
          PY
      - name: Preserve immutable small scientific receipts
        if: ${{ (always()) && steps.fanout.outputs.run_native == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: equine-integrated-30j-native-contact-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            results/integrated_hoof_science.json
            results/integrated_contact_audio.json
            results/planned_48f.json
