name: R015 Semantify Distributed Pretrained Mapper Native CPU Forward
on:
  push:
    branches:
      - research/r015-prior-art-bakeoff-r1-20261112
    paths:
      - '.github/workflows/r015-semantify-pretrained.yml'
      - 'research/r015_prior_art/semantify_pretrained.py'
permissions:
  contents: read
jobs:
  original-pretrained-mapper-safe-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reproducible public research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Ephemeral CPU PyTorch install
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r015-native-venv"
          . "$RUNNER_TEMP/r015-native-venv/bin/activate"
          python -m pip install --no-input --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-input --disable-pip-version-check --no-cache-dir numpy==1.26.4
          python -m pip install --no-input --disable-pip-version-check --no-cache-dir omegaconf==2.3.0
      - name: Fetch immutable Semantify source revision, no setup.py
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" fetch -q --depth 1 https://github.com/Omergral/Semantify.git 78b001d3dc4ea4efa428e3aff1213cefddf6ebd8
          git -C "$RUNNER_TEMP/upstream" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = "78b001d3dc4ea4efa428e3aff1213cefddf6ebd8"
      - name: Fetch bounded official archive via TLS and safely infer original checkpoint
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/r015-native-venv/bin/activate"
          python research/r015_prior_art/semantify_pretrained.py "$RUNNER_TEMP/upstream" receipts/semantify-pretrained.json
      - name: Upload public receipt only, no weights/archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r015-semantify-original-mapper-receipt
          path: receipts/semantify-pretrained.json
          if-no-files-found: warn
          retention-days: 7
