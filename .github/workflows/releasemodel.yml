name: R0c bounded release contract state model
on:
  pull_request:
    paths:
      - 'releasemodel/**'
      - '.github/workflows/releasemodel.yml'
permissions:
  contents: read
concurrency:
  group: r0c-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bounded-exhaustive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: releasemodel/go.mod
          cache: false
      - name: Source, signature and 59049-state bounded checks
        shell: bash
        run: |
          set -euo pipefail
          (cd releasegate && go test -count=1 ./... && go vet ./...)
          (cd releaseproof && go test -race -count=1 ./... && go vet ./...)
          (cd releasemodel && go test -race -v -count=1 ./... && go vet ./...)
