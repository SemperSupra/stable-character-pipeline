name: R014 Blender Studio CC0 realistic male/female sculpt foundation census
on:
  push:
    branches: [research/r014-blender-studio-bases-v1]
    paths: [r014/**, .github/workflows/r014-blender-studio-bases.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-realistic-bases:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Acquire official Blender 4.5.16 portable binary with checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-blenderstudio"
          cd "$RUNNER_TEMP/r014-blenderstudio"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 3 "$base/blender-4.5.16.sha256" -o upstream.sha256
          curl -fL --retry 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          hash="$(grep -F blender-4.5.16-linux-x64.tar.xz upstream.sha256 | awk '{print $1}')"
          test "${#hash}" -eq 64
          printf '%s  %s\n' "$hash" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014-blenderstudio" -maxdepth 2 -name blender -type f | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Download publisher CC0 Human Base Meshes v1.4.1 asset bundle
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 --max-time 420 \
            https://download.blender.org/demo/asset-bundles/human-base-meshes/human-base-meshes-bundle-v1.4.1.zip \
            -o "$RUNNER_TEMP/r014-blenderstudio/human_base_meshes_v1.4.1.zip"
          test "$(stat -c '%s' "$RUNNER_TEMP/r014-blenderstudio/human_base_meshes_v1.4.1.zip")" -eq 50643039
          sha256sum "$RUNNER_TEMP/r014-blenderstudio/human_base_meshes_v1.4.1.zip"
      - name: Inventory native realistic sculpt meshes, proportions, modifiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-blenderstudio/evidence"
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 3 --python r014/blender_studio_asset_probe.py -- \
            --archive "$RUNNER_TEMP/r014-blenderstudio/human_base_meshes_v1.4.1.zip" \
            --out "$RUNNER_TEMP/r014-blenderstudio/evidence" \
            --receipt "$RUNNER_TEMP/r014-blenderstudio/evidence/inventory.json"
          test -s "$RUNNER_TEMP/r014-blenderstudio/evidence/inventory.json"
          test -s "$RUNNER_TEMP/r014-blenderstudio/evidence/R014_BlenderStudio_CC0_realistic_sculpt_bases.blend"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-blenderstudio-cc0-realistic-base-research
          path: ${{ runner.temp }}/r014-blenderstudio/evidence/*
          retention-days: 7
