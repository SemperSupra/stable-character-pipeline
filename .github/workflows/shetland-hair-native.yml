name: Shetland reduced guide hair dynamics native morph proof
on:
  pull_request:
    paths:
      - "qualification/shetland_pony/guide_dynamics.py"
      - "qualification/shetland_pony/test_guide_dynamics.py"
      - "qualification/shetland_pony/guide_native.py"
      - "qualification/shetland_pony/curved_groom.py"
      - "qualification/shetland_pony/test_curved_groom.py"
      - "qualification/shetland_pony/hair_clamp_quality.py"
      - "qualification/equine/hair_prior_art/pony_source_trajectory.py"
      - "qualification/equine/hair_prior_art/test_pony_source_trajectory.py"
      - "qualification/equine/hair_prior_art/pony_source_extract_native.py"
      - "qualification/equine/hair_prior_art/pony52_source_shadow.py"
      - "qualification/equine/hair_prior_art/pony52_actual_surface_native.py"
      - "qualification/equine/hair_prior_art/test_pony52_actual_surface_native.py"
      - "qualification/equine/hair_prior_art/capture_order_ab.py"
      - "qualification/equine/hair_prior_art/test_capture_order_ab.py"
      - "qualification/equine/hair_prior_art/pony_skin_frame_native.py"
      - "qualification/equine/hair_prior_art/pony_skin_frame_quality.py"
      - "qualification/equine/hair_prior_art/test_pony_skin_frame_quality.py"
      - "qualification/equine/hair_prior_art/pony_body_follicle_native.py"
      - "qualification/equine/hair_prior_art/pony_body_follicle_quality.py"
      - "qualification/equine/hair_prior_art/test_pony_body_follicle_quality.py"
      - "qualification/equine/hair_prior_art/pony52_wind_source_ab.py"
      - "qualification/equine/hair_prior_art/test_pony52_wind_source_ab.py"
      - "qualification/equine/hair_prior_art/pony_tail_bone_native.py"
      - "qualification/equine/hair_prior_art/pony_tail_bone_quality.py"
      - "qualification/equine/hair_prior_art/test_pony_tail_bone_quality.py"
      - "qualification/equine/hair_prior_art/pony52_pair_quality.py"
      - "qualification/equine/hair_prior_art/test_pony52_pair_quality.py"
      - "qualification/shetland_pony/test_hair_clamp_quality.py"
      - "qualification/shetland_pony/hair_contact_quality.py"
      - "qualification/shetland_pony/test_hair_contact_quality.py"
      - "qualification/shetland_pony/hair_body_collision_native.py"
      - ".github/workflows/shetland-hair-native.yml"
permissions:
  contents: read
jobs:
  source-hostile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pure Python deterministic hostile qualification
        run: |
          set -euo pipefail
          (cd qualification/shetland_pony && python3 -m unittest -v test_guide_dynamics.py test_curved_groom.py test_hair_clamp_quality.py test_hair_contact_quality.py)
          (cd qualification/equine/hair_prior_art && python3 -m unittest -v test_pony_source_trajectory.py test_pony52_pair_quality.py test_pony52_actual_surface_native.py test_capture_order_ab.py test_pony_skin_frame_quality.py test_pony_body_follicle_quality.py test_pony52_wind_source_ab.py test_pony_tail_bone_quality.py)
          python3 qualification/equine/hair_prior_art/pony52_actual_surface_native.py --selftest
          python3 -m py_compile qualification/equine/hair_prior_art/pony_skin_frame_native.py qualification/equine/hair_prior_art/pony_skin_frame_quality.py qualification/equine/hair_prior_art/pony_body_follicle_native.py qualification/equine/hair_prior_art/pony_body_follicle_quality.py
          python3 -m py_compile qualification/equine/hair_prior_art/pony_tail_bone_native.py qualification/equine/hair_prior_art/pony_tail_bone_quality.py qualification/equine/hair_prior_art/pony52_wind_source_ab.py
          python3 -m py_compile qualification/equine/hair_prior_art/pony_source_extract_native.py qualification/equine/hair_prior_art/pony_source_trajectory.py
          python3 -m py_compile qualification/shetland_pony/guide_dynamics.py qualification/shetland_pony/guide_native.py qualification/shetland_pony/curved_groom.py qualification/shetland_pony/hair_clamp_quality.py
  native-blender:
    needs: source-hostile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/blender/runner-images/bpy:1.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned disposable native Blender 4.5.15
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl xz-utils libegl1 libgl1 libgl1-mesa-dri libgbm1
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o "$RUNNER_TEMP/blender/checksums"
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP/blender" && grep 'blender-4.5.15-linux-x64.tar.xz' checksums | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64.tar.xz" -C "$RUNNER_TEMP/blender"
      - name: Generate actual baseline original black pony, 30-bone source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/baseline results/hair
          env LIBGL_ALWAYS_SOFTWARE=1 SCP_COATS=black "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/shetland_pony/build_blender.py -- "$GITHUB_WORKSPACE/results/baseline"
      - name: Native Blender add independent hair controls and baked export
        shell: bash
        run: |
          set -euo pipefail
          env SCP_HAIR_MODE=rest_candidate LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/shetland_pony/guide_native.py -- "$GITHUB_WORKSPACE/results/baseline/shetland_black_ghcr.blend" "$GITHUB_WORKSPACE/results/hair"
      - name: Capture actual original 30-joint skinned guide root/tip 48f evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/source_capsule
          env LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/equine/hair_prior_art/pony_source_extract_native.py -- "$GITHUB_WORKSPACE/results/hair/equine_longhair_wind.blend" "$GITHUB_WORKSPACE/results/source_capsule/pony_source_48f.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("results/source_capsule/pony_source_check.json").read_text())
          assert r["verdict"]=="PASS_REAL_SOURCE_GEOMETRY_ONLY" and r["guides"]==6
          assert not r["physical_hair_simulation_proven"] and not r["collision_acceptance"]
          p=json.loads(Path("results/source_capsule/pony_source_48f.json").read_text())
          assert len(p["guides"])==6 and all(len(x["samples"])==48 for x in p["guides"])
          assert p["rig"]=="PonyRig30"
          print("SOURCE_30J_GUIDES_EXTRACTED_NOT_XPBD_ADMITTED",r)
          PY
      - name: Independent original 30j 48f bone-frame and actual body barycentric observers (science held)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/bone_frame results/body_root
          env LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/equine/hair_prior_art/pony_skin_frame_native.py -- "$GITHUB_WORKSPACE/results/hair/equine_longhair_wind.blend" "$GITHUB_WORKSPACE/results/source_capsule/pony_source_48f.json" "$GITHUB_WORKSPACE/results/bone_frame/source_bone_48f.json"
          env LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/equine/hair_prior_art/pony_body_follicle_native.py -- "$GITHUB_WORKSPACE/results/hair/equine_longhair_wind.blend" "$GITHUB_WORKSPACE/results/source_capsule/pony_source_48f.json" "$GITHUB_WORKSPACE/results/body_root/native_body_48f.json"
          python3 qualification/equine/hair_prior_art/pony_body_follicle_quality.py \
            results/source_capsule/pony_source_48f.json \
            results/body_root/native_body_48f.json \
            results/body_root/quality.json
          python3 - <<'PY'
          import json
          r=json.load(open("results/body_root/quality.json"))
          assert r["schema"]=="equine.pony.source_body_follicle_qualification.v1"
          assert r["frames"]==48 and r["guides"]==6
          assert r["science_hold"]=="KEEP" and r["candidate_is_retargetable"] is False
          assert r["source_follicle_anatomy_visual_accepted"] is False
          assert r["original_source_root_snapping_performed"] is False
          print("ACTUAL_PONY_ROOT_TO_BODY_48F_UNADMITTED",r["regions"])
          PY
      - name: Original 30j tail-bone centerline versus source rump proximity, independently held
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/caudal
          env LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/equine/hair_prior_art/pony_tail_bone_native.py -- "$GITHUB_WORKSPACE/results/hair/equine_longhair_wind.blend" "$GITHUB_WORKSPACE/results/source_capsule/pony_source_48f.json" "$GITHUB_WORKSPACE/results/caudal/tail_bone_48f.json"
          python3 qualification/equine/hair_prior_art/pony_tail_bone_quality.py \
            results/source_capsule/pony_source_48f.json \
            results/body_root/native_body_48f.json \
            results/caudal/tail_bone_48f.json \
            results/caudal/quality.json
          python3 - <<'PY'
          import json
          r=json.load(open("results/caudal/quality.json"))
          assert r["schema"]=="equine.pony.source_caudal_bone_vs_rump_48f.v1"
          assert len(r["caudal_bone_centerline_distances"])==2
          assert r["bone_centerline_not_skinned_surface"] is True
          assert r["science_hold"]=="KEEP" and r["release_or_CPE_admission"] is False
          print("CAUDAL_BONE_NOT_AN_ATOMIC_SKIN_SURFACE",r["caudal_bone_centerline_distances"])
          PY
      - name: Independent exported GLB structural and hash gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          dir=pathlib.Path("results/hair")
          raw=(dir/"equine_longhair_wind.glb").read_bytes()
          assert len(raw)>2048 and raw[:4]==b"glTF"
          n=struct.unpack_from("<I",raw,12)[0]
          g=json.loads(raw[20:20+n].decode().strip())
          assert max(len(s["joints"]) for s in g["skins"])>=30
          assert g["animations"]
          names=[m.get("name","") for m in g["meshes"]]
          morph_meshes=[m for m in g["meshes"] if any(p.get("targets") for p in m["primitives"])]
          groom_node=next(n for n in g["nodes"] if n.get("name")=="geometric_coat_mane_tail")
          groom=g["meshes"][groom_node["mesh"]]
          assert len(morph_meshes)>=1
          assert any(c["target"]["path"]=="weights" for a in g["animations"] for c in a["channels"])
          assert not any(n.get("name","").startswith("tail_volume_") for n in g["nodes"]), "rigid egg-shaped tail proxy remained"
          position_accessors=[g["accessors"][p["attributes"]["POSITION"]]["count"] for p in groom["primitives"]]
          assert sum(position_accessors)>=1050*10,position_accessors
          receipt=json.loads(next(dir.glob("*_receipt.json")).read_text())
          assert receipt["curved_rows_per_card"]==5
          assert receipt["curved_vertices"]==10500
          assert receipt["root_source"]=="actual evaluated Blender skin from 48 source frames"
          quality=receipt["clamp_quality"]
          assert quality["schema"]=="equine.longhair.clamp_quality.v1"
          assert quality["guides"]==receipt["guide_groups"]
          assert quality["overall"]["count"]==receipt["guide_groups"]*9
          assert quality["sample_frames"]==[1,7,13,19,25,31,37,43,48]
          assert not quality["visual_acceptance"]
          assert quality["biology_and_collision"]=="UNKNOWN"
          assert receipt["hair_mode"]=="rest_candidate"
          assert receipt["candidate_rest_stiffness_s2"]==60.
          assert receipt["clamp_m"]==0.22
          print("HAIR_CLAMP_DIAGNOSTIC_NOT_SCIENTIFIC_ACCEPTANCE",quality["overall"])

          for file,meta in receipt["files"].items():
              p=dir/file
              assert p.stat().st_size==meta["bytes"]
              assert hashlib.sha256(p.read_bytes()).hexdigest()==meta["sha256"]
          assert len(list(dir.glob("hair_*.png")))==8
          print("NATIVE_HAIR_STRUCTURAL_PASS; VISUAL/BIOMECHANICAL_ACCEPTANCE_NOT_ASSERTED")
          PY
      - name: Independently evaluate actual skinned 48f long-hair/body crossing (science hold)
        shell: bash
        run: |
          set -euo pipefail
          env LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/shetland_pony/hair_body_collision_native.py -- "$GITHUB_WORKSPACE/results/hair/equine_longhair_wind.blend" "$GITHUB_WORKSPACE/results/hair/hair_contact_48f.json"
          python3 - <<'PY'
          import json
          r=json.load(open("results/hair/hair_contact_48f.json"))
          assert r["schema"]=="equine.hair_body.contact_screen.v2"
          assert r["frames"]==48 and r["frames_examined"]==48
          assert r["source_cards"]==1050 and r["triangles_distal_75pct_per_frame"]==6300
          assert r["triangles_last_quarter_per_frame"]==2100
          assert 0<=r["tip_zone_possible_region_frames"]<=r["possible_region_frames"]<=144
          assert r["runtime_diagnostic_seconds"]["samples"]==48
          assert r["runtime_diagnostic_seconds"]["p95"]>=0
          assert r["native_observer_sha256"]
          print("DISTAL_VERSUS_TIP_CONTACT_HOLD",r["tip_zone_possible_region_frames"],r["regions"])
          assert r["scientific_hold"]=="KEEP"
          assert r["visual_acceptance"] is False and r["release_or_CPE_admission"] is False
          print("HAIR_NATIVE_48F_BVH_SCIENCE_WARNING",r["candidate_collision"],r["possible_region_frames"])
          PY
      - name: Native 5.2.3 shadow physics against actual original six PonyRig30 follicles (no pony upgrade)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender52" results/shadow52
          curl -fLsS --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.3.sha256 -o "$RUNNER_TEMP/blender52/checksums"
          curl -fLsS --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.3-linux-x64.tar.xz -o "$RUNNER_TEMP/blender52/blender-5.2.3-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP/blender52" && grep 'blender-5.2.3-linux-x64.tar.xz' checksums | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender52/blender-5.2.3-linux-x64.tar.xz" -C "$RUNNER_TEMP/blender52"
          for mode in physics animation; do
            env SCP_52_MODE="$mode" LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender52/blender-5.2.3-linux-x64/blender" -b --factory-startup --python-exit-code 9 --python qualification/equine/hair_prior_art/pony52_source_shadow.py -- "$GITHUB_WORKSPACE/results/source_capsule/pony_source_48f.json" "$GITHUB_WORKSPACE/results/shadow52/$mode.json"
          done
          python3 qualification/equine/hair_prior_art/pony52_pair_quality.py \
            results/source_capsule/pony_source_48f.json \
            results/shadow52/physics.json \
            results/shadow52/animation.json \
            results/shadow52/quality.json
          python3 - <<'PY'
          import json
          q=json.load(open("results/shadow52/quality.json"))
          assert q["schema"]=="equine.pony.xpbd_source_proxy.paired_quality.v1"
          assert q["frames"]==48 and q["guides"]==6
          assert q["verdict"]=="SOURCE_PONY_PROXY_SECONDARY_MOTION_ENGINEERING_ONLY"
          assert q["body_and_hair_collision"]=="NOT_TESTED" and q["science_hold"]=="KEEP"
          assert q["release_or_CPE_admission"] is False
          print("ORIGINAL_PONY_30J_TO_52_SHADOW_SOURCE_BOUNDED_NOT_RELEASE",q)
          PY
      - name: Original skinned 30j groom surface 5.2 native direct-attachment shadow (non-release)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/attached52
          for mode in physics animation; do
            env SCP_52_SOURCE_MORPHS=animated SCP_52_MODE="$mode" LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender52/blender-5.2.3-linux-x64/blender" -b --factory-startup --python-exit-code 9 --python qualification/equine/hair_prior_art/pony52_actual_surface_native.py -- --native "$GITHUB_WORKSPACE/results/hair/equine_longhair_wind.blend" "$GITHUB_WORKSPACE/results/source_capsule/pony_source_48f.json" "$GITHUB_WORKSPACE/results/attached52/$mode.json"
          done
          python3 qualification/equine/hair_prior_art/pony52_actual_surface_native.py --compare \
            results/source_capsule/pony_source_48f.json \
            results/attached52/physics.json \
            results/attached52/animation.json \
            results/attached52/quality.json
          python3 - <<'PY'
          import json
          r=json.load(open("results/attached52/quality.json"))
          assert r["schema"]=="equine.pony52.attached_original_groom.paired_quality.v1"
          assert r["frames"]==48 and r["guides"]==6
          assert r["status"]=="ATTACHED_ORIGINAL_SKIN_48F_ENGINEERING_PROOF_ONLY"
          assert r["science_hold"]=="KEEP" and r["release_admission"] is False
          assert r["full_anatomical_collision_clearance"] is False
          assert r["physical_material_calibration"]=="UNKNOWN" and r["visual_acceptance"] is False
          print("ORIGINAL_30J_SKIN_GROOM_TO_52_NATIVE_ATTACHED_SCIENCE_HOLD",r)
          PY
      - name: Native 5.2 actual original 9-wind-morph source confound A/B (nonrelease)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/wind_morph_ab
          for mode in physics animation; do
            env SCP_52_SOURCE_MORPHS=disabled SCP_52_MODE="$mode" LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender52/blender-5.2.3-linux-x64/blender" -b --factory-startup --python-exit-code 9 --python qualification/equine/hair_prior_art/pony52_actual_surface_native.py -- --native "$GITHUB_WORKSPACE/results/hair/equine_longhair_wind.blend" "$GITHUB_WORKSPACE/results/source_capsule/pony_source_48f.json" "$GITHUB_WORKSPACE/results/wind_morph_ab/$mode.json"
          done
          python3 qualification/equine/hair_prior_art/pony52_wind_source_ab.py \
            results/source_capsule/pony_source_48f.json \
            results/attached52/physics.json \
            results/attached52/animation.json \
            results/wind_morph_ab/physics.json \
            results/wind_morph_ab/animation.json \
            results/wind_morph_ab/quality.json
          python3 - <<'PY'
          import json
          r=json.load(open("results/wind_morph_ab/quality.json"))
          assert r["schema"]=="equine.pony52.source_wind_morph_ab.v1"
          assert r["frames"]==48 and r["guides"]==6
          assert r["verdict"] in (
            "WIND_MORPH_CONFOUNDING_SUPPORTS_BOUNDED_CAUSAL_HYPOTHESIS",
            "INCONCLUSIVE_NO_SOURCE_WIND_ACTIVITY",
            "NO_ELIGIBLE_IMPROVEMENT_KEEP_ORIGINAL_WORKCELL")
          assert r["scientific_hold"]=="KEEP" and r["merge_release_CPE"] is False
          assert r["original_source_mutated_on_disk"] is False
          print("MORPH_SOURCE_CONFOUND_5_2_A_B_NONRELEASE",r)
          PY
      - name: Independently reconcile source bone-frame transport with native 5.2 rigid hair (science held)
        shell: bash
        run: |
          set -euo pipefail
          python3 qualification/equine/hair_prior_art/pony_skin_frame_quality.py \
            results/source_capsule/pony_source_48f.json \
            results/bone_frame/source_bone_48f.json \
            results/attached52/animation.json \
            results/bone_frame/quality.json
          python3 - <<'PY'
          import json
          r=json.load(open("results/bone_frame/quality.json"))
          assert r["schema"]=="equine.pony.source_bone_vs_52_rigid_oracle.v1"
          assert r["frames"]==48 and r["cards"]==6
          assert r["scientific_hold"]=="KEEP" and not r["release_or_CPE_admission"]
          assert not r["rest_frame_attachment_and_tangent_calibrated"]
          print("SOURCE_30J_BONE_VS_BLENDER52_RIGID_FRAME_UNADMITTED",r["hypothesis"],r["regions"])
          PY
      - name: Preserve original native evidence and first failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shetland-hair-native-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            results/hair/*.glb
            results/hair/*.png
            results/hair/*_receipt.json
            results/hair/hair_contact_48f.json
            results/baseline/manifest.json
            results/source_capsule/*.json
            results/shadow52/*.json
            results/attached52/*.json
            results/bone_frame/*.json
            results/body_root/*.json
            results/caudal/*.json
            results/wind_morph_ab/*.json
