name: Shetland reduced guide hair dynamics native morph proof
on:
  pull_request:
    paths:
      - "qualification/shetland_pony/guide_dynamics.py"
      - "qualification/shetland_pony/test_guide_dynamics.py"
      - "qualification/shetland_pony/guide_native.py"
      - "qualification/shetland_pony/curved_groom.py"
      - "qualification/shetland_pony/test_curved_groom.py"
      - "qualification/shetland_pony/hair_clamp_quality.py"
      - "qualification/shetland_pony/test_hair_clamp_quality.py"
      - ".github/workflows/shetland-hair-native.yml"
permissions:
  contents: read
jobs:
  source-hostile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pure Python deterministic hostile qualification
        run: |
          set -euo pipefail
          (cd qualification/shetland_pony && python3 -m unittest -v test_guide_dynamics.py test_curved_groom.py test_hair_clamp_quality.py)
          python3 -m py_compile qualification/shetland_pony/guide_dynamics.py qualification/shetland_pony/guide_native.py qualification/shetland_pony/curved_groom.py qualification/shetland_pony/hair_clamp_quality.py
  native-blender:
    needs: source-hostile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/blender/runner-images/bpy:1.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned disposable native Blender 4.5.15
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl xz-utils libegl1 libgl1 libgl1-mesa-dri libgbm1
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o "$RUNNER_TEMP/blender/checksums"
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP/blender" && grep 'blender-4.5.15-linux-x64.tar.xz' checksums | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64.tar.xz" -C "$RUNNER_TEMP/blender"
      - name: Generate actual baseline original black pony, 30-bone source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/baseline results/hair
          env LIBGL_ALWAYS_SOFTWARE=1 SCP_COATS=black "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/shetland_pony/build_blender.py -- "$GITHUB_WORKSPACE/results/baseline"
      - name: Native Blender add independent hair controls and baked export
        shell: bash
        run: |
          set -euo pipefail
          env SCP_HAIR_MODE=rest_candidate LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/shetland_pony/guide_native.py -- "$GITHUB_WORKSPACE/results/baseline/shetland_black_ghcr.blend" "$GITHUB_WORKSPACE/results/hair"
      - name: Independent exported GLB structural and hash gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,struct
          dir=pathlib.Path("results/hair")
          raw=(dir/"equine_longhair_wind.glb").read_bytes()
          assert len(raw)>2048 and raw[:4]==b"glTF"
          n=struct.unpack_from("<I",raw,12)[0]
          g=json.loads(raw[20:20+n].decode().strip())
          assert max(len(s["joints"]) for s in g["skins"])>=30
          assert g["animations"]
          names=[m.get("name","") for m in g["meshes"]]
          morph_meshes=[m for m in g["meshes"] if any(p.get("targets") for p in m["primitives"])]
          groom_node=next(n for n in g["nodes"] if n.get("name")=="geometric_coat_mane_tail")
          groom=g["meshes"][groom_node["mesh"]]
          assert len(morph_meshes)>=1
          assert any(c["target"]["path"]=="weights" for a in g["animations"] for c in a["channels"])
          assert not any(n.get("name","").startswith("tail_volume_") for n in g["nodes"]), "rigid egg-shaped tail proxy remained"
          position_accessors=[g["accessors"][p["attributes"]["POSITION"]]["count"] for p in groom["primitives"]]
          assert sum(position_accessors)>=1050*10,position_accessors
          receipt=json.loads(next(dir.glob("*_receipt.json")).read_text())
          assert receipt["curved_rows_per_card"]==5
          assert receipt["curved_vertices"]==10500
          assert receipt["root_source"]=="actual evaluated Blender skin from 48 source frames"
          quality=receipt["clamp_quality"]
          assert quality["schema"]=="equine.longhair.clamp_quality.v1"
          assert quality["guides"]==receipt["guide_groups"]
          assert quality["overall"]["count"]==receipt["guide_groups"]*9
          assert quality["sample_frames"]==[1,7,13,19,25,31,37,43,48]
          assert not quality["visual_acceptance"]
          assert quality["biology_and_collision"]=="UNKNOWN"
          assert receipt["hair_mode"]=="rest_candidate"
          assert receipt["candidate_rest_stiffness_s2"]==60.
          assert receipt["clamp_m"]==0.22
          print("HAIR_CLAMP_DIAGNOSTIC_NOT_SCIENTIFIC_ACCEPTANCE",quality["overall"])

          for file,meta in receipt["files"].items():
              p=dir/file
              assert p.stat().st_size==meta["bytes"]
              assert hashlib.sha256(p.read_bytes()).hexdigest()==meta["sha256"]
          assert len(list(dir.glob("hair_*.png")))==8
          print("NATIVE_HAIR_STRUCTURAL_PASS; VISUAL/BIOMECHANICAL_ACCEPTANCE_NOT_ASSERTED")
          PY
      - name: Preserve original native evidence and first failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shetland-hair-native-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            results/hair/*.glb
            results/hair/*.png
            results/hair/*_receipt.json
            results/baseline/manifest.json
