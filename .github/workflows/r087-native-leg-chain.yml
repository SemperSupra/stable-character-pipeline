name: R087 measured native MPFB leg-chain topology and IK feasibility
on:
  push:
    branches: [research/r087-native-leg-chain-ik-preflight-20261118]
    paths:
      - 'research/r087-leg-ik-preflight/**'
      - '.github/workflows/r087-native-leg-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r087-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-rights-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          set -euo pipefail
          cd research/r087-leg-ik-preflight
          python3 -m unittest -v test_ik_contract
          python3 -m py_compile ik_contract.py native_leg_chain.py
  actual-native-leg-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Official hash-pinned standalone Blender 4.5.16 for native read-only CPU geometry
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r087-standalone"
          cd "$RUNNER_TEMP/r087-standalone"
          base="https://download.blender.org/release/Blender4.5"
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-4.5.16.sha256" -o blender.sha256
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          hash="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "$(printf '%s' "$hash" | wc -c)" -eq 64
          printf '%s  %s\n' "$hash" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r087-standalone" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$bin"
          "$bin" --background --python-expr 'import bpy,numpy;print("R087_BLENDER",bpy.app.version_string,"numpy",numpy.__version__)'
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Exact original official MakeHuman/MPFB code and CC0 core
        env:
          SOURCE: 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" init -q
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin "$SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = "$SOURCE"
          test "$(git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          blender --command extension build --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" --output-filepath "$RUNNER_TEMP/mpfb-pinned.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned.zip"
      - name: Generate actual official-source 163-bone original fiction pair
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 12 --python research/r078-r009-mpfb-pair/makehuman_pair.py -- --stage build --source "$RUNNER_TEMP/mpfb2" --out "$RUNNER_TEMP/r078"
      - name: Independent fresh-process actual lower-limb ancestry and posed joint-frame report
        run: |
          set -euo pipefail
          scene="$RUNNER_TEMP/r078/aster-juniper-official-mpfb.blend"
          sha="$(sha256sum "$scene" | cut -d ' ' -f1)"
          blender -b "$scene" -t 2 --python-exit-code 12 --python research/r087-leg-ik-preflight/native_leg_chain.py -- --scene "$scene" --sha "$sha" --out "$RUNNER_TEMP/r087-leg-chain.json"
      - name: Metadata-only rig geometry witness; no .blend or texture published
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r087-native-leg-json-${{ github.run_id }}
          path: ${{ runner.temp }}/r087-leg-chain.json
          retention-days: 3
          if-no-files-found: ignore
