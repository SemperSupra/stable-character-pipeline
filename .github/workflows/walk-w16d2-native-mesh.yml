name: W16-D2 native actual skinned triangle contact and camera falsifiers
on:
  pull_request:
    paths:
      - 'qualification/walk_w16d2/**'
      - '.github/workflows/walk-w16d2-native-mesh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-mesh:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [forward, outward]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original self-authored native actual weighted-mesh fixture
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri xvfb ffmpeg
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0'
          xvfb-run -a python qualification/walk_w16c/integrated_3d.py --profile "$PROFILE" --out "w16d2-$PROFILE"
      - name: Independently falsify ACTUAL sampled animated triangles
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python -m unittest discover -s qualification/walk_w16d2 -p 'test_*.py' -v
          python qualification/walk_w16d2/mesh_checks.py --glb "w16d2-$PROFILE/original_two_weighted_3d_characters.glb" --truth "w16d2-$PROFILE/native_source_vertex_truth.json" --profile "$PROFILE" --out "w16d2-$PROFILE/actual_mesh_falsifier_receipt.json"
          python - "$PROFILE" <<'PY'
          import json,sys
          p=sys.argv[1]
          r=json.load(open("w16d2-"+p+"/actual_mesh_falsifier_receipt.json"))
          assert r["status"]=="PASS_SAMPLED_MESH_GEOMETRY_ONLY"
          assert r["indexed_vertex_observations"]==392
          assert r["contact_admission"].startswith("ABSTAIN")
          assert r["occlusion_admission"].startswith("ABSTAIN")
          print("W16D2_NATIVE_SCOPE_GATED",p,r["sampled_triangle_min_separation"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w16d2-numeric-${{ matrix.profile }}
          path: w16d2-${{ matrix.profile }}/*receipt.json
          retention-days: 3
          if-no-files-found: warn
