name: Mechanica - independent public playback qualification

on:
  push:
    branches:
      - qualification/mechanica-playback-20261027
    paths:
      - mechanica/qualification/**
      - .github/workflows/mechanica-playback-qualification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanica-independent-playback-${{ github.ref }}
  cancel-in-progress: true

jobs:
  independently-inspect-published-public-previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout independent qualification at exact candidate branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout original public previews at immutable published SHA
        uses: actions/checkout@v4
        with:
          repository: SemperSupra/stable-character-pipeline
          ref: c43bab2560a42c8ad880e13f7c32926b9cf9b0ef
          path: preview
          persist-credentials: false
      - name: Diagnose and install bounded CPU dependencies without silent apt stalls
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence
          echo "Host: $(uname -a)"
          echo "Python: $(python3 --version)"
          df -h /
          ps -eo pid,ppid,stat,etime,args | grep -E '[a]pt|[d]pkg' || true
          for pkg in ffmpeg blender python3-numpy xvfb; do
            echo "-- ${pkg} --"
            apt-cache policy "${pkg}" | head -n 12 || true
          done
          export DEBIAN_FRONTEND=noninteractive
          set +e
          timeout --signal=TERM --kill-after=10s 180s sudo apt-get -o DPkg::Lock::Timeout=20 install -y --no-install-recommends ffmpeg blender python3-numpy xvfb libgl1 libegl1 libosmesa6
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Dependency installation failed or timed out, exit=${rc}"
            ps -eo pid,ppid,stat,etime,args | grep -E '[a]pt|[d]pkg' || true
            printf '{"schema":"mechanica.dependency.v1","status":"FAIL","first_failure":"public-hosted-apt-install-exit-%s"}\n' "$rc" > qualification-evidence/dependency_report.json
            exit "$rc"
          fi
          command -v blender
          command -v ffmpeg
      - name: Verify playback utilities
        run: |
          set -euo pipefail
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python3 --version
      - name: Assert independent media-probe negative controls
        run: |
          set -euo pipefail
          python3 mechanica/qualification/inspect_media.py --self-test
      - name: Decode public MP4s and qualify GLB and contact sheets
        run: |
          set -euo pipefail
          python3 mechanica/qualification/inspect_media.py \
            --preview-dir preview/latest \
            --output qualification-evidence/playback_report.json
      - name: Record Blender version
        run: blender --version | head -n 2
      - name: Import pinned GLB using actual Blender and render articulated samples
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence/blender
          xvfb-run -a blender -b -t 2 \
            --python mechanica/qualification/inspect_blender.py -- \
            --preview-dir preview/latest \
            --output-dir qualification-evidence/blender
      - name: Assemble contact sheets from independently rendered Blender frames
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          out=pathlib.Path('qualification-evidence/blender')
          report=json.loads((out/'blender_report.json').read_text())
          assert report['status']=='PASS_BLENDER_IMPORT_MOTION_AND_RENDER'
          for focus in ('scene','titan'):
              files=[out / r['file'] for r in report['cpu_render_frames']
                     if r['file'].startswith(focus+'_')]
              assert len(files)==3
              args=['ffmpeg','-hide_banner','-loglevel','error','-y']
              for f in files: args += ['-i',str(f)]
              args += ['-filter_complex','[0:v][1:v][2:v]hstack=inputs=3',
                       '-frames:v','1','-update','1',str(out/focus+'_contact_sheet.png')]
              subprocess.run(args,check=True)
              assert (out/(focus+'_contact_sheet.png')).stat().st_size>3000
          PY
      - name: Upload independent evidence including first failure if any
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanica-independent-playback-report
          path: |
            qualification-evidence/*.json
            qualification-evidence/blender/*.json
            qualification-evidence/blender/*.png
          retention-days: 7
          if-no-files-found: warn
