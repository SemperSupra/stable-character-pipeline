name: N03D BE official original exact-morph 163 vs 53 rig true native 100STYLE
on:
  push:
    branches: [research/n03d-be-morph-controlled-20261121]
    paths:
      - 'research/n03d-be-morph-controlled/**'
      - '.github/workflows/n03d-be-morph-controlled.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n03d-be-${{ github.ref }}
  cancel-in-progress: true
jobs:
  exact-phenotype-actor-rig-crosscontrol:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        actor: [AsterOriginal, JuniperOriginal]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Independent 12 source, morphology, clock and physical forgery controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/n03d-be-morph-controlled -p 'test_critic.py' -v
          python3 -m unittest discover -s research/r088-motion-real -p 'test_bvh_preflight.py' -v
          python3 -m py_compile research/n03d-be-morph-controlled/*.py
      - name: Actual official SHA-pinned Blender 5.2.4 CPU runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender-official"
          cd "$RUNNER_TEMP/blender-official"
          base="https://mirror.blender.org/release/Blender5.2"
          fallback="https://download.blender.org/release/Blender5.2"
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-5.2.4.sha256" -o blender.sha256 || curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$fallback/blender-5.2.4.sha256" -o blender.sha256
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-5.2.4-linux-x64.tar.xz" -o blender-5.2.4-linux-x64.tar.xz || curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$fallback/blender-5.2.4-linux-x64.tar.xz" -o blender-5.2.4-linux-x64.tar.xz
          hash="$(grep -F blender-5.2.4-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "$hash" = 2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          printf '%s  %s\n' "$hash" blender-5.2.4-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-5.2.4-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/blender-official" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Source-authenticated official MPFB core HumanService and original default and game_engine weights
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          test "$(git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/data/rigs/standard/rig.default.json"
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/data/rigs/standard/rig.game_engine.json"
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/data/rigs/standard/weights.default.json"
          test -s "$RUNNER_TEMP/mpfb2/src/mpfb/data/rigs/standard/weights.game_engine.json"
          blender --command extension build --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" --output-filepath "$RUNNER_TEMP/mpfb-pinned.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned.zip"
      - name: Source original 100STYLE exact same heldout source frames all actors and rigs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/n03d-be"
          src="$RUNNER_TEMP/n03d-be/Neutral_FW.bvh"
          curl --retry 2 --connect-timeout 15 --max-time 120 -fLsS "https://raw.githubusercontent.com/tomcatmew/simple_motion_matching/10938b4881b55c5801faded89e427407ddf14bce/data/100style/Neutral_FW.bvh" -o "$src"
          test "$(git hash-object "$src")" = a534f69b1d7a867f9b7d4dccefcf3f1d255c4a61
          python3 research/r088-motion-real/bvh_preflight.py --source "$src" --sha1 a534f69b1d7a867f9b7d4dccefcf3f1d255c4a61 --out "$RUNNER_TEMP/n03d-be/source-verified.json"
      - name: ACTUAL official same morphology re-rig and four 360x60Hz Blender native skin trajectories
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 12 --python research/n03d-be-morph-controlled/morph_matched.py -- --actor '${{ matrix.actor }}' --motion "$RUNNER_TEMP/n03d-be/Neutral_FW.bvh" --out "$RUNNER_TEMP/n03d-be/exact-morph-actor.json"
      - name: Independent exact source identity both rigs and 1440 sample skin material critic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,sys,json
          sys.path.insert(0,"research/n03d-be-morph-controlled")
          from critic import check
          p=os.environ["RUNNER_TEMP"]+"/n03d-be/exact-morph-actor.json"
          d=json.load(open(p))
          assert check(d)=="HOLD"
          assert d["actor"]=="${{ matrix.actor }}"
          print("N03D_BE_INDEPENDENT_MORPH_NATIVE_HOLD",json.dumps({"actor":d["actor"],"morph_hash":d["exact_source_body_mesh_sha256"],"joints":d["named_rig_joint_head_differences_m"],"metrics":[{"rig":x["rig"],"mode":x["mode"],"skin":x["actual_material"]} for x in d["results"]],"status":d["status"]},sort_keys=True))
          PY
      - name: Publish 3 day JSON-only numerical receipts, original Blend/Motion not redistributed
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n03d-be-${{ matrix.actor }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/n03d-be/source-verified.json
            ${{ runner.temp }}/n03d-be/exact-morph-actor.json
          if-no-files-found: ignore
          retention-days: 3
