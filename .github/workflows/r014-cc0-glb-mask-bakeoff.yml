name: R014 Real CC0 Human GLB Helper Mask Export Corrective Bakeoff
on:
  push:
    branches: [research/r014-cc0-glb-mask-bakeoff-20261113]
    paths:
      - 'r014/cc0_glb_helper_mask_bakeoff.py'
      - 'r014/cc0_glb_candidate_cold_import.py'
      - '.github/workflows/r014-cc0-glb-mask-bakeoff.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r014-real-cc0-glb-mask-bakeoff
  cancel-in-progress: true
jobs:
  two-independent-native-export-strategies:
    name: Real CC0 ${{ matrix.sex }} / glTF strategy ${{ matrix.strategy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sex: [female,male]
        strategy: [direct_apply,mpfb_mask_bake]
    env:
      BLENDER_USER_CONFIG: /tmp/r014-glb-mask/config
      BLENDER_USER_SCRIPTS: /tmp/r014-glb-mask/scripts
    steps:
      - name: Checkout read-only research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile all source and setup isolated numeric oracle
        run: |
          set -euo pipefail
          python3 -m compileall -q r014/cc0_glb_helper_mask_bakeoff.py r014/cc0_glb_candidate_cold_import.py r014/cc0_compare_source_vs_cold_glb_snapshot.py r014/cc0_source_glb_spatial_compare.py
          python3 -m venv "$RUNNER_TEMP/r014-glb-numeric"
          . "$RUNNER_TEMP/r014-glb-numeric/bin/activate"
          python -m pip install --no-input --no-cache-dir --disable-pip-version-check numpy==2.1.3 scipy==1.15.2
          python - <<'PY'
          import importlib.util
          s=importlib.util.spec_from_file_location("oracle","r014/cc0_source_glb_spatial_compare.py")
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          print(m.selftest())
          PY
      - name: Retrieve exact pinned original author Blender source, no private media
        env:
          GH_TOKEN: ${{ github.token }}
          SEX: ${{ matrix.sex }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-mask/source" "$RUNNER_TEMP/r014-mask/out" "$RUNNER_TEMP/r014-mask/imported"
          gh run download 43368839856 --repo "$GITHUB_REPOSITORY" --name "r014-real-cc0-source-headturn-$SEX" \
            --dir "$RUNNER_TEMP/r014-mask/source"
          python3 - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"r014-mask/source"
          r=json.loads((root/"temporal_fit_receipt.json").read_text())
          assert r["sex_macro"]==os.environ["SEX"] and r["status"]=="PASS_BOUNDED_REAL_SOURCE_NATIVE_TEMPORAL_EVIDENCE_CAPTURE_ONLY"
          p=root/r["native_scene"]["filename"]
          h=hashlib.sha256()
          with p.open("rb") as f:
              for chunk in iter(lambda:f.read(1<<20),b""):h.update(chunk)
          assert h.hexdigest()==r["native_scene"]["sha256"]
          print("SOURCE_UNMODIFIED_PUBLIC_CC0",os.environ["SEX"],h.hexdigest())
          PY
      - name: Obtain verified upstream Blender 4.5.16 in disposable runner
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r014-mask"
          base=https://download.blender.org/release/Blender4.5
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 20 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 20 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          expected="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#expected}" -eq 64
          printf '%s  blender-4.5.16-linux-x64.tar.xz\n' "$expected" | sha256sum -c -
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014-mask" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Checkout official source-correct MPFB 2.0.18 exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: makehumancommunity/mpfb2
          ref: 6ff1eb358f6c1959ced77e79e6dd2406d9a71f49
          path: _vendor/mpfb2
          persist-credentials: false
      - name: Source rights and native mask bake API admission
        run: |
          set -euo pipefail
          test "$(git -C _vendor/mpfb2 rev-parse HEAD)" = 6ff1eb358f6c1959ced77e79e6dd2406d9a71f49
          grep -F GPLv3 _vendor/mpfb2/LICENSE.md
          grep -F CC0 _vendor/mpfb2/LICENSE.md
          mkdir -p "$BLENDER_USER_CONFIG" "$BLENDER_USER_SCRIPTS" "$RUNNER_TEMP/r014-mask/extensions"
          "$BLENDER_BIN" --command extension build --source-dir _vendor/mpfb2/src/mpfb --output-dir "$RUNNER_TEMP/r014-mask"
          addon="$(find "$RUNNER_TEMP/r014-mask" -maxdepth 1 -name 'mpfb-*.zip' | head -1)"
          test -s "$addon"
          "$BLENDER_BIN" --command extension repo-add r014lab --directory "$RUNNER_TEMP/r014-mask/extensions"
          "$BLENDER_BIN" --command extension install-file -r r014lab -e "$addon"
          "$BLENDER_BIN" --command extension list
      - name: Independently snapshot original actual evaluated masked 13K-vertex human model
        env:
          SEX: ${{ matrix.sex }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/r014-mask/source/R014_${SEX}_head_turn_source_native_research.blend"
          "$BLENDER_BIN" --background "$src" --python-exit-code 4 --python r014/cc0_compare_source_vs_cold_glb_snapshot.py -- \
            --source "$src" --sex "$SEX" --mode source --out "$RUNNER_TEMP/r014-mask/out/source_actual.json"
      - name: Generate exact-bake strategy glTF without touching original source
        env:
          SEX: ${{ matrix.sex }}
          STRATEGY: ${{ matrix.strategy }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/r014-mask/source/R014_${SEX}_head_turn_source_native_research.blend"
          "$BLENDER_BIN" --background "$src" --python-exit-code 4 --python r014/cc0_glb_helper_mask_bakeoff.py -- \
            --source "$src" --source-receipt "$RUNNER_TEMP/r014-mask/source/temporal_fit_receipt.json" \
            --sex "$SEX" --strategy "$STRATEGY" --out "$RUNNER_TEMP/r014-mask/out"
      - name: Import each candidate GLB cold, with no original native source scene loaded
        env:
          SEX: ${{ matrix.sex }}
          STRATEGY: ${{ matrix.strategy }}
        run: |
          set -euo pipefail
          glb="$RUNNER_TEMP/r014-mask/out/R014_${SEX}_${STRATEGY}_portable_human.glb"
          "$BLENDER_BIN" --background --python-exit-code 4 --python r014/cc0_glb_candidate_cold_import.py -- \
             --glb "$glb" --out "$RUNNER_TEMP/r014-mask/imported/reimported.blend"
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014-mask/imported/reimported.blend" \
             --python-exit-code 4 --python r014/cc0_compare_source_vs_cold_glb_snapshot.py -- \
             --source "$RUNNER_TEMP/r014-mask/imported/reimported.blend" --sex "$SEX" --mode import \
             --out "$RUNNER_TEMP/r014-mask/out/imported_actual.json"
      - name: Red-team true evaluated body/face/hair source fidelity of each candidate
        env:
          SEX: ${{ matrix.sex }}
          STRATEGY: ${{ matrix.strategy }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/r014-glb-numeric/bin/activate"
          python r014/cc0_source_glb_spatial_compare.py \
             --source "$RUNNER_TEMP/r014-mask/out/source_actual.json" \
             --imported "$RUNNER_TEMP/r014-mask/out/imported_actual.json" \
             --out "$RUNNER_TEMP/r014-mask/out/fidelity_${SEX}_${STRATEGY}.json"
      - name: Keep all failed strategy receipts, never approve a plausible-looking GLB only on animation channels
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r014-cc0-native-export-${{ matrix.strategy }}-${{ matrix.sex }}
          path: |
            ${{ runner.temp }}/r014-mask/out/*.json
          if-no-files-found: warn
          retention-days: 7
