name: R015 Rolling PyTorch Uplift — SafeTensors Converted Original Mapper Parity
on:
  push:
    branches:
      - research/r015-continuous-uplift-r3-20261112
    paths:
      - '.github/workflows/r015-rolling-torch-uplift.yml'
      - 'research/r015_prior_art/semantify_pretrained.py'
      - 'research/r015_prior_art/safetensors_framework_parity.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r015-rolling-torch-uplift
  cancel-in-progress: true
jobs:
  safe-conversion-and-modern-native-parity:
    name: Original 2.5 restricted load → SafeTensors → PyTorch ${{ matrix.target_torch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target_torch: ['2.14.0','2.15.0']
    steps:
      - name: Checkout isolated public research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Create ephemeral exact legacy importer and modern target environments
        env:
          TARGET_TORCH: ${{ matrix.target_torch }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r015-compat"
          . "$RUNNER_TEMP/r015-compat/bin/activate"
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir omegaconf==2.3.0 safetensors==0.4.5 numpy==1.26.4
          deactivate
          python3 -m venv "$RUNNER_TEMP/r015-modern"
          . "$RUNNER_TEMP/r015-modern/bin/activate"
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir "torch==$TARGET_TORCH" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-input --no-cache-dir safetensors==0.4.5
          python - <<'PY'
          import torch,safetensors,sys
          print("TARGET_TORCH",torch.__version__,"CUDA",torch.version.cuda,"PYTHON",sys.version.split()[0])
          assert not torch.cuda.is_available()
          PY
      - name: Fetch original exact Semantify source without setup/build scripts
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/original"
          git -C "$RUNNER_TEMP/original" fetch -q --depth 1 https://github.com/Omergral/Semantify.git 78b001d3dc4ea4efa428e3aff1213cefddf6ebd8
          git -C "$RUNNER_TEMP/original" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/original" rev-parse HEAD)" = 78b001d3dc4ea4efa428e3aff1213cefddf6ebd8
      - name: Export ONLY tensor payload through pinned restricted PyTorch 2.5.1 legacy importer
        env:
          R015_SAFE_TENSOR_EXPORT: ${{ runner.temp }}/original-mapper-tensors.safetensors
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/r015-compat/bin/activate"
          python research/r015_prior_art/semantify_pretrained.py "$RUNNER_TEMP/original" "receipts/conversion.json"
          test -s "$R015_SAFE_TENSOR_EXPORT"
          python - <<'PY'
          import json
          r=json.load(open("receipts/conversion.json"))
          assert r["status"]=="PASS_ACTUAL_PUBLISHED_MAPPER_NUMERIC_FORWARD_ONLY"
          assert r["safe_tensor_export"]["asset_redistributed"] is False
          print("EXACT_HASH_SAFE_CONVERSION",r["safe_tensor_export"]["sha256"])
          PY
      - name: Load model under current framework from SafeTensors and compare original raw-CLIP fixtures
        env:
          TARGET_TORCH: ${{ matrix.target_torch }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/r015-modern/bin/activate"
          python research/r015_prior_art/safetensors_framework_parity.py --source "$RUNNER_TEMP/original" --weights "$RUNNER_TEMP/original-mapper-tensors.safetensors" --conversion-receipt receipts/conversion.json --reference evidence/r015-prior-art-bakeoff/43278119546-realclip-original-pretrained-mapper.json --out "receipts/parity-$TARGET_TORCH.json"
      - name: Retain receipts, never trained weights or restricted model archive
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r015-modern-torch-${{ matrix.target_torch }}
          path: receipts/*.json
          if-no-files-found: warn
          retention-days: 7
