name: R059 actual synthetic Cycles shading normal vs native geometric hemisphere

on:
  push:
    branches:
      - research/r059-normal-pass-semantic-public-20261116
    paths:
      - 'normalprobe/**'
      - '.github/workflows/r059-normal-pass.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r059-public-synthetic-normal-pass
  cancel-in-progress: true

jobs:
  independent-normal-pass:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install disposable free public CPU Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version | head -3
      - name: Render two actual source-identical material-arm Cycles PNG/EXR pairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          blender -b -t 2 --python normalprobe/scene.py -- --out out
          test -s out/r059_source.json
          for arm in baseline physical_material; do
            test -s "out/$arm/render_passes.exr"
            test -s "out/$arm/beauty.png"
          done
      - name: Independently decode true EXR normal pixel arrays and negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r059-pixel"
          "$RUNNER_TEMP/r059-pixel/bin/pip" install --disable-pip-version-check \
            --only-binary=:all: --no-cache-dir numpy==1.26.4 OpenEXR==3.3.3
          "$RUNNER_TEMP/r059-pixel/bin/python" -m unittest discover \
            -s normalprobe -p test_audit.py -v
          "$RUNNER_TEMP/r059-pixel/bin/python" normalprobe/audit.py \
            --root out --out out/r059_report.json
          grep -F '"status": "PASS_NARROW_REAL_CYCLES_EXR_NORMAL_HEMISPHERE"' out/r059_report.json
          (cd out && find . -type f ! -name artifact_manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifact_manifest.sha256)
          (cd out && sha256sum -c artifact_manifest.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r059-public-original-synthetic-normal-witness-HOLD
          path: out/
          retention-days: 3
          if-no-files-found: warn
