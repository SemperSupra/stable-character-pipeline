name: R014 source-provenance and optical-motion red-team QA
on:
  push:
    branches: [research/r014-video-visual-qa-v1]
    paths: [r014/**, .github/workflows/r014-video-visual-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r014-video-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source_and_video_audit:
    strategy:
      fail-fast: false
      matrix:
        sex: [female, male]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail fast on script syntax before fetching source videos
        run: python3 -m compileall -q r014
      - name: Disposable pinned video QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r014-visual-env"
          "$RUNNER_TEMP/r014-visual-env/bin/pip" install --disable-pip-version-check --no-cache-dir \
            numpy==2.2.6 opencv-python-headless==4.11.0.86
          echo "PYTHON_QA=$RUNNER_TEMP/r014-visual-env/bin/python" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download ONLY prior verified public model/video artifact snapshots
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-qa/motion" "$RUNNER_TEMP/r014-qa/source" \
                   "$RUNNER_TEMP/r014-qa/sculpt" "$RUNNER_TEMP/r014-qa/out"
          gh run download 43229574927 --repo "$GITHUB_REPOSITORY" \
            --name "r014-mpfb-textured-motion-${{ matrix.sex }}-research" \
            --dir "$RUNNER_TEMP/r014-qa/motion"
          gh run download 43207664661 --repo "$GITHUB_REPOSITORY" \
            --name r014-mpfb-eye-MAKESKIN-lookdev \
            --dir "$RUNNER_TEMP/r014-qa/source"
          gh run download 43212080935 --repo "$GITHUB_REPOSITORY" \
            --name r014-blenderstudio-cc0-realistic-base-research \
            --dir "$RUNNER_TEMP/r014-qa/sculpt"
          test -s "$RUNNER_TEMP/r014-qa/motion/R014_MPFB_${{ matrix.sex }}_textured_technical_motion_3s.mp4"
          test -s "$RUNNER_TEMP/r014-qa/motion/motion_receipt.json"
          test -s "$RUNNER_TEMP/r014-qa/source/generation.json"
          test -s "$RUNNER_TEMP/r014-qa/sculpt/inventory.json"
      - name: Independent automated video and model-grade audit with negative controls
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_QA" r014/visual_qa_video.py --self-test
          "$PYTHON_QA" r014/visual_qa_video.py \
            --sex "${{ matrix.sex }}" \
            --video "$RUNNER_TEMP/r014-qa/motion/R014_MPFB_${{ matrix.sex }}_textured_technical_motion_3s.mp4" \
            --receipt "$RUNNER_TEMP/r014-qa/motion/motion_receipt.json" \
            --generation "$RUNNER_TEMP/r014-qa/source/generation.json" \
            --studio "$RUNNER_TEMP/r014-qa/sculpt/inventory.json" \
            --out "$RUNNER_TEMP/r014-qa/out"
          test -s "$RUNNER_TEMP/r014-qa/out/qa.json"
          test -s "$RUNNER_TEMP/r014-qa/out/visual_diagnostics.png"
          "$PYTHON_QA" - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'r014-qa/out/qa.json').read_text())
          assert r['visual_quality']=='HOLD' and not r['provenance_errors']
          assert 'NO_4K_HIGH_RES_RENDER_448x576' in r['promotion_holds']
          print('PASS_EVIDENCE_CAPTURE; VIDEO_NOT_QUALIFIED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-visual-qa-${{ matrix.sex }}-evidence
          path: ${{ runner.temp }}/r014-qa/out/*
          retention-days: 7
