name: Audio Control R1 read-only PR-stack merge simulation
on:
  pull_request:
    paths:
      - 'scripts/audio-control-audit/**'
      - 'docs/architecture/AUDIO-CONTROL-STACK-REVIEW-R1.md'
      - '.github/workflows/audio-control-r1-merge-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merge-tree-observability-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Print exact source refs and simulate tree merge (NO remote write)
        run: bash scripts/audio-control-audit/check_merge_tree.sh
