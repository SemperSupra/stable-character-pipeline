name: R1 motion target-rig OOD and lineage independent CPU
on:
  pull_request:
    paths:
      - 'research/motion-learning-critic-r0/r1_ood_test.go'
      - '.github/workflows/motion-r1-ood-falsifiers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-safe-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [unseen-rig, lineage-and-invalid]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: research/motion-learning-critic-r0/go.mod
          cache: false
      - name: Independently falsify R0 claim limits
        shell: bash
        working-directory: research/motion-learning-critic-r0
        run: |
          set -euo pipefail
          case '${{ matrix.lane }}' in
            unseen-rig) go test -count=1 -v -run '^TestR1UnseenTargetRigFailure$' ./... ;;
            lineage-and-invalid) go test -count=1 -v -run '^TestR1(NoTrainTestFamilyOverlap|TargetRigInvalidAndSourcePreserved)$' ./...; go vet ./... ;;
          esac
