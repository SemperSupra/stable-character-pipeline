name: R024 synthetic stance residual causality falsifier
on:
  pull_request:
    paths:
      - 'r024/causality/**'
      - '.github/workflows/r024-stance-causality-synthetic.yml'
permissions:
  contents: read
concurrency:
  group: r024-stance-residual-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Adversarial synthetic qualification
        working-directory: r024/causality
        run: |
          go test -race -count=1 -v ./...
          go vet ./...
