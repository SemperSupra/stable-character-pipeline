name: R074 actual Blender fractional-frame keyed skin vs independent LBS and EXR

on:
  push:
    branches: [research/r074-subframe-skin-actual-cycles-20261117]
    paths:
      - 'subframeprobe/**'
      - '.github/workflows/r074-keyed-subframes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r074-public-real-bone-subframe
  cancel-in-progress: true

jobs:
  actual-native-keyed-subframes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install disposable original-only Blender CPU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version | head -3
      - name: Evaluate genuine keyed Blender armature at frame and subframe locations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          blender -b -t 2 --python subframeprobe/scene.py -- --out out
          test -s out/r074_source.json
          for t in t000 t050 t100 t150 t200; do
            test -s "out/$t/beauty.png"
            test -s "out/$t/render_passes.exr"
          done
      - name: Independent numerical LBS, EXR source rays and adversarial subframe controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r074-exr"
          "$RUNNER_TEMP/r074-exr/bin/pip" install --disable-pip-version-check \
            --only-binary=:all: --no-cache-dir numpy==1.26.4 OpenEXR==3.3.3
          "$RUNNER_TEMP/r074-exr/bin/python" -m unittest discover \
            -s subframeprobe -p test_audit.py -v
          "$RUNNER_TEMP/r074-exr/bin/python" subframeprobe/audit.py \
            --root out --out out/r074_report.json
          grep -F '"status": "PASS_NARROW_ACTUAL_BLENDER_KEYED_SUBFRAME_SKIN_EXR"' out/r074_report.json
          (cd out && find . -type f ! -name artifact_manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifact_manifest.sha256)
          (cd out && sha256sum -c artifact_manifest.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r074-free-original-real-keyed-skin-subframe-HOLD
          path: out/
          retention-days: 3
          if-no-files-found: warn
