name: video-original-dive-grounded-takeoff-ab
on:
  pull_request:
    paths:
      - 'qualification/video_dive_takeoff/**'
      - '.github/workflows/video-original-dive-takeoff.yml'
permissions:
  contents: read
concurrency:
  group: video-original-dive-ab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-original-dive-glb-h264:
    name: Real 40f source-original dive grounded stance vs candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install source rendering requirements only on disposable public Ubuntu VM
        env:
          PY: ${{ runner.temp }}/original-dive-venv
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          python3 -m venv "$PY"
          "$PY/bin/python" -m pip install --no-cache-dir --disable-pip-version-check \
            numpy==2.3.5 opencv-python-headless==4.13.0.92
      - name: Independently generate original/candidate true GLB and H264 with unmoved source hip
        env:
          PY: ${{ runner.temp }}/original-dive-venv
        run: |
          set -euo pipefail
          "$PY/bin/python" qualification/video_dive_takeoff/dive_ab.py --out qualification/video_dive_takeoff/runs
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("qualification/video_dive_takeoff/runs")
          d=json.loads((root/"dive-ab.json").read_text())
          assert d["schema"]=="scp.original-dive-grounded-takeoff-ab.v1"
          assert d["case"]=="male_diving_barefoot"
          assert d["original"]["status"]=="FAIL" and d["candidate"]["status"]=="PASS"
          assert d["original"]["defect_count"]==16 and d["candidate"]["defect_count"]==0
          assert d["contact_labels_unchanged"] and d["source_hip_horizontal_trajectories_unchanged"]
          assert d["source_crouch_hip_height_adjusted"] and d["contact_foot_support_envelope_at_z0"]
          for label,receipt in (("original","original_media"),("candidate","candidate_media")):
            for suffix,key in ((".glb","glb_sha256"),("_side.mp4","h264_sha256")):
              path=root/label/("male_diving_barefoot"+suffix)
              assert hashlib.sha256(path.read_bytes()).hexdigest()==d[receipt][key]
          print("REAL_DIVE_SOURCE_AND_H264_A_B",d["original"]["defect_count"],d["candidate"]["defect_count"])
          PY
          printf 'rights=rights_original_only\noriginal_22_case_negative_controls=UNCHANGED\nscience=TARGETED_CONTACT_NOT_PHYSICAL_DIVE_OR_WATER_ENTRY\n' >qualification/video_dive_takeoff/runs/qualification.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-original-dive-grounded-stance-real-glb-h264-ab
          path: qualification/video_dive_takeoff/runs/
          retention-days: 7
          if-no-files-found: error
