name: R014 public native rig qualification (synthetic only)
on:
  push:
    branches:
      - research/r014-native-qualification-v1
    paths:
      - r014/**
      - .github/workflows/r014-public-native-qualification.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r014-public-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Standard library structural negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify positive and negative controls
        run: python3 -m unittest discover -v -s r014/tests
      - name: Produce minimal non-private receipt
        run: |
          python3 - <<'PY'
          import json,platform,subprocess
          payload={'status':'PASS_UNIT','lane':'contract',
                   'python':platform.python_version(),
                   'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                   'limit':'Does not measure realistic human anatomy or soft-tissue physics'}
          open('contract-receipt.json','w').write(json.dumps(payload,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r014-stdlib-qualification
          path: contract-receipt.json
          retention-days: 7
  blender-native:
    name: Official Blender native saved-reopened rig and GLB
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Obtain portable Blender 4.5.16 with upstream SHA-256 guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-blender"
          cd "$RUNNER_TEMP/r014-blender"
          base="https://download.blender.org/release/Blender4.5"
          curl -fL --retry 3 --connect-timeout 20 "$base/blender-4.5.16.sha256" -o upstream.sha256
          curl -fL --retry 3 --connect-timeout 20 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          hash="$(grep -F blender-4.5.16-linux-x64.tar.xz upstream.sha256 | awk '{print $1}')"
          test "${#hash}" -eq 64
          printf '%s  %s\n' "$hash" 'blender-4.5.16-linux-x64.tar.xz' | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          binary="$(find "$RUNNER_TEMP/r014-blender" -maxdepth 2 -type f -name blender | head -1)"
          test -n "$binary"
          "$binary" --background --factory-startup --version | head -3
          echo "BLENDER_BIN=$binary" >> "$GITHUB_ENV"
      - name: Create fixture, fresh-process reopen, deform, export, validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-evidence"
          "$BLENDER_BIN" --background --factory-startup --python r014/blender_native_probe.py -- \
            --phase create --blend "$RUNNER_TEMP/r014-evidence/native.blend" \
            --receipt "$RUNNER_TEMP/r014-evidence/create.json"
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014-evidence/native.blend" --python r014/blender_native_probe.py -- \
            --phase verify --blend "$RUNNER_TEMP/r014-evidence/native.blend" \
            --receipt "$RUNNER_TEMP/r014-evidence/verify.json"
          python3 r014/qa_gltf.py "$RUNNER_TEMP/r014-evidence/r014_native_synthetic.glb" \
            --receipt "$RUNNER_TEMP/r014-evidence/gltf.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-native-blender
          path: ${{ runner.temp }}/r014-evidence/*
          retention-days: 7
