name: R077 B R009 actual native original 72-frame H264 and decoded HOLD
on:
  push:
    branches: [research/r077-r009-full-72-h264-20261118]
    paths:
      - 'research/r077-r009-full-72-h264/**'
      - '.github/workflows/r077-r009-full-72-h264.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r077b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Hostile source manifest tests
        run: |
          set -euo pipefail
          cd research/r077-r009-full-72-h264
          python3 -m unittest -v test_render_contract
          python3 -m py_compile render_full.py test_render_contract.py
  native-full-72-frame-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate and independently verify original fictional two-human source GLB
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r077-b"
          python3 qualification/original_reusable_characters/generate_original_glb.py --out "$RUNNER_TEMP/r077-b/original.glb" --receipt "$RUNNER_TEMP/r077-b/producer.json"
          python3 qualification/original_reusable_characters/verify_original_glb.py --input "$RUNNER_TEMP/r077-b/original.glb" --receipt "$RUNNER_TEMP/r077-b/verify.json"
      - name: Install FFmpeg Xvfb and official SHA-pinned Blender 4.5.15
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg xvfb xauth libegl1 libgl1 libgl1-mesa-dri libgbm1
          curl --fail --location --retry 3 --silent --show-error https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o "$RUNNER_TEMP/blender.sha256"
          curl --fail --location --retry 3 --silent --show-error https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP"; grep 'blender-4.5.15-linux-x64.tar.xz' blender.sha256 | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz" -C "$RUNNER_TEMP"
      - name: Native original source to saved editable Blender scene
        run: |
          set -euo pipefail
          b="$RUNNER_TEMP/blender-4.5.15-linux-x64/blender"
          source_sha="$(sha256sum "$RUNNER_TEMP/r077-b/original.glb" | cut -d' ' -f1)"
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 "$b" -b --factory-startup --python-exit-code 8 --python research/r074-r009-native-smoke/inspect_blend.py -- --mode build --glb "$RUNNER_TEMP/r077-b/original.glb" --glb-sha "$source_sha" --saved "$RUNNER_TEMP/r077-b/saved.blend" --out "$RUNNER_TEMP/r077-b/build.json"
          python3 - "$RUNNER_TEMP/r077-b/build.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['scene_frames']==72 and r['mvp_accepted'] is False
          PY
      - name: Independent fresh Blender process reopens and renders ALL 72 frames
        run: |
          set -euo pipefail
          b="$RUNNER_TEMP/blender-4.5.15-linux-x64/blender"
          source_sha="$(sha256sum "$RUNNER_TEMP/r077-b/original.glb" | cut -d' ' -f1)"
          saved_sha="$(sha256sum "$RUNNER_TEMP/r077-b/saved.blend" | cut -d' ' -f1)"
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 "$b" -b --factory-startup --python-exit-code 12 --python research/r077-r009-full-72-h264/render_full.py -- --saved "$RUNNER_TEMP/r077-b/saved.blend" --saved-sha "$saved_sha" --glb-sha "$source_sha" --frames "$RUNNER_TEMP/r077-b/frames72" --out "$RUNNER_TEMP/r077-b/frames.json"
          test "$(find "$RUNNER_TEMP/r077-b/frames72" -name 'frame_*.png' | wc -l)" -eq 72
      - name: Full H264 encode independent decode and exact frame count
        run: |
          set -euo pipefail
          ffmpeg -nostdin -v error -y -framerate 12 -start_number 0 -i "$RUNNER_TEMP/r077-b/frames72/frame_%03d.png" -frames:v 72 -c:v libx264 -pix_fmt yuv420p -crf 21 "$RUNNER_TEMP/r077-b/full-72.mp4"
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/r077-b/full-72.mp4" | grep -x 72
          ffmpeg -nostdin -v error -i "$RUNNER_TEMP/r077-b/full-72.mp4" -map 0:v:0 -f framemd5 "$RUNNER_TEMP/r077-b/decoded.framemd5"
          python3 - "$RUNNER_TEMP/r077-b" <<'PY'
          import pathlib,json,hashlib,sys
          d=pathlib.Path(sys.argv[1]);r=json.loads((d/'frames.json').read_text())
          lines=[x for x in (d/'decoded.framemd5').read_text().splitlines() if x.strip() and not x.startswith('#')]
          names=[x.split(',')[-1].strip() for x in lines]
          assert len(lines)==72,(len(lines),'decoded frames not 72')
          assert len(set(names))>=3 and names[0]!=names[-1],'false static full-film'
          assert r['actual_rendered_frame_count']==72
          assert r['status']=='HOLD_NATIVE_GAIT_CONTACT_AND_REAL_CHARACTER_RIGHTS'
          assert not r['mvp_accepted'] and not r['release_authorized']
          r['h264_encoded']=True
          r['h264_sha256']=hashlib.sha256((d/'full-72.mp4').read_bytes()).hexdigest()
          r['decoded_frames']=len(lines)
          r['decoded_framemd5_sha256']=hashlib.sha256((d/'decoded.framemd5').read_bytes()).hexdigest()
          (d/'final.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          print('R077_B_REAL_FULL_72_H264_HOLD',r['h264_sha256'])
          PY
      - name: Upload only original synthetic JSON receipts; never binary film/models
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r077-b-source-only-receipts-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r077-b/*.json
          retention-days: 3
