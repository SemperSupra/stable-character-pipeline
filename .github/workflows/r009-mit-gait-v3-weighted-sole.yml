name: R009 V3 local Z original MIT native all72 weighted foot observation
on:
  pull_request:
    paths:
      - 'qualification/rocketbox_sole_v3/**'
      - '.github/workflows/r009-mit-gait-v3-weighted-sole.yml'
concurrency:
  group: r009-v3-native-sole-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  original-native-sole-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source-safe independent synthetic hostile tests
        run: |
          set -euo pipefail
          cd qualification/rocketbox_sole_v3
          python3 -m unittest -v test_observer_v3
      - name: Fetch exact original #274 artifact and independently assert whole bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-original"
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/SemperSupra/stable-character-pipeline/actions/artifacts/13305643308/zip \
            -o "$RUNNER_TEMP/native-source.zip"
          echo '2bbf1036744e4fcd614cd207bc9e9eb2147b943f59c53d9de7dff1b324320204  '"$RUNNER_TEMP/native-source.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/native-source.zip"
          unzip -q "$RUNNER_TEMP/native-source.zip" -d "$RUNNER_TEMP/native-original"
          echo '2e5c5fcc826c95d200b06cc2dcd22138944102426a86f1f683689ae458aff7ab  '"$RUNNER_TEMP/native-original/motion/mit_rocketbox_walk_candidate.blend" | sha256sum -c -
      - name: Install checksum-pinned Blender 4.5.15 and headless requirements
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1 libgl1-mesa-dri libgbm1
          curl -fLsS --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o "$RUNNER_TEMP/blender.sha256"
          curl -fLsS --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP"; grep 'blender-4.5.15-linux-x64.tar.xz' blender.sha256 | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz" -C "$RUNNER_TEMP"
      - name: Observe actual evaluated original skinned-foot regions for every 72 frames
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender-4.5.15-linux-x64/blender" \
            -b --factory-startup --python-exit-code 8 \
            --python qualification/rocketbox_sole_v3/observer_v3.py \
            -- "$RUNNER_TEMP/native-original/motion/mit_rocketbox_walk_candidate.blend" "$RUNNER_TEMP/sole-observation.json" \
            2e5c5fcc826c95d200b06cc2dcd22138944102426a86f1f683689ae458aff7ab
          python3 - "$RUNNER_TEMP/sole-observation.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['schema']=='scp.r009.mit_native_v3_weighted_foot_observation.v1'
          assert r['frames']==72 and r['fps']==12 and r['product_accepted'] is False
          assert r['source_v3_head']=='2a8a9a168b60b742c0c0bcb8be40cd46cf3ab45c'
          assert r['physical_contact']=='UNKNOWN' and r['biological_gait']=='UNKNOWN'
          assert set(r['measured_regions'])=={'RB_RB_F01_root','RB_RB_F02_root'}
          assert all(set(v)=={'L','R'} for v in r['measured_regions'].values())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r009-v3-original-weighted-foot-72f
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/sole-observation.json
