name: Motion R2 actual upstream VMD interpolation and semantic loss CPU
on:
  pull_request:
    paths:
      - 'research/motion-mmd-curve-r2/**'
      - '.github/workflows/motion-r2-mmd-curve.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [native-parser, subframe-loss, semantic-loss]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Obtain exact upstream open-source MMD Tools v4.5.14, no MMD third-party media
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Independent exact pinned upstream VMD read/write and original numeric cases
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile research/motion-mmd-curve-r2/probe.py
          python3 research/motion-mmd-curve-r2/probe.py --upstream vendor/mmd-tools --lane '${{ matrix.lane }}'
