name: R166 Public-Safe Render Request Contract

on:
  push:
    branches:
      - rdte/r166-public-rendercontract
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r166-render-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-render-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout original public-safe standalone Go module
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm public-only scope and run exact source
        shell: bash
        working-directory: tests/rdte/r166_rendercontract
        run: |
          set -euo pipefail
          test "${{ github.event.repository.private }}" = "false"
          test ! -e ../../../internal/engineadapter
          test ! -e ../../../internal/renderhost
          go version
          # Canonical formatting is a deterministic local transform; emit
          # formatted bytes for a subsequent Git source reconciliation.
          gofmt -w contract.go contract_test.go
          echo "R166 gofmt diff vs checked-in source follows (not an exact-source PASS):"
          git diff -- contract.go contract_test.go || true
          go test -race -count=3 ./... -v
          go vet ./...
          sha256sum contract.go contract_test.go go.mod
          echo "R166 SYNTHETIC RENDER REQUEST CONTRACT PASS (no private Oneirifact code)"
      - name: Emit only allowlisted public synthetic formatted source for exact PR readback
        shell: bash
        working-directory: tests/rdte/r166_rendercontract
        run: |
          set -euo pipefail
          test "${{ github.event.repository.private }}" = "false"
          python3 - <<'PY'
          import hashlib, json, pathlib
          for name in ("contract.go", "contract_test.go"):
              content = pathlib.Path(name).read_bytes()
              receipt = {"path": name, "sha256": hashlib.sha256(content).hexdigest(), "content": content.decode("utf-8")}
              print("R166_FORMATTED_SOURCE_JSON=" + json.dumps(receipt, separators=(",", ":")))
          PY
      - name: Retain exact formatted public synthetic source for reconciliation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r166-gofmt-source
          path: |
            tests/rdte/r166_rendercontract/contract.go
            tests/rdte/r166_rendercontract/contract_test.go
          retention-days: 3
          if-no-files-found: error
