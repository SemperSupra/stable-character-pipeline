name: R036 Coordinate Frame Unit Axis and Provenance Guard
on:
  push:
    branches:
      - research/r036-frame-custody-20261116
    paths:
      - 'research/anatomy-bakeoff/framecustody/**'
      - '.github/workflows/anatomy-r036-frames.yml'
  pull_request:
    paths:
      - 'research/anatomy-bakeoff/framecustody/**'
      - '.github/workflows/anatomy-r036-frames.yml'
permissions:
  contents: read
concurrency:
  group: r036-frame-custody-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typed-reference-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/anatomy-bakeoff
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Original Go stdlib race/vet and hostile model-source controls
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          go version
          go test -race -count=1 ./...
          go vet ./...
