name: R014 reproductive reference anatomy source qualification
on:
  push:
    branches: [research/r014-reproductive-source-v1]
    paths: [r014/**, .github/workflows/r014-reproductive-reference-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-sourced-reference:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sex: male
            repo: organui/prostate-3d
            sha: 204c67a54226a19868abd0a5e8449a7f82827bf9
          - sex: female
            repo: organui/uterus-3d
            sha: 404a6039b2d667e2b4e08ae71d4964cd9b963cf1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: _reference
          persist-credentials: false
      - name: Assert source revision and run licensing negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _reference rev-parse HEAD)" = "${{ matrix.sha }}"
          python3 r014/reproductive_reference_qa.py --self-test
      - name: Inventory official source geometry, data rights and internal structures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-reference"
          python3 r014/reproductive_reference_qa.py \
            --root _reference --sex "${{ matrix.sex }}" \
            --repo "${{ matrix.repo }}" --sha "${{ matrix.sha }}" \
            --out "$RUNNER_TEMP/r014-reference/${{ matrix.sex }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r014-anatomy-${{ matrix.sex }}-license-geometry-receipt
          path: ${{ runner.temp }}/r014-reference/*.json
          retention-days: 7
