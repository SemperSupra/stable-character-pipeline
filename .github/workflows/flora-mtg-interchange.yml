name: Flora MTG-LPy-PlantGL-Blender interchange CPU qualification

on:
  pull_request:
    paths:
      - '.github/workflows/flora-mtg-interchange.yml'
      - '.github/workcells/flora_mtg_interchange.py'
      - '.github/workcells/flora_blender_roundtrip.py'
      - '.github/workcells/flora_ab_compare.py'
      - 'tropical-fauna-flora/cmd/floratraits/**'
      - 'tropical-fauna-flora/examples/flora_traits_synthetic.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flora-mtg-interchange-pr-13
  cancel-in-progress: true

jobs:
  interchange:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Checkout original public synthetic source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Go from existing public source module
        uses: actions/setup-go@v5
        with:
          go-version-file: tropical-fauna-flora/go.mod
          cache: false
      - name: Generate exact original Go source GLB and config receipt
        run: |
          set -euo pipefail
          cd tropical-fauna-flora
          go test -count=1 ./...
          go test -race -count=1 ./cmd/floratraits
          go vet ./cmd/floratraits
          mkdir -p ../out/flora-mtg-interchange
          go run ./cmd/floratraits -input examples/flora_traits_synthetic.json > ../out/flora-mtg-interchange/flora_trait_receipt.json
          test -s ../out/flora-mtg-interchange/flora_trait_receipt.json
          go run . -config scene.json -out ../out/flora-mtg-interchange/go-source
          sha256sum ../out/flora-mtg-interchange/go-source/tropical_scene.glb
      - name: Install exact previously proven L-Py and PlantGL plus upstream MTG
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: flora-mtg-interchange
          create-args: >-
            -c openalea3
            -c conda-forge
            python=3.11
            openalea.lpy=3.15.4
            openalea.plantgl=3.23.2
            openalea.mtg=2.3.0
          cache-environment: false
          cache-downloads: false
      - name: Execute upstream MTG lineage and L-Py PlantGL OBJ tessellation
        shell: bash -l {0}
        env:
          QT_QPA_PLATFORM: offscreen
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python -m py_compile .github/workcells/flora_mtg_interchange.py .github/workcells/flora_blender_roundtrip.py
          python .github/workcells/flora_mtg_interchange.py --out out/flora-mtg-interchange/source
      - name: Bound and install headless Blender on free public CPU
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo timeout --signal=TERM --kill-after=10s 120s apt-get update -qq
          sudo timeout --signal=TERM --kill-after=10s 220s apt-get install -y -qq --no-install-recommends blender xvfb python3-numpy
          blender --version | head -n 2
      - name: Verify actual OBJ to GLB interchange and editable Blender readback
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python .github/workcells/flora_blender_roundtrip.py -- --source out/flora-mtg-interchange/source --out out/flora-mtg-interchange/blender
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("out/flora-mtg-interchange/blender")
          receipt=json.loads((root/"roundtrip_receipt.json").read_text())
          assert receipt["schema"]=="scp.flora.glb_roundtrip.v1"
          assert receipt["status"]=="OBJ_GEOMETRY_AND_GLB_LINEAGE_BOUNDS_PASS"
          assert receipt["glb_organs"]==15
          assert (root/"synthetic_flora_lineage.glb").read_bytes()[:4]==b"glTF"
          assert (root/"synthetic_flora_lineage.blend").read_bytes()[:7]==b"BLENDER"
          for name in ("front","side"):
              candidate=root/("diagnostic_"+name+".png")
              assert candidate.read_bytes()[:8]==b"\x89PNG\r\n\x1a\n" and candidate.stat().st_size>4096
              assert receipt["diagnostic_views"][name]
          print("F1C_ARTIFACTS_AND_RECEIPT_PRESENT")
          PY
      - name: Native Blender A/B camera and quantitative morphology comparison
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          xvfb-run -a blender -b -t 2 --python-exit-code 1 --python .github/workcells/flora_ab_compare.py -- --original-glb out/flora-mtg-interchange/go-source/tropical_scene.glb --derived-glb out/flora-mtg-interchange/blender/synthetic_flora_lineage.glb --roundtrip-receipt out/flora-mtg-interchange/blender/roundtrip_receipt.json --scene-config tropical-fauna-flora/scene.json --out out/flora-mtg-interchange/ab
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path("out/flora-mtg-interchange/ab")
          d=json.loads((root/"ab_receipt.json").read_text())
          assert d["schema"]=="scp.flora.ab-comparison.v1"
          assert set(d["metrics"])=={"go_banana","openalea_fixture","go_palm"}
          assert [d["metrics"][x]["mesh_count"] for x in ("go_banana","openalea_fixture","go_palm")]==[8,15,10]
          for name,expected in d["views_sha256"].items():
              p=root/("ab_"+name+".png")
              assert p.stat().st_size>4096 and p.read_bytes()[:8]==bytes((137,80,78,71,13,10,26,10))
              assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
          print("F1E_THREE_SYNTHETIC_SOURCE_IMAGES_AND_METRICS_PRESENT")
          PY
      - name: Upload bounded synthetic qualification receipts, no third-party assets
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flora-mtg-interchange-run
          path: |
            out/flora-mtg-interchange/source/source_receipt.json
            out/flora-mtg-interchange/blender/roundtrip_receipt.json
            out/flora-mtg-interchange/blender/synthetic_flora_lineage.glb
            out/flora-mtg-interchange/blender/synthetic_flora_lineage.blend
            out/flora-mtg-interchange/blender/diagnostic_front.png
            out/flora-mtg-interchange/blender/diagnostic_side.png
            out/flora-mtg-interchange/ab/ab_receipt.json
            out/flora-mtg-interchange/ab/ab_go_banana.png
            out/flora-mtg-interchange/ab/ab_openalea_fixture.png
            out/flora-mtg-interchange/ab/ab_go_palm.png
            out/flora-mtg-interchange/flora_trait_receipt.json
          retention-days: 3
          if-no-files-found: error
