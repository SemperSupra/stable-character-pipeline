name: R13 original synthetic human UI event qualification
on:
  pull_request:
    paths:
      - 'scenejob/r13_ui_test.cjs'
      - 'scenejob/ui.js'
      - '.github/workflows/r13-human-ui-contract.yml'
permissions:
  contents: read
jobs:
  human-ui-event-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Execute unchanged native human UI JavaScript with test DOM and real submit callbacks
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          node scenejob/r13_ui_test.cjs
