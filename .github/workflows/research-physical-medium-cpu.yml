name: "Research · Synthetic gas-medium CPU"
on:
  pull_request:
    paths:
      - "research/physical-medium/**"
      - ".github/workflows/research-physical-medium-cpu.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  offline-go-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout isolated public-safe research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Go stdlib-only offline race tests and vet
        shell: bash
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: "local"
        run: |
          set -euo pipefail
          go version
          cd "research/physical-medium"
          go test -race -count=1 ./...
          go vet ./...
