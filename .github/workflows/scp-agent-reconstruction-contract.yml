name: Agent reconstruction candidate-only contract
on:
  pull_request:
    paths:
      - 'qualification/agent_reconstruction/**'
      - '.github/workflows/scp-agent-reconstruction-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Verify offline contract
        working-directory: qualification/agent_reconstruction
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go run . capabilities
