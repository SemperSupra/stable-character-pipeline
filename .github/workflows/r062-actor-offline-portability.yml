name: R062 local-only actor receipt CLI native portability
on:
  pull_request:
    paths:
      - 'research/r051-batch/**'
      - '.github/workflows/r062-actor-offline-portability.yml'
permissions:
  contents: read
jobs:
  independent-native-platform:
    name: R062 / native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: research/r051-batch/go.mod
          cache: false
      - name: Linux race, vet and admission attacks
        if: runner.os == 'Linux'
        working-directory: research/r051-batch
        shell: bash
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
        run: |
          set -euo pipefail
          go vet ./...
          go test -race -count=1 -v ./...
          echo 'R062_LINUX_ACTUAL_SOURCE_SAFE_PASS'
      - name: Native Windows PowerShell 5.1 Go CLI and unicode file paths
        if: runner.os == 'Windows'
        working-directory: research/r051-batch
        shell: powershell
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: 'local'
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "Expected Windows PowerShell 5.1" }
          Write-Output ('R062_WINDOWS_NATIVE_PS5_VERSION=' + $PSVersionTable.PSVersion.ToString())
          go version
          if ($LASTEXITCODE -ne 0) { throw "go version failed" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed" }
          go test -count=1 -v ./...
          if ($LASTEXITCODE -ne 0) { throw "offline native Windows tests failed" }
          Write-Output 'R062_WINDOWS_PS51_SOURCE_ONLY_PASS'
