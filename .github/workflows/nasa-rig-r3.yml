name: NASA R3 sampled landmark to skinned GLB and Blender CPU
on:
  pull_request:
    paths:
      - 'qualification/nasa_rig_r3/**'
      - '.github/workflows/nasa-rig-r3.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nasa-r3-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skinned-glb-readback:
    if: github.event_name == 'workflow_dispatch' # HEAVY BLENDER: deliberately manual after public apt mirror 15m timeout
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GO111MODULE: 'off'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      PYTHONUNBUFFERED: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify fixed-source guards and R3 Go negative controls
        run: |
          python -m unittest discover -v -s qualification/nasa_pair -p 'test_*.py'
          python -m py_compile qualification/nasa_rig_r3/blender_verify.py
          go test -v ./qualification/nasa_rig_r3
      - name: Install pinned model inference and public CPU renderer
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir 'mediapipe==0.10.21'
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg blender python3-numpy python3-pil
          ffmpeg -version | head -n 1
          blender --version | head -n 1
      - name: Reproduce original NASA R2 source and landmark observations on this runner
        run: python qualification/nasa_pair/r2_probe.py --out nasa-pair-output
      - name: Generate actual animated glTF skin with Go (camera plane only)
        run: |
          go run qualification/nasa_rig_r3/main.go \
            -input nasa-pair-output/video_landmarks.json \
            -receipt nasa-pair-output/receipt.json \
            -out pose-rig-output
      - name: Independently reimport, evaluate deforming skin and CPU-rasterize via Blender/Pillow
        run: |
          unset PYTHONPATH
          blender --background --factory-startup --python-exit-code 7 --python-expr 'import numpy as np; print("BLENDER_NUMPY",np.__version__,np.__file__)'
          blender --background --factory-startup --threads 2 --python-exit-code 7 \
            --python qualification/nasa_rig_r3/blender_verify.py -- \
            pose-rig-output/camera_plane_skinned_motion.glb \
            pose-rig-output/rig_manifest.json pose-rig-output
          test -s pose-rig-output/blender_independent_readback.json
          test -s pose-rig-output/rig_frame_000.png
      - name: Encode iPhone H264 rig demonstration (faithful source sampling rate)
        run: |
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -framerate 1 -start_number 0 -i pose-rig-output/rig_frame_%03d.png \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            pose-rig-output/camera_plane_rig_demo.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 pose-rig-output/camera_plane_rig_demo.mp4
      - name: Record native receipt summary and first failure
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['nasa-pair-output/receipt.json',
                       'pose-rig-output/rig_manifest.json',
                       'pose-rig-output/blender_independent_readback.json']:
              p = Path(name)
              print('NATIVE_RECEIPT', name, p.read_text()[:6000] if p.exists() else 'NOT_PRODUCED')
          PY
      - name: Preserve reproducible artifacts and iPhone preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-r3-camera-plane-skin-and-blender
          path: |
            pose-rig-output/
            nasa-pair-output/receipt.json
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6
