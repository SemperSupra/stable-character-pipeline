name: R036 Official MPFB HumanService and Native Rig
on:
  push:
    branches:
      - research/anatomy-r036-mpfb-official-rig-20261116
    paths:
      - 'research/anatomy-native-mpfb/**'
      - '.github/workflows/anatomy-r036-mpfb-official.yml'
  pull_request:
    paths:
      - 'research/anatomy-native-mpfb/**'
      - '.github/workflows/anatomy-r036-mpfb-official.yml'
permissions:
  contents: read
concurrency:
  group: anatomy-r036-official-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-human-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install CPU Blender and required NumPy
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq install blender python3-numpy
          blender --version | head -3
          blender -b --python-exit-code 12 --python-expr 'import numpy;print("NUMPY_READY", numpy.__version__)'
      - name: Fetch exact upstream MPFB official addon and assets into temporary isolation
        env:
          SOURCE: 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" init -q
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin "$SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = "$SOURCE"
          test -f "$RUNNER_TEMP/mpfb2/src/mpfb/data/3dobjs/base.obj"
          echo "Pinned MPFB source: $SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj
      - name: Install source-pinned MPFB via native Blender extension commands
        run: |
          set -euo pipefail
          blender --command extension repo-list
          blender --command extension build \
            --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" \
            --output-filepath "$RUNNER_TEMP/mpfb-pinned-extension.zip"
          test -s "$RUNNER_TEMP/mpfb-pinned-extension.zip"
          sha256sum "$RUNNER_TEMP/mpfb-pinned-extension.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned-extension.zip"
          blender --command extension list
      - name: Build native official MPFB character and moving anatomy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r036-official"
          blender -b -t 2 --python-exit-code 12 --python research/anatomy-native-mpfb/official_mpfb_native.py -- \
            --stage build --source "$RUNNER_TEMP/mpfb2" --out "$RUNNER_TEMP/r036-official"
      - name: Fresh-process reopen and exported rig verification
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036-official/mpfb-official-anatomy.blend" -t 2 --python-exit-code 12 \
            --python research/anatomy-native-mpfb/official_mpfb_native.py -- \
            --stage verify --out "$RUNNER_TEMP/r036-official"
          ls -lh "$RUNNER_TEMP/r036-official"
          echo "Original generated images, scene and source retained only in ephemeral runner scratch; no public artifact upload"

      - name: R043 independent helper-mask deletion with original morphs and indexed weights preserved
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036-official/mpfb-official-anatomy.blend" -t 2 --python-exit-code 12 \
            --python research/anatomy-native-mpfb/morph_mask_preserving.py -- \
            --out "$RUNNER_TEMP/r036-official"
          test -s "$RUNNER_TEMP/r036-official/r043-editable-morph-mask-diagnostic.json"
          grep -F '"status": "PASS_NARROW_EDITABLE_MASKED_DERIVATIVE"' "$RUNNER_TEMP/r036-official/r043-editable-morph-mask-diagnostic.json"
          echo "All official source scene, native meshes, GLBs and morph output stay ephemeral; JSON receipt in logs only"

      - name: R044 all-eight morph variation DOE and synthetic organ co-export/import
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036-official/mpfb-official-anatomy.blend" -t 2 --python-exit-code 12 \
            --python research/anatomy-native-mpfb/morph_organ_coexport.py -- \
            --out "$RUNNER_TEMP/r036-official"
          test -s "$RUNNER_TEMP/r036-official/r044-morph-organ-doe.json"
          grep -F '"status": "PASS_NARROW_MULTIMORPH_AND_SYNTHETIC_ORGAN_COEXPORT"' "$RUNNER_TEMP/r036-official/r044-morph-organ-doe.json"
          echo "Synthetic anatomical proxy GLB remains scratch-only; durable numeric receipts in CI logs and private DLE"

      - name: R045 approximate outer-body morph neighborhood to original synthetic organ proxy anchors
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036-official/mpfb-official-anatomy.blend" -t 2 --python-exit-code 12 \
            --python research/anatomy-native-mpfb/organ_morph_anchor.py -- \
            --out "$RUNNER_TEMP/r036-official"
          test -s "$RUNNER_TEMP/r036-official/r045-organ-morph-anchor.json"
          grep -F '"status": "PASS_NARROW_ALGORITHMIC_ANCHOR_DIAGNOSTIC"' "$RUNNER_TEMP/r036-official/r045-organ-morph-anchor.json"
          echo "Synthetic morphology anchor study only: no source/real organ GLB published"

      - name: R047 actual Godot runtime synchronizes eight body and synthetic organ morphology channels
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 2 --max-time 90 \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/r047-godot.zip"
          echo "87f6e6be292929e363d15ed9052f277b2ba4e95ed994e1e099048097be2dfd03  $RUNNER_TEMP/r047-godot.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/r047-godot"
          unzip -q "$RUNNER_TEMP/r047-godot.zip" -d "$RUNNER_TEMP/r047-godot"
          GODOT="$RUNNER_TEMP/r047-godot/Godot_v4.5.2-stable_linux.x86_64"
          chmod +x "$GODOT"
          "$GODOT" --version
          cp research/anatomy-native-mpfb/godot_anchor_hil/project.godot "$RUNNER_TEMP/r047-godot/project.godot"
          cp research/anatomy-native-mpfb/godot_anchor_hil/probe.gd "$RUNNER_TEMP/r047-godot/probe.gd"
          cp "$RUNNER_TEMP/r036-official/r045-morph-anchored-proxies.glb" "$RUNNER_TEMP/r047-godot/anchored.glb"
          timeout 90 "$GODOT" --headless --editor --path "$RUNNER_TEMP/r047-godot" --import
          timeout 45 "$GODOT" --headless --path "$RUNNER_TEMP/r047-godot" --script probe.gd
          echo "All physical model and derived GLB assets remain ephemeral; DLE only accepts numeric receipt"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: research/anatomy-native-mpfb/morphcontrol/go.mod
          cache: false
      - name: R049 actual Go canonical plan to Godot runtime adapter, with tampering negative control
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/r047-godot/Godot_v4.5.2-stable_linux.x86_64"
          test -x "$GODOT"
          mkdir -p "$RUNNER_TEMP/r049-godot"
          cp research/anatomy-native-mpfb/godot_bridge_hil/project.godot "$RUNNER_TEMP/r049-godot/project.godot"
          cp research/anatomy-native-mpfb/godot_bridge_hil/probe.gd "$RUNNER_TEMP/r049-godot/probe.gd"
          cp "$RUNNER_TEMP/r036-official/r045-morph-anchored-proxies.glb" "$RUNNER_TEMP/r049-godot/anchored.glb"
          (
            cd research/anatomy-native-mpfb/morphcontrol
            export GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off
            go run ./cmd/emitfixture --out "$RUNNER_TEMP/r049-godot"
          )
          timeout 90 "$GODOT" --headless --editor --path "$RUNNER_TEMP/r049-godot" --import
          timeout 45 "$GODOT" --headless --path "$RUNNER_TEMP/r049-godot" --script probe.gd
          if R049_SOURCE="res://tampered.json" timeout 45 "$GODOT" --headless \
             --path "$RUNNER_TEMP/r049-godot" --script probe.gd \
             > "$RUNNER_TEMP/r049-intentional-fail-closed.log" 2>&1; then
            echo "R049_HOLD tampered Go plan was improperly accepted by Godot" >&2
            exit 12
          fi
          grep -F 'R049_GODOT_BRIDGE_HOLD canonical payload digest mismatch' \
            "$RUNNER_TEMP/r049-intentional-fail-closed.log"
          echo "R049_GO_GODOT_NEGATIVE_CONTROL accepted_original=YES rejected_tamper=YES"
          echo "All source-safe GLB and JSON payloads remain ephemeral, receipts in CI logs only"
