name: R036 Official MPFB HumanService and Native Rig
on:
  push:
    branches:
      - research/anatomy-r036-mpfb-official-rig-20261116
    paths:
      - 'research/anatomy-native-mpfb/**'
      - '.github/workflows/anatomy-r036-mpfb-official.yml'
  pull_request:
    paths:
      - 'research/anatomy-native-mpfb/**'
      - '.github/workflows/anatomy-r036-mpfb-official.yml'
permissions:
  contents: read
concurrency:
  group: anatomy-r036-official-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-human-rig:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install CPU Blender and required NumPy
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq install blender python3-numpy
          blender --version | head -3
          blender -b --python-exit-code 12 --python-expr 'import numpy;print("NUMPY_READY", numpy.__version__)'
      - name: Fetch exact upstream MPFB official addon and assets into temporary isolation
        env:
          SOURCE: 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" init -q
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin "$SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = "$SOURCE"
          test -f "$RUNNER_TEMP/mpfb2/src/mpfb/data/3dobjs/base.obj"
          echo "Pinned MPFB source: $SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj
      - name: Install source-pinned MPFB via native Blender extension commands
        run: |
          set -euo pipefail
          blender --command extension repo-list
          blender --command extension build \
            --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" \
            --output-filepath "$RUNNER_TEMP/mpfb-pinned-extension.zip"
          test -s "$RUNNER_TEMP/mpfb-pinned-extension.zip"
          sha256sum "$RUNNER_TEMP/mpfb-pinned-extension.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned-extension.zip"
          blender --command extension list
      - name: Build native official MPFB character and moving anatomy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r036-official"
          blender -b -t 2 --python-exit-code 12 --python research/anatomy-native-mpfb/official_mpfb_native.py -- \
            --stage build --source "$RUNNER_TEMP/mpfb2" --out "$RUNNER_TEMP/r036-official"
      - name: Fresh-process reopen and exported rig verification
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036-official/mpfb-official-anatomy.blend" -t 2 --python-exit-code 12 \
            --python research/anatomy-native-mpfb/official_mpfb_native.py -- \
            --stage verify --out "$RUNNER_TEMP/r036-official"
          ls -lh "$RUNNER_TEMP/r036-official"
          echo "Original generated images, scene and source retained only in ephemeral runner scratch; no public artifact upload"

      - name: R043 independent helper-mask deletion with original morphs and indexed weights preserved
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036-official/mpfb-official-anatomy.blend" -t 2 --python-exit-code 12 \
            --python research/anatomy-native-mpfb/morph_mask_preserving.py -- \
            --out "$RUNNER_TEMP/r036-official"
          test -s "$RUNNER_TEMP/r036-official/r043-editable-morph-mask-diagnostic.json"
          grep -F '"status": "PASS_NARROW_EDITABLE_MASKED_DERIVATIVE"' "$RUNNER_TEMP/r036-official/r043-editable-morph-mask-diagnostic.json"
          echo "All official source scene, native meshes, GLBs and morph output stay ephemeral; JSON receipt in logs only"

      - name: R044 all-eight morph variation DOE and synthetic organ co-export/import
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036-official/mpfb-official-anatomy.blend" -t 2 --python-exit-code 12 \
            --python research/anatomy-native-mpfb/morph_organ_coexport.py -- \
            --out "$RUNNER_TEMP/r036-official"
          test -s "$RUNNER_TEMP/r036-official/r044-morph-organ-doe.json"
          grep -F '"status": "PASS_NARROW_MULTIMORPH_AND_SYNTHETIC_ORGAN_COEXPORT"' "$RUNNER_TEMP/r036-official/r044-morph-organ-doe.json"
          echo "Synthetic anatomical proxy GLB remains scratch-only; durable numeric receipts in CI logs and private DLE"

      - name: R045 independent Godot 4.5.2 headless glTF skeletal morph and synthetic-organ import
        shell: bash
        run: |
          set -euo pipefail
          curl -fLSs --retry 2 --max-time 90 \
            https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip \
            -o "$RUNNER_TEMP/r045-godot.zip"
          sha256sum "$RUNNER_TEMP/r045-godot.zip"
          mkdir -p "$RUNNER_TEMP/r045-godot"
          unzip -q "$RUNNER_TEMP/r045-godot.zip" -d "$RUNNER_TEMP/r045-godot"
          GODOT="$RUNNER_TEMP/r045-godot/Godot_v4.5.2-stable_linux.x86_64"
          test -s "$GODOT"
          chmod +x "$GODOT"
          "$GODOT" --version
          cp research/anatomy-native-mpfb/godot_hil/project.godot "$RUNNER_TEMP/r045-godot/project.godot"
          cp research/anatomy-native-mpfb/godot_hil/probe.gd "$RUNNER_TEMP/r045-godot/probe.gd"
          cp "$RUNNER_TEMP/r036-official/r044-morph-organ-allweights.glb" "$RUNNER_TEMP/r045-godot/fixture.glb"
          # Godot's independent editor import and skeletal resource rebuild.
          timeout 90 "$GODOT" --headless --path "$RUNNER_TEMP/r045-godot" --editor --import
          timeout 45 "$GODOT" --headless --path "$RUNNER_TEMP/r045-godot" --script probe.gd
          echo "R045 source-safe Godot results retained in logs; all character bytes ephemeral"

      - name: R046 independent Godot 8-influence weighted buffer and animated skeleton runtime controls
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/r045-godot/Godot_v4.5.2-stable_linux.x86_64"
          test -x "$GODOT"
          cp research/anatomy-native-mpfb/godot_hil/runtime_probe.gd "$RUNNER_TEMP/r045-godot/runtime_probe.gd"
          timeout 45 "$GODOT" --headless --path "$RUNNER_TEMP/r045-godot" --script runtime_probe.gd
          echo "Godot pose/skin runtime diagnostic only; no photoreal/game performance acceptance"

      - name: R048 Godot real Mesa llvmpipe renderer morph and skinned vertex readback
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get -qq -y install xvfb libgl1-mesa-dri mesa-utils
          GODOT="$RUNNER_TEMP/r045-godot/Godot_v4.5.2-stable_linux.x86_64"
          test -x "$GODOT"
          cp research/anatomy-native-mpfb/godot_hil/bake_probe.gd "$RUNNER_TEMP/r045-godot/bake_probe.gd"
          timeout 100 xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
            "$GODOT" --rendering-driver opengl3 --path "$RUNNER_TEMP/r045-godot" --script bake_probe.gd
          echo "Godot software GPU render-bake diagnostic complete; no images or human assets uploaded"

      - name: R050 independent raw glTF POSITION morph vs Godot renderer per-vertex delta qualification
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/r045-godot/Godot_v4.5.2-stable_linux.x86_64"
          test -x "$GODOT"
          cp research/anatomy-native-mpfb/godot_hil/glb_morph_delta_probe.gd "$RUNNER_TEMP/r045-godot/glb_morph_delta_probe.gd"
          timeout 100 xvfb-run -a -s "-screen 0 1280x720x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
            "$GODOT" --rendering-driver opengl3 --path "$RUNNER_TEMP/r045-godot" --script glb_morph_delta_probe.gd
          GLB="$RUNNER_TEMP/r036-official/r044-morph-organ-allweights.glb"
          DELTA="$RUNNER_TEMP/r045-godot/r050-godot-morph-delta.bin"
          test -s "$GLB"
          test -s "$DELTA"
          python3 research/anatomy-native-mpfb/gltf_godot_morph_compare.py \
            --glb "$GLB" --godot "$DELTA" --out "$RUNNER_TEMP/r050-actual.json"
          grep -F '"status": "PASS_NARROW_EIGHT_GLTF_MORPH_VERTEX_DELTA_PARITY"' "$RUNNER_TEMP/r050-actual.json"
          python3 - "$DELTA" "$RUNNER_TEMP/r050-corrupted.bin" <<'PY'
          import struct,sys
          payload=bytearray(open(sys.argv[1],"rb").read())
          assert len(payload)>100
          n=struct.unpack_from("<I",payload,4)[0]
          assert n>=13000
          # Header + actual Godot baseline vertices; corrupt first true
          # morph delta to exercise post-correspondence numerical QA.
          struct.pack_into("<f",payload,8+n*12,42.0)
          open(sys.argv[2],"wb").write(payload)
          PY
          if python3 research/anatomy-native-mpfb/gltf_godot_morph_compare.py \
               --glb "$GLB" --godot "$RUNNER_TEMP/r050-corrupted.bin" \
               --out "$RUNNER_TEMP/r050-rejected.json" \
               > "$RUNNER_TEMP/r050-expected-reject.log" 2>&1; then
            echo "R050_HOLD injected vertex corruption passed unexpectedly" >&2
            exit 12
          fi
          grep -F 'R050_GLTF_GODOT_MORPH_HOLD actual glTF morph deltas' \
            "$RUNNER_TEMP/r050-expected-reject.log"
          echo "R050_MORPH_NEGATIVE_CONTROL source=true_gpu_readback=YES corrupt_vertex_rejected=YES"
          echo "Raw GLB and numeric vertex arrays remain in public disposable scratch only"

      - name: R051 original source MPFB eight-key morph effectiveness and exported glTF channel lineage
        shell: bash
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036-official/mpfb-official-anatomy.blend" -t 2 --python-exit-code 12 \
            --python research/anatomy-native-mpfb/r051_native_morph_effectiveness.py -- \
            --out "$RUNNER_TEMP/r036-official"
          python3 research/anatomy-native-mpfb/r051_native_to_gltf_morph.py \
            --source "$RUNNER_TEMP/r036-official/r051-native-morph-effectiveness.json" \
            --glb "$RUNNER_TEMP/r036-official/r044-morph-organ-allweights.glb" \
            --out "$RUNNER_TEMP/r051-morph-lineage.json"
          grep -F '"status": "PASS_NARROW_MORPH_EFFECTIVENESS_PROVENANCE"' "$RUNNER_TEMP/r051-morph-lineage.json"
          echo "R051_MORPH_ZERO_SOURCE original_native_relative_keys=INSPECTED actual_glb_target_names=VERIFIED public_assets_ephemeral=YES"
