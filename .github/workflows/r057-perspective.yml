name: R057 real Cycles perspective native ray vs decoded EXR two-lens qualification

on:
  push:
    branches:
      - research/r057-perspective-depth-public-20261116
    paths:
      - 'perspprobe/**'
      - '.github/workflows/r057-perspective.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r057-public-perspective-ray-depth
  cancel-in-progress: true

jobs:
  native-perspective-z:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: renderlab/go.mod
          cache: false
      - name: Ancestor Go source and geometry controls
        shell: bash
        run: |
          set -euo pipefail
          (cd renderlab && go vet ./... && go test -race -count=1 ./...)
          python3 -m unittest discover -s lightingprobe -p test_verify.py -v
      - name: Install disposable Blender Cycles CPU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version | head -3
      - name: Actual real 2 lens x 2 material Cycles images and source-mesh perspective rays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          blender -b -t 2 --python perspprobe/scene.py -- --out out
          test -s out/r057_source_manifest.json
          for focal in lens_35 lens_65; do
            for arm in baseline physical_material; do
              test -s "out/$focal/$arm/beauty.png"
              test -s "out/$focal/$arm/render_passes.exr"
            done
          done
      - name: Independent pinned OpenEXR Z/object numeric reprojection and adverse tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r057-exr"
          "$RUNNER_TEMP/r057-exr/bin/pip" install --disable-pip-version-check \
            --only-binary=:all: --no-cache-dir numpy==1.26.4 OpenEXR==3.3.3
          "$RUNNER_TEMP/r057-exr/bin/python" -m unittest discover \
            -s perspprobe -p test_audit.py -v
          "$RUNNER_TEMP/r057-exr/bin/python" perspprobe/audit.py \
            --root out --out out/r057_report.json
          grep -F '"status": "PASS_NARROW_PERSPECTIVE_SOURCE_RAYS_VS_REAL_CYCLES_EXR"' out/r057_report.json
          (cd out && find . -type f ! -name artifact_manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifact_manifest.sha256)
          (cd out && sha256sum -c artifact_manifest.sha256)
      - name: Independently diagnose real numeric mismatch without changing gates
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          if [ -s out/r057_source_manifest.json ] && [ -x "$RUNNER_TEMP/r057-exr/bin/python" ]; then
            "$RUNNER_TEMP/r057-exr/bin/python" perspprobe/diagnose.py --root out --out out/r057_diagnostic.json
          else
            echo "R057_DIAG_NOT_RUN_MISSING_SCENE_OR_DECODER"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r057-public-original-synthetic-perspective-Z-HOLD
          path: out/
          retention-days: 3
          if-no-files-found: warn
