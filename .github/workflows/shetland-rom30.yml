name: Shetland three-link stifle carpus and real 48-frame joint ROM
on:
  pull_request:
    paths:
      - "qualification/shetland_pony/equine_anatomy.py"
      - "qualification/shetland_pony/test_equine_anatomy.py"
      - "qualification/shetland_pony/ik_walk.py"
      - "qualification/shetland_pony/build_blender.py"
      - "qualification/shetland_pony/equine_sculpt.py"
      - "qualification/shetland_pony/rom30_native.py"
      - ".github/workflows/shetland-rom30.yml"
permissions:
  contents: read
jobs:
  live-equine-joints:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/blender/runner-images/bpy:1.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Independent immutable biological engineering measurement primitives
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SemperSupra/stable-character-pipeline
          ref: 72d83a1f10a605a50935c8e7d35a8aa8b99de4ed
          path: rom-frozen
          persist-credentials: false
      - name: Pure structural and hostile joint-angle controls
        shell: bash
        run: |
          set -euo pipefail
          (cd qualification/shetland_pony && python3 -m unittest -v test_equine_anatomy.py test_equine_sculpt.py test_footpaths.py test_winter_fur.py)
          (cd rom-frozen/qualification/equine/rom && python3 -m unittest -v test_rom_metrics.py)
          python3 -m py_compile qualification/shetland_pony/ik_walk.py qualification/shetland_pony/rom30_native.py
      - name: Official SHA-verified Blender in disposable public GHCR runner
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl xz-utils libegl1 libgl1 libgl1-mesa-dri libgbm1
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o "$RUNNER_TEMP/blender/blender.sha256"
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP/blender"; grep 'blender-4.5.15-linux-x64.tar.xz' blender.sha256 | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64.tar.xz" -C "$RUNNER_TEMP/blender"
      - name: Native true 30-bone black furry pony GLB export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/model results/science
          export LIBGL_ALWAYS_SOFTWARE=1
          B="$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender"
          SCP_COATS=black "$B" -b --factory-startup --python-exit-code 8 \
            --python qualification/shetland_pony/build_blender.py \
            -- "$GITHUB_WORKSPACE/results/model"
          "$B" -b --factory-startup --python-exit-code 8 \
            --python qualification/shetland_pony/rom30_native.py -- \
            "$GITHUB_WORKSPACE/results/model/shetland_black_ghcr.glb" \
            "$GITHUB_WORKSPACE/results/science/rom30.json" \
            "$GITHUB_WORKSPACE/rom-frozen/qualification/equine/rom"
      - name: "Strict evidence receipt: six distinct joint samples, no biology overclaim"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,struct
          root=pathlib.Path("results")
          r=json.loads((root/"science/rom30.json").read_text())
          assert r["schema"]=="equine.rom30.science.v1" and r["frames"]==48
          assert r["actual_rig_joint_count"]==30
          assert len(r["observed_joints"])==6
          assert r["scientific_verdict"] in ("JOINT_ROM_OR_ANATOMY_FAIL","ENGINEERING_GUARDRAILS_PASS_BIOLOGY_UNKNOWN")
          raw=(root/"model/shetland_black_ghcr.glb").read_bytes()
          n=struct.unpack_from("<I",raw,12)[0];g=json.loads(raw[20:20+n].decode().strip())
          assert max(len(s["joints"]) for s in g["skins"])>=30
          assert any(m.get("name","").startswith("fur_geometry_") for m in g["meshes"])
          print("ROM30_NATIVE_GLTF_TECHNICAL_PASS",r["scientific_verdict"],r["failure_codes"])
          PY
      - name: Persist first positive or scientific negative (both are evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shetland-30bone-native-rom-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            results/science/*.json
            results/model/*.glb
            results/model/*.png
            results/model/fur_*.json
