name: Original reusable characters — headless 72-frame Blender and video
on:
  pull_request:
    paths:
      - 'qualification/original_reusable_characters/**'
      - '.github/workflows/r009-original-reusable-characters.yml'
permissions:
  contents: read
jobs:
  generate-validate-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original source-only negative controls
        run: |
          set -euo pipefail
          cd qualification/original_reusable_characters
          python3 -m unittest -v test_original_glb test_humanization_v2 test_rig35_v2
          python3 generate_original_glb.py --out "$RUNNER_TEMP/original.glb" --receipt "$RUNNER_TEMP/source_receipt.json"
          python3 verify_original_glb.py --input "$RUNNER_TEMP/original.glb" --receipt "$RUNNER_TEMP/independent_receipt.json"
          python3 humanization_v2.py --out "$RUNNER_TEMP/humanized_v2.glb" --receipt "$RUNNER_TEMP/humanized_v2_source.json"
          python3 verify_original_glb.py --input "$RUNNER_TEMP/humanized_v2.glb" --receipt "$RUNNER_TEMP/humanized_v2_independent.json"
          test "$(sha256sum "$RUNNER_TEMP/original.glb" | cut -d' ' -f1)" != "$(sha256sum "$RUNNER_TEMP/humanized_v2.glb" | cut -d' ' -f1)"
          python3 rig35_v2.py --input "$RUNNER_TEMP/humanized_v2.glb" --output "$RUNNER_TEMP/humanized_v2_rig35.glb" --receipt "$RUNNER_TEMP/humanized_v2_rig35.json"
          python3 -c 'import json,sys; from test_rig35_v2 import witness; open(sys.argv[2],"w").write(json.dumps(witness(sys.argv[1]),sort_keys=True,indent=2)+"\\n")' "$RUNNER_TEMP/humanized_v2_rig35.glb" "$RUNNER_TEMP/humanized_v2_rig35_independent.json"
      - name: Install SHA-verified official Blender and FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb xauth libegl1 libgl1 libgl1-mesa-dri libgbm1
          curl --fail --location --retry 3 --silent --show-error https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o "$RUNNER_TEMP/blender.sha256"
          curl --fail --location --retry 3 --silent --show-error https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP"; grep 'blender-4.5.15-linux-x64.tar.xz' blender.sha256 | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz" -C "$RUNNER_TEMP"
      - name: Native editable Blender import and 72-frame two-camera render
        run: |
          set -euo pipefail
          sha="$(sha256sum "$RUNNER_TEMP/humanized_v2_rig35.glb" | cut -d' ' -f1)"
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender-4.5.15-linux-x64/blender" \
            -b --factory-startup --python-exit-code 8 \
            --python qualification/original_reusable_characters/render_blender.py \
            -- "$RUNNER_TEMP/humanized_v2_rig35.glb" "$RUNNER_TEMP/render" "$sha"
          for view in front oblique; do
            ffmpeg -hide_banner -loglevel error -framerate 12 -i "$RUNNER_TEMP/render/$view/frame_%03d.png" \
              -c:v libx264 -crf 23 -pix_fmt yuv420p "$RUNNER_TEMP/render/$view.mp4"
            test "$(ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames -of csv=p=0 "$RUNNER_TEMP/render/$view.mp4")" = 72
          done
          sha256sum "$RUNNER_TEMP/render/"*.mp4 > "$RUNNER_TEMP/render/video-sha256.txt"
      - name: Source-specific independent decoded-pixel occlusion falsifier
        run: |
          set -euo pipefail
          cd qualification/original_reusable_characters/visualqa_go
          go test -race -count=1 ./...
          go vet ./...
          go run . -front "$RUNNER_TEMP/render/front.mp4" -oblique "$RUNNER_TEMP/render/oblique.mp4" -receipt "$RUNNER_TEMP/render/visibility.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["source_specific_visibility_verdict"]=="PASS_TWO_VIEW_CLOTHING_VISIBILITY_PROXY_ONLY",r["source_specific_visibility_verdict"]' "$RUNNER_TEMP/render/visibility.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-humanized-v2-native-two-view-research
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/source_receipt.json
            ${{ runner.temp }}/humanized_v2_source.json
            ${{ runner.temp }}/humanized_v2_independent.json
            ${{ runner.temp }}/humanized_v2.glb
            ${{ runner.temp }}/humanized_v2_rig35.glb
            ${{ runner.temp }}/humanized_v2_rig35.json
            ${{ runner.temp }}/humanized_v2_rig35_independent.json
            ${{ runner.temp }}/independent_receipt.json
            ${{ runner.temp }}/render/native_receipt.json
            ${{ runner.temp }}/render/visibility.json
            ${{ runner.temp }}/render/portraits/*.png
            ${{ runner.temp }}/render/video-sha256.txt
            ${{ runner.temp }}/render/*.mp4
            ${{ runner.temp }}/render/*.blend
