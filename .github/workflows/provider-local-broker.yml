name: Source-clean local worker quota broker verification
on:
  pull_request:
    paths:
      - research/providers/broker/**
      - .github/workflows/provider-local-broker.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualified-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    defaults:
      run:
        working-directory: research/providers
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: research/providers/go.mod
          cache: false
      - name: Race-tested independent offline controls
        run: |
          set -euo pipefail
          go test -race -count=1 -v ./ledger ./broker | tee broker-qualification.log
          go vet ./ledger ./broker
      - name: Retain original Go test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-broker-new-controls
          path: research/providers/broker-qualification.log
          if-no-files-found: warn
          retention-days: 14
