name: R078 R009 native official MPFB Aster Juniper character substitutes
on:
  push:
    branches: [research/r078-r009-mpfb-aster-juniper-20261118]
    paths:
      - 'research/r078-r009-mpfb-pair/**'
      - '.github/workflows/r078-r009-mpfb-pair.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r078-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only-hostile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Original fictional profiles and fail-closed identity/acceptance controls
        run: |
          set -euo pipefail
          cd research/r078-r009-mpfb-pair
          python3 -m unittest -v test_contract
          python3 -m py_compile contract.py makehuman_pair.py test_contract.py
  native-mpfb-pair:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install real CPU Blender and NumPy using proven R036 venue
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq install blender python3-numpy libegl1 libgl1 libgl1-mesa-dri libgbm1 xvfb xauth ffmpeg
          blender --version | head -3
          blender -b --python-exit-code 12 --python-expr 'import numpy;print("R078_MPF_NATIVE_NUMPY",numpy.__version__)'
      - name: Fetch pinned official MakeHuman/MPFB source in disposable runner
        env:
          SOURCE: 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" init -q
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin "$SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = "$SOURCE"
          test "$(git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          blender --command extension build --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" --output-filepath "$RUNNER_TEMP/mpfb-pinned.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned.zip"
      - name: Two official synthetic human bodies and true MPFB rigs, fresh saved Blend
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 12 --python research/r078-r009-mpfb-pair/makehuman_pair.py -- --stage build --source "$RUNNER_TEMP/mpfb2" --out "$RUNNER_TEMP/r078"
      - name: Independent fresh-process native scene and three motion/skin evaluations
        run: |
          set -euo pipefail
          scene_sha="$(sha256sum "$RUNNER_TEMP/r078/aster-juniper-official-mpfb.blend" | cut -d ' ' -f1)"
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 blender -b "$RUNNER_TEMP/r078/aster-juniper-official-mpfb.blend" -t 2 --python-exit-code 12 --python research/r078-r009-mpfb-pair/makehuman_pair.py -- --stage verify --saved "$RUNNER_TEMP/r078/aster-juniper-official-mpfb.blend" --sha "$scene_sha" --out "$RUNNER_TEMP/r078"
          python3 - "$RUNNER_TEMP/r078" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1]);b=json.loads((p/"build.json").read_text());r=json.loads((p/"verify.json").read_text())
          assert len(b["actors"])==2 and all(a["bones"]>=100 for a in b["actors"])
          assert r["status"]=="PASS_NATIVE_SKIN_RIG_SOURCE_NARROW_HOLD_GAIT"
          assert not r["mvp_accepted"] and not r["gait_contact_accepted"]
          assert len(list((p/"stills").glob("frame_*.png")))==3
          print("R078_REAL_TWO_MAKEHUMAN_NATIVE_PAIR",b["blend_sha256"],[a["bones"] for a in b["actors"]])
          PY
      - name: Real full 72-frame MPFB native Workbench replay, H.264 encode and independent decode
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/r078"
          film="$out/film"
          scene="$out/aster-juniper-official-mpfb.blend"
          test -s "$scene"
          mkdir -p "$film"
          # A new Blender process reopens the previously checked native .blend; still fictional substitutes.
          xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 blender -b "$scene" -t 2 --python-exit-code 12 -o "$film/frame_" -F PNG -s 0 -e 71 -a
          ffmpeg -hide_banner -v error -y -framerate 12 -start_number 0 -i "$film/frame_%04d.png" -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$film/aster-juniper-72f.mp4"
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=nb_read_frames,r_frame_rate,width,height -of json "$film/aster-juniper-72f.mp4" > "$film/ffprobe.json"
          ffmpeg -hide_banner -v error -i "$film/aster-juniper-72f.mp4" -f framemd5 "$film/decoded.framemd5"
          python3 - "$out" <<'PY'
          import hashlib,json,pathlib,sys
          out=pathlib.Path(sys.argv[1]);film=out/"film"
          build=json.loads((out/"build.json").read_text())
          verify=json.loads((out/"verify.json").read_text())
          frames=sorted(film.glob("frame_*.png"))
          expected=[f"frame_{i:04d}.png" for i in range(72)]
          assert [p.name for p in frames]==expected, "MISSING_DUPLICATED_OR_EXTRA_NATIVE_FRAMES"
          assert all(p.stat().st_size>100 for p in frames), "EMPTY_FRAME"
          metadata=json.loads((film/"ffprobe.json").read_text())
          streams=metadata["streams"]
          assert len(streams)==1 and streams[0]["nb_read_frames"]=="72", "WRONG_ENCODED_FRAME_COUNT"
          assert streams[0]["r_frame_rate"] in ("12/1","12"), "WRONG_VIDEO_TIMEBASE"
          assert (streams[0]["width"],streams[0]["height"])==(320,180), "UNEXPECTED_VIDEO_RESOLUTION"
          records=[s for s in (film/"decoded.framemd5").read_text().splitlines() if s.strip() and not s.startswith("#")]
          assert len(records)==72, "INDEPENDENT_DECODER_COUNT_MISMATCH"
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest(frames[0])!=digest(frames[-1]), "STATIC_FILM_NOT_ACCEPTED"
          assert digest(out/"aster-juniper-official-mpfb.blend")==build["blend_sha256"]==verify["scene_sha256"],"SCENE_LINEAGE_CHANGED"
          assert not any(build[k] for k in ("mvp_accepted","gait_accepted","real_identity_accepted","photoreal_accepted","release_authorized")), "FALSE_PRODUCT_ACCEPTANCE"
          receipt={"schema":"scp.r079.mpfb-72f-native-film.v1",
           "status":"PASS_COMPLETE_FICTIONAL_NATIVE_72F_VIDEO_HOLD_GAIT_AND_IDENTITY",
           "source_class":"ORIGINAL_FICTIONAL_MPFBCORE_CC0",
           "scene_sha256":build["blend_sha256"],"video_sha256":digest(film/"aster-juniper-72f.mp4"),
           "first_frame_sha256":digest(frames[0]),"last_frame_sha256":digest(frames[-1]),
           "rendered_png_frames":72,"encoded_h264_frames":72,"independently_decoded_frames":72,
           "fps":12,"width":320,"height":180,"gait_contact_accepted":False,
           "original_character_match_accepted":False,"mvp_accepted":False,"release_authorized":False}
          (out/"film.json").write_text(json.dumps(receipt,sort_keys=True,indent=2)+"\n")
          print("R079_COMPLETE_72_FRAME_NATIVE_SUBSTITUTE_FILM",json.dumps(receipt,sort_keys=True))
          PY
      - name: Upload small metadata-only receipts (never model/skin/PNG binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r078-mpfb-pair-json-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r078/*.json
          retention-days: 3
