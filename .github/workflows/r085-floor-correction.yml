name: R085 source-bound native ground penetration correction and independent falsifier
on:
  push:
    branches: [research/r085-shoe-floor-correction-20261118]
    paths:
      - 'research/r082-mpfb-native-wardrobe/**'
      - 'research/r084-shoe-contact/**'
      - 'research/r085-floor-correction/**'
      - '.github/workflows/r085-floor-correction.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r085-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-rights-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - run: |
          set -euo pipefail
          cd research/r082-mpfb-native-wardrobe
          python3 -m unittest -v test_wardrobe_contract
          python3 -m py_compile wardrobe_contract.py native_wardrobe.py
          cd ../r084-shoe-contact
          python3 -m unittest -v test_shoe_contact
          python3 -m py_compile shoe_contact.py native_shoe_contact.py
          cd ../r085-floor-correction
          python3 -m unittest -v test_floor_math
          python3 -m py_compile floor_math.py native_floor_correct.py
  actual-native-floor-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Official hash-pinned standalone Blender 4.5.16 for native read-only CPU geometry
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r085-standalone"
          cd "$RUNNER_TEMP/r085-standalone"
          base="https://download.blender.org/release/Blender4.5"
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-4.5.16.sha256" -o blender.sha256
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          hash="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "$(printf '%s' "$hash" | wc -c)" -eq 64
          printf '%s  %s\n' "$hash" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r085-standalone" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$bin"
          "$bin" --background --python-expr 'import bpy,numpy;print("R085_BLENDER",bpy.app.version_string,"numpy",numpy.__version__)'
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Exact original official MakeHuman/MPFB code and CC0 core
        env:
          SOURCE: 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" init -q
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin "$SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = "$SOURCE"
          test "$(git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          blender --command extension build --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" --output-filepath "$RUNNER_TEMP/mpfb-pinned.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned.zip"
      - name: Exact pinned source archive retrieval (ephemeral only)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wardrobe"
          curl -fLsS --retry 2 --max-time 140 https://files.makehumancommunity.org/asset_packs/shirts01/shirts01_cc0.zip -o "$RUNNER_TEMP/wardrobe/shirts01_cc0.zip"
          curl -fLsS --retry 2 --max-time 140 https://files.makehumancommunity.org/asset_packs/pants01/pants01_cc0.zip -o "$RUNNER_TEMP/wardrobe/pants01_cc0.zip"
          curl -fLsS --retry 2 --max-time 140 https://files.makehumancommunity.org/asset_packs/shoes01/shoes01_cc0.zip -o "$RUNNER_TEMP/wardrobe/shoes01_cc0.zip"
          echo 'a5a723b0e84a109bb190fcfeac7f1de4138d875da3e30fe5b3340eac9f38bcd3  '"$RUNNER_TEMP/wardrobe/shirts01_cc0.zip" | sha256sum -c -
          echo 'e4e0ec60db34f279be291a83cfd7b342a7c5cf09bb7676682a5f39f4f6ac4ad9  '"$RUNNER_TEMP/wardrobe/pants01_cc0.zip" | sha256sum -c -
          echo 'ded3f70428505eabbf1f6d7b5f61196a7366ef20757103d276ad0ed336c35ada  '"$RUNNER_TEMP/wardrobe/shoes01_cc0.zip" | sha256sum -c -
      - name: Reproduce genuine 72-frame native two-body baseline
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 12 --python research/r078-r009-mpfb-pair/makehuman_pair.py -- --stage build --source "$RUNNER_TEMP/mpfb2" --out "$RUNNER_TEMP/r078"
      - name: Fit original CC0 garment meshes and rig each asset to native bodies
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/r078/aster-juniper-official-mpfb.blend"
          base_sha="$(sha256sum "$base" | cut -d ' ' -f1)"
          blender -b "$base" -t 2 --python-exit-code 12 --python research/r082-mpfb-native-wardrobe/native_wardrobe.py -- --stage build --packs "$RUNNER_TEMP/wardrobe" --baseline-sha "$base_sha" --out "$RUNNER_TEMP/r082"
      - name: Fresh-process actual boot sole proximity, penetration and skate evidence
        run: |
          set -euo pipefail
          scene="$RUNNER_TEMP/r082/aster-juniper-cc0-native-wardrobe.blend"
          sha="$(sha256sum "$scene" | cut -d ' ' -f1)"
          blender -b "$scene" -t 2 --python-exit-code 12 --python research/r084-shoe-contact/native_shoe_contact.py -- --scene "$scene" --sha "$sha" --wardrobe "$RUNNER_TEMP/r082/build.json" --out "$RUNNER_TEMP/r084"
      - name: Apply reversible sampled shoe-sole driven correction to a separate Blend
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/r082/aster-juniper-cc0-native-wardrobe.blend"
          source_sha="$(sha256sum "$source" | cut -d ' ' -f1)"
          blender -b "$source" -t 2 --python-exit-code 12 --python research/r085-floor-correction/native_floor_correct.py -- --stage build --scene "$source" --source-sha "$source_sha" --wardrobe "$RUNNER_TEMP/r082/build.json" --out "$RUNNER_TEMP/r085"
      - name: Separate Blender process: remeasure floor penetration without accepting gait
        run: |
          set -euo pipefail
          scene="$RUNNER_TEMP/r085/r085-floor-lift-candidate.blend"
          sha="$(sha256sum "$scene" | cut -d ' ' -f1)"
          blender -b "$scene" -t 2 --python-exit-code 12 --python research/r085-floor-correction/native_floor_correct.py -- --stage verify --scene "$scene" --sha "$sha" --wardrobe "$RUNNER_TEMP/r082/build.json" --before "$RUNNER_TEMP/r085/before.json" --out "$RUNNER_TEMP/r085"
      - name: Upload small JSON evidence, no garment model nor render files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r085-floor-correction-json-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r084/*.json
            ${{ runner.temp }}/r085/*.json
          retention-days: 3
          if-no-files-found: ignore
