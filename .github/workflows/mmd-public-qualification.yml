name: MMD public synthetic PMX VMD VPD qualification

on:
  push:
    branches: [qualification/mmd-public-20261027]
    paths:
      - 'mmd/**'
      - '.github/workflows/mmd-public-qualification.yml'
  pull_request:
    paths:
      - 'mmd/**'
      - '.github/workflows/mmd-public-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-mmd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-upstream-synthetic-parsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public qualification source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned MMD Tools 4.5.14 without copying third-party assets
        uses: actions/checkout@v4
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Go 1.23 public catalog validation
        uses: actions/setup-go@v5
        with:
          go-version-file: mmd/catalog/go.mod
          cache: false
      - name: Test rights and candidate admission against adversarial fixtures
        working-directory: mmd/catalog
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go run ./cmd/catalogcheck catalog.json
      - name: Run real upstream format parsers, positive and negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile mmd/qualification/probe.py
          python3 mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-output
          python3 mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-output-repeat
          for f in synthetic_triangle.pmx synthetic_center_motion.vmd synthetic_center_pose.vpd; do
            cmp "mmd-output/$f" "mmd-output-repeat/$f"
          done
      - name: Preserve evidence and independently inspectable fixture binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mmd-native-format-evidence
          path: |
            mmd-output/*
            mmd-output-repeat/qualification.json
          retention-days: 14
          if-no-files-found: warn

  blender-real-pmx:
    if: github.event_name == 'push'
    needs: pinned-upstream-synthetic-parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout rights-clean original fixture generator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact released MMD Tools (no binary/community assets)
        uses: actions/checkout@v4
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Use Python 3.11 supported by official bpy 4.5.0
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Generate exact original PMX model on runner
        run: |
          set -euo pipefail
          python mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-output
      - name: Install genuine Blender 4.5 Python distribution and MMD dependency
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0' 'opencc-python-reimplemented==0.1.7'
          python -c 'import bpy; assert bpy.app.version >= (4, 2, 0); print(bpy.app.version_string)'
      - name: Real MMD Tools Blender import, topology probe, static Cycles proof, GLB and blend
        timeout-minutes: 7
        env:
          OMP_NUM_THREADS: '2'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python mmd/qualification/blender_probe.py --source vendor/mmd-tools --fixture mmd-output/synthetic_triangle.pmx --out mmd-blender-output
      - name: Upload generated editable sources, interchange and receipts or first failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mmd-blender-evidence
          path: |
            mmd-blender-output/*
          retention-days: 14
          if-no-files-found: warn

  blender-native-motion:
    if: github.event_name == 'push'
    needs: blender-real-pmx
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated public MMD motion qualification
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned genuine MMD Tools release
        uses: actions/checkout@v4
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Install Python compatible with Blender 4.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Generate clean native model, two-key motion and pose
        run: |
          set -euo pipefail
          python -m py_compile mmd/qualification/motion_probe.py
          python mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-output
      - name: Install actual Blender and MMD translation dependency
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0' 'opencc-python-reimplemented==0.1.7'
      - name: Verify real VMD motion at 0/15/30 and apply VPD pose in Blender
        timeout-minutes: 4
        env:
          OMP_NUM_THREADS: '2'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python -u mmd/qualification/motion_probe.py \
            --source vendor/mmd-tools \
            --model mmd-output/synthetic_triangle.pmx \
            --motion mmd-output/synthetic_center_motion.vmd \
            --pose mmd-output/synthetic_center_pose.vpd \
            --out mmd-motion-output
      - name: Preserve edit-ready animated Blender source and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mmd-native-motion-evidence
          path: mmd-motion-output/*
          retention-days: 14
          if-no-files-found: warn
