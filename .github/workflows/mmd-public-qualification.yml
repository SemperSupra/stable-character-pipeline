name: MMD public synthetic PMX VMD VPD qualification

on:
  push:
    branches: [qualification/mmd-public-20261027]
    paths:
      - 'mmd/**'
      - '.github/workflows/mmd-public-qualification.yml'
  pull_request:
    paths:
      - 'mmd/**'
      - '.github/workflows/mmd-public-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-mmd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-upstream-synthetic-parsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout public qualification source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned MMD Tools 4.5.14 without copying third-party assets
        uses: actions/checkout@v4
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Go 1.23 public catalog validation
        uses: actions/setup-go@v5
        with:
          go-version-file: mmd/catalog/go.mod
          cache: false
      - name: Test rights and candidate admission against adversarial fixtures
        working-directory: mmd/catalog
        run: |
          set -euo pipefail
          go test -count=1 ./...
          go vet ./...
          go run ./cmd/catalogcheck catalog.json
      - name: Run real upstream format parsers, positive and negative controls
        run: |
          set -euo pipefail
          python3 -m py_compile mmd/qualification/probe.py
          python3 mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-output
          python3 mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-output-repeat
          for f in synthetic_triangle.pmx synthetic_center_motion.vmd synthetic_center_pose.vpd; do
            cmp "mmd-output/$f" "mmd-output-repeat/$f"
          done
      - name: Preserve evidence and independently inspectable fixture binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mmd-native-format-evidence
          path: |
            mmd-output/*
            mmd-output-repeat/qualification.json
          retention-days: 14
          if-no-files-found: warn

  blender-real-pmx:
    if: github.event_name == 'push'
    needs: pinned-upstream-synthetic-parsers
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Checkout rights-clean original fixture generator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact released MMD Tools (no binary/community assets)
        uses: actions/checkout@v4
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Use Python 3.11 supported by official bpy 4.5.0
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Generate exact original PMX model on runner
        run: |
          set -euo pipefail
          python mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-output
      - name: Install genuine Blender 4.5 Python distribution and MMD dependency
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0' 'opencc-python-reimplemented==0.1.7'
          python -c 'import bpy; assert bpy.app.version >= (4, 2, 0); print(bpy.app.version_string)'
      - name: Real MMD Tools Blender import, topology probe, static Cycles proof, GLB and blend
        timeout-minutes: 7
        env:
          OMP_NUM_THREADS: '2'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python mmd/qualification/blender_probe.py --source vendor/mmd-tools --fixture mmd-output/synthetic_triangle.pmx --out mmd-blender-output
      - name: Upload generated editable sources, interchange and receipts or first failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mmd-blender-evidence
          path: |
            mmd-blender-output/*
          retention-days: 14
          if-no-files-found: warn

  blender-native-motion:
    if: github.event_name == 'push'
    needs: blender-real-pmx
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated public MMD motion qualification
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned genuine MMD Tools release
        uses: actions/checkout@v4
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Install Python compatible with Blender 4.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Generate clean native model, two-key motion and pose
        run: |
          set -euo pipefail
          python -m py_compile mmd/qualification/motion_probe.py
          python mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-output
      - name: Install actual Blender and MMD translation dependency
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0' 'opencc-python-reimplemented==0.1.7'
      - name: Verify real VMD motion at 0/15/30 and apply VPD pose in Blender
        timeout-minutes: 4
        env:
          OMP_NUM_THREADS: '2'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python -u mmd/qualification/motion_probe.py \
            --source vendor/mmd-tools \
            --model mmd-output/synthetic_triangle.pmx \
            --motion mmd-output/synthetic_center_motion.vmd \
            --pose mmd-output/synthetic_center_pose.vpd \
            --out mmd-motion-output
      - name: Preserve edit-ready animated Blender source and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mmd-native-motion-evidence
          path: mmd-motion-output/*
          retention-days: 14
          if-no-files-found: warn

  blender-animated-interchange:
    if: github.event_name == 'push'
    needs: blender-native-motion
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout original public MMD interchange source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact MMD Tools upstream source
        uses: actions/checkout@v4
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Select compatible Python for genuine Blender 4.5
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Generate original synthetic input model and motion
        run: |
          set -euo pipefail
          python -m py_compile mmd/qualification/interchange_probe.py mmd/qualification/verify_interchange.py
          python mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-output
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0' 'opencc-python-reimplemented==0.1.7' 'Pillow==11.3.0'
      - name: Render 31 skinned animation frames and export animated GLB and BLEND
        timeout-minutes: 7
        env:
          OMP_NUM_THREADS: '2'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python -u mmd/qualification/interchange_probe.py \
            --source vendor/mmd-tools \
            --model mmd-output/synthetic_triangle.pmx \
            --motion mmd-output/synthetic_center_motion.vmd \
            --out mmd-interchange-output
      - name: Independent glTF skin, animation and visual non-freeze falsifiers
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python mmd/qualification/verify_interchange.py --out mmd-interchange-output --self-test
          python mmd/qualification/verify_interchange.py --out mmd-interchange-output
      - name: Produce iPhone-compatible MP4 with real consecutive frames
        timeout-minutes: 7
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # Ubuntu hosted runner does not preinstall ffmpeg: native first failure in 40448661430.
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            timeout --signal=TERM --kill-after=10s 120s sudo apt-get update -qq
            timeout --signal=TERM --kill-after=10s 240s sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -loglevel error -y -framerate 30 \
            -i mmd-interchange-output/frame_%04d.png -frames:v 31 \
            -c:v libx264 -pix_fmt yuv420p -movflags +faststart \
            mmd-interchange-output/mmd_animated_interchange.mp4
          python - <<'PY'
          import json, subprocess
          path = 'mmd-interchange-output/mmd_animated_interchange.mp4'
          args = ['ffprobe','-v','error','-count_frames','-select_streams','v:0',
                  '-show_entries','stream=codec_name,nb_read_frames,width,height,pix_fmt',
                  '-of','json',path]
          x = json.loads(subprocess.check_output(args))
          stream = x['streams'][0]
          assert stream['codec_name']=='h264' and stream['pix_fmt']=='yuv420p', stream
          assert (stream['width'],stream['height']) == (320,240),stream
          assert int(stream['nb_read_frames']) == 31, stream
          print(json.dumps({'result':'PASS_MOBILE_COMPATIBLE_H264','stream':stream}, sort_keys=True))
          PY
      - name: Upload inspectable motion, video, full frames and source on any outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mmd-animated-interchange-evidence
          path: mmd-interchange-output/*
          retention-days: 14
          if-no-files-found: warn

  independent-headless-mmd2gltf:
    if: github.event_name == 'push'
    needs: blender-animated-interchange
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout original public fixtures and independent validator
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned MMD Tools format parsers
        uses: actions/checkout@v4
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Checkout independent MIT mmd2gltf Python CLI at immutable source
        uses: actions/checkout@v4
        with:
          repository: masaka1024/mmd2gltf-gui
          ref: b86ef4c2b103dd01130f68ede625d35633b9e5ff
          path: vendor/independent-converter
          sparse-checkout: |
            mmd2gltf
            LICENSE
          persist-credentials: false
      - name: Python 3.11 only (independent converter no Blender or GPU)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Generate rights-clean PMX/VMD and invoke second real upstream conversion engine
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p mmd-independent-output
          python mmd/qualification/probe.py --source vendor/mmd-tools --out mmd-independent-output
          PYTHONPATH=vendor/independent-converter python -m mmd2gltf \
            mmd-independent-output/synthetic_triangle.pmx \
            --vmd mmd-independent-output/synthetic_center_motion.vmd \
            --scale 1.0 --no-ik \
            -o mmd-independent-output/independent_mmd2gltf.glb
          test -s mmd-independent-output/independent_mmd2gltf.glb
      - name: Download verified Blender GLB from exact same public Actions run
        uses: actions/download-artifact@v4
        with:
          name: public-mmd-animated-interchange-evidence
          path: blender-evidence
      - name: Independently inspect glTF motion and preserved MMD extras against Blender
        run: |
          set -euo pipefail
          python mmd/qualification/compare_converter.py \
            --direct mmd-independent-output/independent_mmd2gltf.glb \
            --blender blender-evidence/animated_mmd.glb \
            --out mmd-independent-output/converter_comparison.json
      - name: Preserve both source-specific native comparison receipts and independent GLB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mmd-independent-converter-evidence
          path: |
            mmd-independent-output/independent_mmd2gltf.glb
            mmd-independent-output/converter_comparison.json
          retention-days: 14
          if-no-files-found: warn

  blender-multibone-articulation:
    if: github.event_name == 'push'
    needs: independent-headless-mmd2gltf
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout original G7 articulation and independent validators
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned MMD Tools upstream source
        uses: actions/checkout@v4
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - name: Select compatible Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: ''
      - name: Generate original multi-bone PMX and dual-rotation VMD with upstream serializer
        run: |
          set -euo pipefail
          python -m py_compile mmd/qualification/articulation_fixture.py mmd/qualification/articulation_blender.py mmd/qualification/verify_articulation.py
          python mmd/qualification/articulation_fixture.py --source vendor/mmd-tools --out mmd-articulation-fixture
          python mmd/qualification/verify_articulation.py --out mmd-articulation-output --self-test
      - name: Install Blender 4.5 with image inspection support on free CPU
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0' 'opencc-python-reimplemented==0.1.7' 'Pillow==11.3.0'
      - name: Import weighted PMX rig and VMD into actual Blender, evaluate two rotating joints and export GLB
        timeout-minutes: 4
        env:
          OMP_NUM_THREADS: '2'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python -u mmd/qualification/articulation_blender.py \
            --source vendor/mmd-tools \
            --model mmd-articulation-fixture/articulated_ribbon.pmx \
            --motion mmd-articulation-fixture/articulated_ribbon.vmd \
            --out mmd-articulation-output
      - name: Independently assert actual glTF quaternion tracks, anchored skin and visual frames
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python mmd/qualification/verify_articulation.py --out mmd-articulation-output
      - name: Preserve original multi-bone native files and independent evidence on first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-mmd-articulation-evidence
          path: |
            mmd-articulation-fixture/*
            mmd-articulation-output/*
          retention-days: 14
          if-no-files-found: warn
