name: R060 actual synthetic moving head 3-frame Cycles depth and source witness

on:
  push:
    branches:
      - research/r060-temporal-exr-pose-public-20261116
    paths:
      - 'temporalprobe/**'
      - '.github/workflows/r060-temporal-pose.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r060-public-original-synthetic-pose
  cancel-in-progress: true

jobs:
  three-frame-moving-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install disposable free public CPU Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version | head -3
      - name: Actually render three same-scene source-known head poses under real Cycles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          blender -b -t 2 --python temporalprobe/scene.py -- --out out
          test -s out/r060_source.json
          for frame in 00 01 02; do
            test -s "out/frame_$frame/render_passes.exr"
            test -s "out/frame_$frame/beauty.png"
          done
      - name: Independent pinned OpenEXR per-frame Z and object-ID, adversarial pose controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r060-pixel"
          "$RUNNER_TEMP/r060-pixel/bin/pip" install --disable-pip-version-check \
            --only-binary=:all: --no-cache-dir numpy==1.26.4 OpenEXR==3.3.3
          "$RUNNER_TEMP/r060-pixel/bin/python" -m unittest discover \
            -s temporalprobe -p test_audit.py -v
          "$RUNNER_TEMP/r060-pixel/bin/python" temporalprobe/audit.py \
            --root out --out out/r060_report.json
          grep -F '"status": "PASS_NARROW_REAL_MOVING_MESH_DEPTH_BY_FRAME"' out/r060_report.json
          (cd out && find . -type f ! -name artifact_manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifact_manifest.sha256)
          (cd out && sha256sum -c artifact_manifest.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r060-public-original-synthetic-temporal-HOLD
          path: out/
          retention-days: 3
          if-no-files-found: warn
