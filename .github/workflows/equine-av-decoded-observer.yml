name: Equine public synthetic independent decoded AAC inspection
on:
  pull_request:
    paths:
      - "qualification/equine/av_observer/**"
      - ".github/workflows/equine-av-decoded-observer.yml"
      - "qualification/equine/ci_fanout/**"
permissions:
  contents: read
  actions: read
jobs:
  observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fail-closed source-native proof gate
        id: fanout
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/equine/ci_fanout -p 'test_*.py' -q
          if ! python3 qualification/equine/ci_fanout/proof_gate.py --workcell equine-av-decoded-observer --out "$RUNNER_TEMP/scp-ci-fanout-receipt.json"; then
            echo "run_native=true" >> "$GITHUB_OUTPUT"
            echo "FAIL_CLOSED_NATIVE_AFTER_SELECTOR_ERROR"
          fi
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: steps.fanout.outputs.run_native == 'true'
        with:
          go-version: "1.23.2"
          cache: false
      - name: Install FFmpeg in disposable public runner (preserved first RED)
        if: steps.fanout.outputs.run_native == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - name: Independent observer hostile source tests and native AAC tests
        if: steps.fanout.outputs.run_native == 'true'
        env:
          SCP_AUDIO_VALIDATOR_PERF_OUT: ${{ runner.temp }}/equine-audio-validator-performance.json
        run: |
          set -euo pipefail
          ffmpeg -version | head -1
          cd qualification/equine/av_observer
          go test -race -count=1 ./...
          go vet ./...
          go build -o "$RUNNER_TEMP/equine-av-observer" ./cmd/av_observer
      - name: Verify synthetic decoded-audio validator confusion and qualified limitations
        if: steps.fanout.outputs.run_native == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"equine-audio-validator-performance.json"
          r=json.loads(p.read_text())
          assert r["schema"]=="scp.validator.performance.v1"
          assert r["case_count"]==14
          assert r["rejection_detection"]=={"detected":11,"total":11}
          assert r["confusion"]["ACCEPT"]["ACCEPT"]==3
          assert r["false_acceptance_count"]==r["false_rejection_count"]==0
          assert r["hard_error_count"]==r["contract_mismatch_count"]==0
          assert r["animal_acoustic_realism"]=="UNKNOWN"
          assert r["physical_contact"]=="UNKNOWN"
          assert r["verdict"]=="PASS_SYNTHETIC_VALIDATOR_CONTROLS_ONLY"
          assert not r["merge_release_CPE_approval"]
          print("DECODED_AUDIO_VALIDATOR_QUALITY",r["validator_sha256"],r["runtime"])
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.fanout.outputs.run_native == 'true'
        with:
          repository: SemperSupra/stable-character-pipeline
          ref: 497203219d035bafd72be2d4a34786c1396526ff
          path: gait-frozen
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.fanout.outputs.run_native == 'true'
        with:
          repository: SemperSupra/stable-character-pipeline
          ref: 630c31408d3b76575d361a51770b9a336393fd76
          path: audio-frozen
          persist-credentials: false
      - name: Actual pinned producers, AAC encode and independent decode
        if: steps.fanout.outputs.run_native == 'true'
        run: |
          set -euo pipefail
          (cd gait-frozen/qualification/equine/gait && go build -o "$RUNNER_TEMP/gaitclock" ./cmd/gaitclock)
          (cd audio-frozen/qualification/equine/audio && go build -o "$RUNNER_TEMP/hoof_fol" ./cmd/hoof_fol)
          mkdir -p "$RUNNER_TEMP/observer"
          "$RUNNER_TEMP/gaitclock" -actor pony-black -gait walk -surface sand \
            -cycles 1 -frames-per-cycle 48 -fps 24 -out "$RUNNER_TEMP/observer/events.json"
          "$RUNNER_TEMP/hoof_fol" -input "$RUNNER_TEMP/observer/events.json" \
            -wav "$RUNNER_TEMP/observer/source.wav" \
            -receipt "$RUNNER_TEMP/observer/synth.json" -seconds 2
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=320x180:r=24:d=2 \
            -i "$RUNNER_TEMP/observer/source.wav" \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -pix_fmt yuv420p -c:a aac -b:a 160k \
            -t 2 "$RUNNER_TEMP/observer/synthetic-aac-mux.mp4"
          "$RUNNER_TEMP/equine-av-observer" \
            -events "$RUNNER_TEMP/observer/events.json" \
            -audio "$RUNNER_TEMP/observer/synthetic-aac-mux.mp4" \
            -receipt "$RUNNER_TEMP/observer/decoded-pass.json"
      - name: Fail closed when same container metadata is silent
        if: steps.fanout.outputs.run_native == 'true'
        run: |
          set -euo pipefail
          ffmpeg -nostdin -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=320x180:r=24:d=2 \
            -f lavfi -i anullsrc=r=48000:cl=mono \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -pix_fmt yuv420p -c:a aac \
            -t 2 "$RUNNER_TEMP/observer/silent-aac-mux.mp4"
          if "$RUNNER_TEMP/equine-av-observer" \
             -events "$RUNNER_TEMP/observer/events.json" \
             -audio "$RUNNER_TEMP/observer/silent-aac-mux.mp4" \
             -receipt "$RUNNER_TEMP/observer/decoded-negative.json"; then
            echo 'FAIL OPEN: silent AAC was accepted' >&2; exit 1
          fi
          grep -q 'FAIL_AUDIO_TRANSIENT_ALIGNMENT' "$RUNNER_TEMP/observer/decoded-negative.json"
      - name: Baseline metadata comparator falsely accepts silent AAC container
        if: steps.fanout.outputs.run_native == 'true'
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/observer/silent-aac-mux.mp4" <<'PYMETADATA'
          import sys
          from qualification.equine.av_sync.verify_av import probe_video
          # This proves the exact parent metadata probe accepts an AAC stream
          # whose independent decoded-waveform observer rejects as silent.
          info = probe_video(sys.argv[1], frames=48)
          assert any(s.get('codec_name') == 'aac' for s in info['streams'])
          print('BASELINE_METADATA_PASS_BUT_DECODED_AUDIO_FAIL')
          PYMETADATA
      - name: Evidence from wholly original synthetic public sources
        if: ${{ (always()) && steps.fanout.outputs.run_native == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: equine-decoded-aac-observer-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/observer/events.json
            ${{ runner.temp }}/observer/synth.json
            ${{ runner.temp }}/observer/decoded-pass.json
            ${{ runner.temp }}/observer/decoded-negative.json
            ${{ runner.temp }}/equine-audio-validator-performance.json
