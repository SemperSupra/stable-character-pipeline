name: SCP N03 real native shoe contact root-only falsifier
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'research/n03-root-contact/**'
      - '.github/workflows/scp-n03-native-contact.yml'
permissions:
  contents: read
jobs:
  independent-contact-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: N03 synthetic negative controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/n03-root-contact -p test_contact_policy.py -v
          python3 -m py_compile research/n03-root-contact/contact_policy.py research/n03-root-contact/native_contact.py
  actual-native-root-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Exact Blender 4.5.16 native CPU
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          cd "$RUNNER_TEMP/blender"
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS https://download.blender.org/release/Blender4.5/blender-4.5.16.sha256 -o blender.sha256
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS https://download.blender.org/release/Blender4.5/blender-4.5.16-linux-x64.tar.xz -o blender-4.5.16-linux-x64.tar.xz
          hash="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "$(printf '%s' "$hash" | wc -c)" -eq 64
          printf '%s  %s\n' "$hash" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/blender" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$bin"
          "$(dirname "$bin")/blender" -b --python-expr 'import bpy,numpy;print("N03_BLENDER",bpy.app.version_string)'
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Exact MPFB2 official source
        env:
          SOURCE: 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin "$SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = "$SOURCE"
          test "$(git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          blender --command extension build --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" --output-filepath "$RUNNER_TEMP/mpfb.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb.zip"
      - name: Pin CC0 wardrobe provenance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wardrobe"
          curl -fLsS --retry 2 --max-time 140 https://files.makehumancommunity.org/asset_packs/shirts01/shirts01_cc0.zip -o "$RUNNER_TEMP/wardrobe/shirts01_cc0.zip"
          curl -fLsS --retry 2 --max-time 140 https://files.makehumancommunity.org/asset_packs/pants01/pants01_cc0.zip -o "$RUNNER_TEMP/wardrobe/pants01_cc0.zip"
          curl -fLsS --retry 2 --max-time 140 https://files.makehumancommunity.org/asset_packs/shoes01/shoes01_cc0.zip -o "$RUNNER_TEMP/wardrobe/shoes01_cc0.zip"
          echo 'a5a723b0e84a109bb190fcfeac7f1de4138d875da3e30fe5b3340eac9f38bcd3  '"$RUNNER_TEMP/wardrobe/shirts01_cc0.zip" | sha256sum -c -
          echo 'e4e0ec60db34f279be291a83cfd7b342a7c5cf09bb7676682a5f39f4f6ac4ad9  '"$RUNNER_TEMP/wardrobe/pants01_cc0.zip" | sha256sum -c -
          echo 'ded3f70428505eabbf1f6d7b5f61196a7366ef20757103d276ad0ed336c35ada  '"$RUNNER_TEMP/wardrobe/shoes01_cc0.zip" | sha256sum -c -
      - name: Reproduce original synthetic native pair and fitted shoes
        run: |
          set -euo pipefail
          blender -b -t 2 --python-exit-code 12 --python research/r078-r009-mpfb-pair/makehuman_pair.py -- --stage build --source "$RUNNER_TEMP/mpfb2" --out "$RUNNER_TEMP/r078"
          base="$RUNNER_TEMP/r078/aster-juniper-official-mpfb.blend"
          base_sha="$(sha256sum "$base" | cut -d ' ' -f1)"
          blender -b "$base" -t 2 --python-exit-code 12 --python research/r082-mpfb-native-wardrobe/native_wardrobe.py -- --stage build --packs "$RUNNER_TEMP/wardrobe" --baseline-sha "$base_sha" --out "$RUNNER_TEMP/r082"
      - name: Independently measure real root-only geometry after corrections
        run: |
          set -euo pipefail
          scene="$RUNNER_TEMP/r082/aster-juniper-cc0-native-wardrobe.blend"
          sha="$(sha256sum "$scene" | cut -d ' ' -f1)"
          blender -b "$scene" -t 2 --python-exit-code 12 --python research/n03-root-contact/native_contact.py -- --scene "$scene" --sha "$sha" --wardrobe "$RUNNER_TEMP/r082/build.json" --out "$RUNNER_TEMP/n03"
          python3 -m json.tool "$RUNNER_TEMP/n03/n03-root-only.json" > /dev/null
      - name: Only synthetic numeric JSON, no scenes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n03-native-root-only-json
          path: ${{ runner.temp }}/n03/*.json
          retention-days: 3
          if-no-files-found: ignore
