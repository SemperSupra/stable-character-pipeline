name: R014 MHR actual facial morph single-channel vs combination foldover QA
on:
  push:
    branches: [research/r014-face-deformation-factorial-20261112]
    paths: ['r014/mhr_face_factorial_probe.py','.github/workflows/r014-mhr-face-factorial.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r014-mhr-face-factorial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_facial_experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        mode: [single, combination]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile source before acquiring binaries
        run: python3 -m compileall -q r014
      - name: Pin disposable Blender 4.5.16
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014face/out"
          cd "$RUNNER_TEMP/r014face"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          sha="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#sha}" -eq 64
          printf '%s  %s\n' "$sha" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014face" -maxdepth 2 -name blender -type f | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Rebuild public original MHR native rig and exact source provenance
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip \
            -o "$RUNNER_TEMP/r014face/assets.zip"
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  $RUNNER_TEMP/r014face/assets.zip" | sha256sum --check
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 3 \
            --python r014/mhr_fbx_native_probe.py -- \
            --phase create --archive "$RUNNER_TEMP/r014face/assets.zip" \
            --sha256 e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94 \
            --output "$RUNNER_TEMP/r014face/out" \
            --receipt "$RUNNER_TEMP/r014face/out/native_create.json"
      - name: Actual facial mesh case matrix, closeup rendering and fail-closed receipts
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014face/out/R014_MHR_neutral_lod1.blend" \
            --python-exit-code 3 --python r014/mhr_face_factorial_probe.py -- \
            --out "$RUNNER_TEMP/r014face/out" --mode '${{ matrix.mode }}'
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=Path(os.environ['RUNNER_TEMP'])/'r014face/out'
          r=json.loads((p/'mhr_face_factorial_receipt.json').read_text())
          assert r['status']=='HOLD_FACIAL_ANATOMY_AND_CINEMATIC_QUALITY'
          assert r['mode']=='${{ matrix.mode }}'
          assert r['mesh_vertices']==18439 and r['source_rig_bones']==126
          assert r['case_count']==(20 if r['mode']=='single' else 8)
          assert all('inversions' in x for x in r['cases'])
          assert all((p/x).stat().st_size>5000 for x in r['closeup_pngs'])
          print('PASS_FACTORIAL_GEOMETRY_EVIDENCE_CAPTURE_ONLY; REALISM_HOLD')
          PY
          (cd "$RUNNER_TEMP/r014face/out" && sha256sum *.json *.blend *.png > sha256sum.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-mhr-facial-factorial-${{ matrix.mode }}-HOLD
          path: ${{ runner.temp }}/r014face/out/*
          retention-days: 7
