name: R64 real tiny visual critic vs inverse scene source graph free CPU
on:
  pull_request:
    paths:
      - research/inverse-scene-r0/vlm_critic.py
      - research/inverse-scene-r0/R1-VLM-CRITIC.md
      - .github/workflows/r64-inverse-scene-smolvlm-cpu.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r64-vlm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-blind-vlm-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Pin actual free CPU inference packages previously qualified in R033
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --no-cache-dir \
            torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install --disable-pip-version-check --no-input --no-cache-dir \
            numpy==2.1.3 transformers==4.57.1 accelerate==1.12.0 \
            pillow==12.0.0 huggingface_hub==0.36.0
      - name: Execute real pinned 256M VLM on unlabelled reference and candidate renders
        env:
          R64_VLM_OUT: ${{ github.workspace }}/out/r64-vlm-critic
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          mkdir -p out/r64-vlm-critic
          python3 research/inverse-scene-r0/vlm_critic.py 2>&1 | tee out/r64-vlm-critic/job.log
          python3 - <<'PY'
          import json,pathlib
          x=json.loads(pathlib.Path('out/r64-vlm-critic/receipt.json').read_text())
          assert x['status']=='PASS' and len(x['observations'])==9
          assert x['summary']['n']==9
          print('SMOLVLM_R64_RAW_EVIDENCE_SCHEMA=PASS')
          PY
      - name: Preserve original synthetic panels and versioned blind VLM receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r64-inverse-smolvlm-cpu-${{ github.run_id }}
          path: |
            out/r64-vlm-critic/receipt.json
            out/r64-vlm-critic/job.log
            out/r64-vlm-critic/*.png
          retention-days: 3
          if-no-files-found: warn
