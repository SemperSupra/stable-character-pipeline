name: Audio Control R1 restart ledger proof (synthetic)
on:
  pull_request:
    paths:
      - 'audio-control/control/recoveryledger/**'
      - '.github/workflows/audio-control-r1-recovery-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process-restart-evidence:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: File-journal restart/saturation/corruption tests only, no device audio
        working-directory: audio-control/control
        run: go test -race -count=1 -v ./recoveryledger
      - name: Static analysis
        working-directory: audio-control/control
        run: go vet ./recoveryledger
