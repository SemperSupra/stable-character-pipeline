name: R092 Blender 4.5 vs 5.2 LTS vs 5.3 native source-safe qualification
on:
  pull_request:
    paths:
      - 'research/r092-blender-version/**'
      - '.github/workflows/r092-blender-version.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-native-bakeoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '4.5.16'
            folder: 'Blender4.5'
          - version: '5.2.4'
            folder: 'Blender5.2'
          - version: '5.3.0'
            folder: 'Blender5.3'
    env:
      R092_VERSION: ${{ matrix.version }}
      R092_DIR: /tmp/r092-blender
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download official standalone and identify exact source hash
        shell: bash
        run: |
          set -euo pipefail
          url="https://download.blender.org/release/${{ matrix.folder }}/blender-${{ matrix.version }}-linux-x64.tar.xz"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 480 --output /tmp/blender.tar.xz "$url"
          sha256sum /tmp/blender.tar.xz
          mkdir -p /tmp/r092-version
          tar -xf /tmp/blender.tar.xz --strip-components=1 -C /tmp/r092-version
          /tmp/r092-version/blender --background --factory-startup --python-expr 'import bpy;print("R092_ACTUAL_VERSION",bpy.app.version_string)'
      - name: Save original synthetic animated scene
        run: /tmp/r092-version/blender --background --factory-startup --python research/r092-blender-version/smoke.py -- build
      - name: Independent reopen, geometry and render witness
        run: /tmp/r092-version/blender --background --factory-startup --python research/r092-blender-version/smoke.py -- audit
