name: R036 Bounded Regional RBF Registration Qualification
on:
  push:
    branches:
      - research/r036-regional-warp-20261116
    paths:
      - 'research/anatomy-bakeoff/regionalwarp/**'
      - '.github/workflows/anatomy-r036-regional-warp.yml'
  pull_request:
    paths:
      - 'research/anatomy-bakeoff/regionalwarp/**'
      - '.github/workflows/anatomy-r036-regional-warp.yml'
permissions:
  contents: read
concurrency:
  group: r036-regionalwarp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-synthetic-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/anatomy-bakeoff
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Original offline Go test, race, vet, no network
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          go version
          go test -race -count=1 ./...
          go vet ./...
