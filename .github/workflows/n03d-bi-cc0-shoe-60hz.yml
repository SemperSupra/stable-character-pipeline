name: N03D BI original actual CC0 shoe 356 supported 60Hz fixed heel ball material
on:
  push:
    branches: [research/n03d-bi-cc0-shoe-60hz-20261121, review/r009-original-shoe-pitch-witness-20261122]
    paths:
      - 'research/n03d-bi-cc0-shoe-60hz/**'
      - '.github/workflows/n03d-bi-cc0-shoe-60hz.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n03d-bi-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-thirdparty-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Strict original CC0 source, 14 adversarial tail and false force controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/n03d-bi-cc0-shoe-60hz -p 'test_critic.py' -v
          python3 -m py_compile research/n03d-bi-cc0-shoe-60hz/*.py
      - name: Peer independent shoe chord-vs-horizontal sign controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/n03d-bi-cc0-shoe-60hz -p 'test_peer_pitch.py' -v
          python3 -m py_compile research/n03d-bi-cc0-shoe-60hz/peer_pitch_*.py
      - name: Strict source-only real BVH controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/r088-motion-real -p 'test_bvh_preflight.py' -v
          python3 -m unittest discover -s research/r082-mpfb-native-wardrobe -p 'test_wardrobe_contract.py' -v
          python3 -m unittest discover -s research/r084-shoe-contact -p 'test_shoe_contact.py' -v
          python3 -m unittest discover -s research/r090-dressed -p 'test_compare.py' -v
          python3 -m py_compile research/r090-dressed/real_retarget.py research/r090-dressed/measure.py research/r090-dressed/compare.py
          python3 -m unittest discover -s research/n03d-g-contact-critic -p 'test_gate.py' -v
          python3 -m py_compile research/n03d-d-native-trace/*.py research/n03d-g-contact-critic/gate.py
      - name: Exact official Blender 5.2.4 headless native binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r092-blender"
          cd "$RUNNER_TEMP/r092-blender"
          base="https://download.blender.org/release/Blender5.2"
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-5.2.4.sha256" -o blender.sha256
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-5.2.4-linux-x64.tar.xz" -o blender-5.2.4-linux-x64.tar.xz
          hash="$(grep -F blender-5.2.4-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "$(printf '%s' "$hash" | wc -c)" -eq 64
          printf '%s  %s\n' "$hash" blender-5.2.4-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-5.2.4-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r092-blender" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Verify real downloaded Blender version is exactly 5.2.4
        run: |
          set -euo pipefail
          blender --background --python-exit-code 12 --python-expr 'import bpy; assert bpy.app.version == (5,2,4), (bpy.app.version, "VERSION_NOT_EXACT"); print("BQS_PINNED_VERSION", bpy.app.version_string)'
      - name: Source-authenticated GPL Diffeomorphic retargeter and CC0 native MPFB
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb2" "$RUNNER_TEMP/retarget_bvh"
          git -C "$RUNNER_TEMP/mpfb2" init -q
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          test "$(git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          git -C "$RUNNER_TEMP/retarget_bvh" init -q
          git -C "$RUNNER_TEMP/retarget_bvh" remote add origin https://github.com/Diffeomorphic/retarget_bvh.git
          git -C "$RUNNER_TEMP/retarget_bvh" -c protocol.version=2 fetch -q --depth 1 origin a4f2a394901d043457a9426f0d9e2ade9cda702c
          git -C "$RUNNER_TEMP/retarget_bvh" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/retarget_bvh" rev-parse HEAD)" = a4f2a394901d043457a9426f0d9e2ade9cda702c
          grep -q 'blender_version_min = "4.2.0"' "$RUNNER_TEMP/retarget_bvh/blender_manifest.toml"
          grep -q 'SPDX:GPL-2.0-or-later' "$RUNNER_TEMP/retarget_bvh/blender_manifest.toml"
          blender --command extension build --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" --output-filepath "$RUNNER_TEMP/mpfb-pinned.zip"
          blender --command extension build --source-dir "$RUNNER_TEMP/retarget_bvh" --output-filepath "$RUNNER_TEMP/retarget-pinned.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/retarget-pinned.zip"
          blender -b -t 2 --python-exit-code 12 --python research/r078-r009-mpfb-pair/makehuman_pair.py -- --stage build --source "$RUNNER_TEMP/mpfb2" --out "$RUNNER_TEMP/r078"
      - name: Acquire exact original community CC0 clothing source archives
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wardrobe"
          for pack in shirts01 pants01 shoes01; do
            curl --retry 2 --connect-timeout 15 --max-time 180 -fLsS "https://files.makehumancommunity.org/asset_packs/$pack/${pack}_cc0.zip" -o "$RUNNER_TEMP/wardrobe/${pack}_cc0.zip"
          done
          echo 'a5a723b0e84a109bb190fcfeac7f1de4138d875da3e30fe5b3340eac9f38bcd3  '"$RUNNER_TEMP/wardrobe/shirts01_cc0.zip" | sha256sum -c -
          echo 'e4e0ec60db34f279be291a83cfd7b342a7c5cf09bb7676682a5f39f4f6ac4ad9  '"$RUNNER_TEMP/wardrobe/pants01_cc0.zip" | sha256sum -c -
          echo 'ded3f70428505eabbf1f6d7b5f61196a7366ef20757103d276ad0ed336c35ada  '"$RUNNER_TEMP/wardrobe/shoes01_cc0.zip" | sha256sum -c -
      - name: Real native CC0 garment fitting and measured source baseline
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r090-native"
          scene="$RUNNER_TEMP/r078/aster-juniper-official-mpfb.blend"
          sha="$(sha256sum "$scene" | cut -d ' ' -f1)"
          blender -b "$scene" -t 2 --python-exit-code 12 --python research/r082-mpfb-native-wardrobe/native_wardrobe.py -- --stage build --packs "$RUNNER_TEMP/wardrobe" --baseline-sha "$sha" --out "$RUNNER_TEMP/r082"
          source="$RUNNER_TEMP/r082/aster-juniper-cc0-native-wardrobe.blend"
          sum="$(sha256sum "$source" | cut -d ' ' -f1)"
          blender -b "$source" -t 2 --python-exit-code 12 --python research/r090-dressed/measure.py -- --scene "$source" --sha "$sum" --wardrobe "$RUNNER_TEMP/r082/build.json" --out "$RUNNER_TEMP/r090-native/authored.json"
      - name: Actual 360-frame source capture genuine third-party retarget onto CC0-dressed rigs
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/r090-native/Neutral_FW.bvh"
          curl --retry 2 --connect-timeout 12 --max-time 60 -fLsS "https://raw.githubusercontent.com/tomcatmew/simple_motion_matching/10938b4881b55c5801faded89e427407ddf14bce/data/100style/Neutral_FW.bvh" -o "$src"
          test "$(git hash-object "$src")" = a534f69b1d7a867f9b7d4dccefcf3f1d255c4a61
          scene="$RUNNER_TEMP/r082/aster-juniper-cc0-native-wardrobe.blend"
          sha="$(sha256sum "$scene" | cut -d ' ' -f1)"
          blender -b "$scene" -t 2 --python-exit-code 12 --python research/r090-dressed/real_retarget.py -- --stage build --scene "$scene" --sha "$sha" --source "$src" --clip "$RUNNER_TEMP/r090-native/clip.bvh" --out "$RUNNER_TEMP/r090-native/report.json"
          blender -b "$RUNNER_TEMP/r090-native/report.blend" -t 2 --python-exit-code 12 --python research/r090-dressed/real_retarget.py -- --stage verify --out "$RUNNER_TEMP/r090-native/report.json"
          target="$RUNNER_TEMP/r090-native/report.blend"
          sum="$(sha256sum "$target" | cut -d ' ' -f1)"
          blender -b "$target" -t 2 --python-exit-code 12 --python research/r090-dressed/measure.py -- --scene "$target" --sha "$sum" --wardrobe "$RUNNER_TEMP/r082/build.json" --retarget "$RUNNER_TEMP/r090-native/report.json" --out "$RUNNER_TEMP/r090-native/recorded.json"
          python3 research/r090-dressed/compare.py "$RUNNER_TEMP/r090-native/authored.json" "$RUNNER_TEMP/r090-native/recorded.json" "$RUNNER_TEMP/r090-native/comparison.json"
      - name: Actual ORIGINAL CC0 shoe at 356 60Hz source-key-backed temporal samples and ground plane
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/r090-native/report.blend"
          sha="$(sha256sum "$target" | cut -d ' ' -f1)"
          blender -b "$target" -t 2 --python-exit-code 12 --python research/n03d-bi-cc0-shoe-60hz/native.py -- --scene "$target" --sha "$sha" --wardrobe "$RUNNER_TEMP/r082/build.json" --retarget "$RUNNER_TEMP/r090-native/report.json" --out "$RUNNER_TEMP/r090-native/n03d-bi-cc0-shoe.json"
      - name: Independent real CC0 shoe geometry, rig-LR weights and 4 excluded source tail frames HOLD critic
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,sys,json
          from pathlib import Path
          sys.path.insert(0,"research/n03d-bi-cc0-shoe-60hz")
          from critic import check
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"r090-native"/"n03d-bi-cc0-shoe.json").read_text())
          assert check(x)=="HOLD" and not x["true_contact_stance_accepted"]
          print("N03D_BI_ORIGINAL_CC0_SHOE_SOURCE_60HZ_HOLD",json.dumps({
            "actors":[{"actor":a["actor"],"shoes":a["source_shoe_asset"],
                       "regions":a["source_actual_deformed_shoe_patches"]} for a in x["actors"]],
            "source_supported_samples":x["native_60hz_source_supported_samples"],
            "withheld_tail":x["excluded_unbacked_source_60hz_tail_frames"],"status":x["status"]},
            sort_keys=True))
          PY
      - name: Independently inspect real original CC0 heel-to-ball world-pitch geometry
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/r090-native/report.blend"
          sha="$(sha256sum "$target" | cut -d ' ' -f1)"
          blender -b "$target" -t 2 --python-exit-code 12 --python research/n03d-bi-cc0-shoe-60hz/peer_pitch_native.py -- --scene "$target" --sha "$sha" --wardrobe "$RUNNER_TEMP/r082/build.json" --retarget "$RUNNER_TEMP/r090-native/report.json" --out "$RUNNER_TEMP/r090-native/n03d-bi-peer-original-shoe-pitch.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r090-native"/"n03d-bi-peer-original-shoe-pitch.json"
          d=json.loads(p.read_text())
          assert d["status"]=="HOLD" and d["mvp_accepted"] is False
          assert sorted(a["name"] for a in d["actors"])==["AsterOriginal","JuniperOriginal"]
          assert d["sampled_60hz_indices"]==[0,80,160,240,355]
          for actor in d["actors"]:
              assert len(actor["sampled_original_geometry"])==5
              for row in actor["sampled_original_geometry"]:
                  for side in ("left","right"):
                      m=row[side]
                      assert m["physical_contact_accepted"] is False
                      assert m["atan2_asin_agreement_deg"]<1e-8
          print("R009_ORIGINAL_CC0_REAL_SHOE_GEOMETRY_HOLD",json.dumps(d,sort_keys=True))
          PY
      - name: Upload native evidence JSON only (no source motion, Blend or human assets)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n03d-bi-true-cc0-shoe-356source60hz-json-${{ github.run_id }}
          path: ${{ runner.temp }}/r090-native/*.json
          retention-days: 3
          if-no-files-found: ignore
