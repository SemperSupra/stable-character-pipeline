name: Spatial Audio public CPU source qualification
on:
  pull_request:
    paths:
      - 'spatial-audio/**'
      - '.github/workflows/spatial-audio-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  libspatialaudio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: spatial-audio/go.mod
      - name: Install public compiler and audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y meson ninja-build pkg-config g++ ffmpeg git
      - name: Go validation, race tests and vet
        working-directory: spatial-audio
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Fetch exact upstream LGPL source revision
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/libspatialaudio"
          git init -q "$repo"
          git -C "$repo" remote add origin https://github.com/videolan/libspatialaudio.git
          git -C "$repo" fetch -q --depth=1 origin d149ed9744fd399b835c6f2920511f8cbcfce5ea
          git -C "$repo" -c advice.detachedHead=false checkout -q --detach FETCH_HEAD
          actual="$(git -C "$repo" rev-parse HEAD)"
          test "$actual" = "d149ed9744fd399b835c6f2920511f8cbcfce5ea"
          grep -q 'LGPLv2.1' "$repo/LICENSE"
          echo "upstream_revision_verified=$actual"
      - name: Build native renderer and run upstream tests
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/libspatialaudio"
          install="$RUNNER_TEMP/libspatialaudio-install"
          meson setup "$RUNNER_TEMP/spatial-build" "$repo" \
            -Dlibmysofa=disabled -Dmit_hrtf=enabled \
            --prefix="$install" --libdir=lib --buildtype=release
          meson compile -C "$RUNNER_TEMP/spatial-build"
          meson test -C "$RUNNER_TEMP/spatial-build" --print-errorlogs --num-processes=2
          meson install -C "$RUNNER_TEMP/spatial-build"
          test -f "$install/lib/pkgconfig/libspatialaudio.pc"
          echo "native_upstream_renderer_tests_PASS"
      - name: Render original moving-source signal for headphone, stereo, surround and height layouts
        run: |
          set -euo pipefail
          install="$RUNNER_TEMP/libspatialaudio-install"
          export PKG_CONFIG_PATH="$install/lib/pkgconfig"
          export LD_LIBRARY_PATH="$install/lib"
          mkdir -p "$RUNNER_TEMP/spatial-test-output"
          g++ -std=c++14 -O2 -Wall -Wextra spatial-audio/qualification/renderer_smoke.cpp \
            -o "$RUNNER_TEMP/spatial-qual" $(pkg-config --cflags --libs libspatialaudio)
          "$RUNNER_TEMP/spatial-qual" "$RUNNER_TEMP/spatial-test-output" \
            | tee "$RUNNER_TEMP/spatial-test-output/renderer-receipts.jsonl"
          (cd spatial-audio && go run ./cmd/verify "$RUNNER_TEMP/spatial-test-output")
          echo "No spatial media uploaded from public CI."
      - name: Clean temporary upstream source and synthetic audio
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/libspatialaudio" "$RUNNER_TEMP/libspatialaudio-install" \
            "$RUNNER_TEMP/spatial-build" "$RUNNER_TEMP/spatial-test-output" "$RUNNER_TEMP/spatial-qual"
