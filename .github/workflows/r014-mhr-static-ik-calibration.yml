name: R014 actual MHR leg IK chain bone-tip calibration
on:
  push:
    branches: [research/r014-mhr-static-ik-chain-calibration-20261112]
    paths:
      - r014/mhr_static_ik_tip_calibration.py
      - .github/workflows/r014-mhr-static-ik-calibration.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r014-static-ik-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source_native_leg_ik:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    strategy:
      fail-fast: false
      matrix:
        side: [l, r]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile source before any asset
        run: python3 -m compileall -q r014
      - name: Download source hash-checked Blender in disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-static-ik/out"
          cd "$RUNNER_TEMP/r014-static-ik"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          sha="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#sha}" -eq 64
          printf '%s  %s\n' "$sha" blender-4.5.16-linux-x64.tar.xz | sha256sum -c -
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014-static-ik" -maxdepth 2 -name blender -type f | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Import authentic pinned MHR public neutral rig
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip \
            -o "$RUNNER_TEMP/r014-static-ik/assets.zip"
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  $RUNNER_TEMP/r014-static-ik/assets.zip" | sha256sum -c -
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 3 \
            --python r014/mhr_fbx_native_probe.py -- \
            --phase create --archive "$RUNNER_TEMP/r014-static-ik/assets.zip" \
            --sha256 e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94 \
            --output "$RUNNER_TEMP/r014-static-ik/out" \
            --receipt "$RUNNER_TEMP/r014-static-ik/out/source_create.json"
      - name: Fresh-process native rig bone-tip and three target experiments per owner
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014-static-ik/out/R014_MHR_neutral_lod1.blend" \
            --python-exit-code 3 --python r014/mhr_static_ik_tip_calibration.py -- \
            --side '${{ matrix.side }}' --out "$RUNNER_TEMP/r014-static-ik/out"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r014-static-ik/out"
          r=json.loads((p/"static_ik_tip_calibration.json").read_text())
          assert r["status"]=="HOLD_STATIC_IK_NOT_GAIT_READY"
          assert r["side"]=="${{ matrix.side }}"
          assert len(r["cases"])==6
          assert (p/r["native_blend"]).stat().st_size>100000
          assert (p/r["technical_frame"]).stat().st_size>5000
          print("R014_STATIC_IK_GAIT_RELEASE_HOLD",r["side"],r["shin_tail_to_foot_head_gap"],r["least_bad_case"]["case"])
          PY
          (cd "$RUNNER_TEMP/r014-static-ik/out" && sha256sum *.blend *.json *.png > sha256sum.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-mhr-static-ik-${{ matrix.side }}-research
          path: ${{ runner.temp }}/r014-static-ik/out/*
          retention-days: 7
