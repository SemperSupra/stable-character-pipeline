name: R014 native MHR corrective bakeoff admission synthetic gate
on:
  pull_request:
    paths:
      - 'r014/bakeoffgate/**'
      - '.github/workflows/r014-native-mhr-bakeoff-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r014-native-mhr-bakeoff-gate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-safe-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Read-only checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Exercise independent source/venue and matched-pose negative controls
        working-directory: r014/bakeoffgate
        run: |
          go version
          go test -race -count=1 -v ./...
          go vet ./...
      - name: Produce synthetic admission receipt
        working-directory: r014/bakeoffgate
        run: go run ./cmd/receipt > "$GITHUB_WORKSPACE/r014_native_mhr_bakeoff_gate_receipt.json"
      - name: Archive source-only numeric/metadata receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r014-native-mhr-bakeoff-gate-synthetic-receipt
          path: r014_native_mhr_bakeoff_gate_receipt.json
          if-no-files-found: error
          retention-days: 7
