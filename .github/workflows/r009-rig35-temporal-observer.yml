name: R009 original 35-joint 72-frame independent temporal observer
on:
  pull_request:
    paths:
      - 'qualification/human_rig_motion/**'
      - '.github/workflows/r009-rig35-temporal-observer.yml'
permissions:
  contents: read
jobs:
  temporal-source-observer:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce single-writer additive scope against pinned structural owner
        run: |
          set -euo pipefail
          git diff --name-only 188d6b05b14d517cf6f6839827ebe955a7134eb9 HEAD > "$RUNNER_TEMP/changed"
          cat "$RUNNER_TEMP/changed"
          if grep -v -E '^qualification/human_rig_motion/|^\.github/workflows/r009-rig35-temporal-observer\.yml$' "$RUNNER_TEMP/changed"; then
            echo 'FAIL: original producer or observer owner modified' >&2
            exit 2
          fi
      - name: Independent quaternion hostile tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s qualification/human_rig_motion -p 'test_*.py' -v
      - name: Generate unchanged original GLB and inspect all forty 72-sample rotation tracks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rig35-temporal"
          python3 qualification/original_reusable_characters/modular_wardrobe_v1.py \
            --out "$RUNNER_TEMP/rig35-temporal/source.glb" \
            --manifest "$RUNNER_TEMP/rig35-temporal/manifest.json"
          python3 qualification/human_rig_motion/temporal.py \
            --glb "$RUNNER_TEMP/rig35-temporal/source.glb" \
            --receipt "$RUNNER_TEMP/rig35-temporal/temporal.json"
          python3 - "$RUNNER_TEMP/rig35-temporal" <<'PY'
          import hashlib,json,sys,pathlib
          base=pathlib.Path(sys.argv[1])
          raw=(base/"source.glb").read_bytes()
          r=json.loads((base/"temporal.json").read_text())
          assert r["source_glb_sha256"]==r["independent_structure_sha256"]==hashlib.sha256(raw).hexdigest()
          assert r["observed_rotation_tracks"]==40 and r["samples_per_track"]==72
          assert all(v["controlled_rotation_joints"]==20 for v in r["actors"].values())
          assert r["biological_joint_coordinate_system"]=="UNKNOWN"
          assert r["normative_joint_ROM"]=="UNKNOWN"
          assert not r["human_motion_accepted"] and not r["release_or_CPE_admission"]
          print("RIG35_TECHNICAL_SAMPLING_ONLY_PASS_HUMAN_ANATOMY_UNKNOWN")
          PY
      - name: Preserve bounded original-only analytical evidence, not GLB payload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r009-original-35joint-timeline-receipt
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rig35-temporal/temporal.json
            ${{ runner.temp }}/rig35-temporal/manifest.json
