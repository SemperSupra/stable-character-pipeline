name: Oneirifact R3 independent geometry matrix (direct public GHA)
run-name: Oneirifact R3 analytic-volume Blender roundtrip — ${{ github.ref_name }}

on:
  push:
    branches: [research/oneirifact-r3-analytic-holdouts-20261113]
    paths:
      - 'qualification/geometry-donors/oneirifact-r3-holdouts/**'
      - '.github/workflows/oneirifact-r3-holdouts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneirifact-r3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  blender-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout synthetic-only public fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate independent GLB structure and fixture hashes
        shell: bash
        working-directory: qualification/geometry-donors/oneirifact-r3-holdouts
        run: |
          set -euo pipefail
          python3 -m py_compile decode_and_validate.py blender_matrix.py check_blender_reports.py
          python3 decode_and_validate.py
      - name: Obtain official Blender 4.5.16 with vendor checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oneirifact-r3-blender"
          cd "$RUNNER_TEMP/oneirifact-r3-blender"
          base=https://download.blender.org/release/Blender4.5
          curl -fsSL --retry 3 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fsSL --retry 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          hash="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#hash}" -eq 64
          printf '%s  %s\n' "$hash" blender-4.5.16-linux-x64.tar.xz | sha256sum -c -
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          echo "BLENDER_BIN=$RUNNER_TEMP/oneirifact-r3-blender/blender-4.5.16-linux-x64/blender" >> "$GITHUB_ENV"
      - name: Original and fresh-process Blender reimports for all CSG modes
        shell: bash
        working-directory: qualification/geometry-donors/oneirifact-r3-holdouts
        run: |
          set -euo pipefail
          export LIBGL_ALWAYS_SOFTWARE=1
          for name in rectangular-box sphere cylinder drilled-block disconnected-spheres; do
            "$BLENDER_BIN" --background --factory-startup --python-exit-code 8 --python blender_matrix.py -- import "fixtures/$name.glb" "fixtures/$name.import.json"
            "$BLENDER_BIN" --background --factory-startup --python-exit-code 8 --python blender_matrix.py -- reimport "fixtures/$name.roundtrip.glb" "fixtures/$name.reimport.json"
          done
          python3 check_blender_reports.py
      - name: Upload receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oneirifact-r3-blender-${{ github.run_attempt }}
          path: |
            qualification/geometry-donors/oneirifact-r3-holdouts/glb-measurements.json
            qualification/geometry-donors/oneirifact-r3-holdouts/blender-reports.json
            qualification/geometry-donors/oneirifact-r3-holdouts/fixtures/*.import.json
            qualification/geometry-donors/oneirifact-r3-holdouts/fixtures/*.reimport.json
          if-no-files-found: warn
          retention-days: 7
