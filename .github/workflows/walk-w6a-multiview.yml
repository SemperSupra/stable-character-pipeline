name: WALK W6A - Original Full-Height Multi-view Visual Witness
on:
  pull_request:
    paths:
      - 'qualification/walk_w6a/**'
      - '.github/workflows/walk-w6a-multiview.yml'
permissions:
  contents: read
jobs:
  native-proxy-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [forward, outward]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Genuine source C4 24 frame native skin, full-height original body proxy and two H264 viewpoints
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri xvfb ffmpeg
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0'
          python qualification/walk_w16c4/ground_feasibility.py --profile "$PROFILE" --out "walk-w6a-$PROFILE"
          xvfb-run -a python qualification/walk_w16c5a/w5d_grounded_native.py --profile "$PROFILE" --source "walk-w6a-$PROFILE/source.json" --out "walk-w6a-$PROFILE"
          python qualification/walk_w16c5a/w4d_liveness.py "walk-w6a-$PROFILE"
          xvfb-run -a python qualification/walk_w6a/proxy_multiview.py --source "walk-w6a-$PROFILE" --out "walk-w6a-$PROFILE/rendered"
          for cam in OriginalFront OriginalOblique; do
            set +e
            python qualification/walk_w6a/qa_video.py --video "walk-w6a-$PROFILE/rendered/$cam.mp4" --out "walk-w6a-$PROFILE/rendered/qa-$cam"
            code=$?
            set -e
            if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
              echo "VISUAL_QA_NOT_EVALUABLE"; exit 1
            fi
            python -c 'import json,sys; c=int(sys.argv[1]); p=sys.argv[2]; r=json.load(open(p)); assert (c==0 and r["status"]=="PASS_L1_VIDEO_ONLY") or (c==2 and r["status"]=="FAIL"); print("W6A_L1_OBSERVED_NONPROMOTABLE",r["status"],r["failures"])' "$code" "walk-w6a-$PROFILE/rendered/qa-$cam/video_qa.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-w6a-original-multiview-${{ matrix.profile }}
          path: walk-w6a-${{ matrix.profile }}/
          retention-days: 3
          if-no-files-found: warn
