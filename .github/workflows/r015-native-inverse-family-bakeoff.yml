name: R015 Native 72-Body Inverse Model Family and Measurement Ablation
on:
  push:
    branches: [research/r014-mpfb-native-inverse-model-bakeoff-20261112]
    paths:
      - 'r014/mpfb_native_inverse_family_bakeoff.py'
      - '.github/workflows/r015-native-inverse-family-bakeoff.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r015-real-native-72-body-bakeoff
  cancel-in-progress: true
jobs:
  independent-model-feature-ablations:
    name: Held-out real MPFB 72-body model family / ${{ matrix.profile }} features
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        profile: [bbox, slices]
    steps:
      - name: Checkout public independent research source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile and create disposable modern CPU regression environment
        run: |
          set -euo pipefail
          python3 -m compileall -q r014/mpfb_native_inverse_family_bakeoff.py
          python3 -m venv "$RUNNER_TEMP/r015-native-ml"
          . "$RUNNER_TEMP/r015-native-ml/bin/activate"
          python -m pip install --no-input --no-cache-dir --disable-pip-version-check \
            numpy==2.1.3 scipy==1.15.2 scikit-learn==1.6.1
      - name: Acquire verified original source-native 72-shape numeric fixtures, not model binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r015-native/source/shard0" "$RUNNER_TEMP/r015-native/source/shard1" "$RUNNER_TEMP/r015-native/out"
          gh run download 43289442194 --repo "$GITHUB_REPOSITORY" --name r014-native-shape-doe-0 --dir "$RUNNER_TEMP/r015-native/source/shard0"
          gh run download 43289442194 --repo "$GITHUB_REPOSITORY" --name r014-native-shape-doe-1 --dir "$RUNNER_TEMP/r015-native/source/shard1"
          test -s "$RUNNER_TEMP/r015-native/source/shard0/native_inverse_doe_samples_0.jsonl"
          test -s "$RUNNER_TEMP/r015-native/source/shard1/native_inverse_doe_samples_1.jsonl"
      - name: Train and compare 6 models across two group-disjoint held-out splits
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/r015-native-ml/bin/activate"
          python r014/mpfb_native_inverse_family_bakeoff.py \
             --dataset "$RUNNER_TEMP/r015-native/source" \
             --profile "$PROFILE" \
             --out "$RUNNER_TEMP/r015-native/out/inverse_family_$PROFILE.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          path=Path(os.environ["RUNNER_TEMP"])/"r015-native/out"/("inverse_family_"+os.environ["PROFILE"]+".json")
          r=json.loads(path.read_text())
          assert r["status"]=="PASS_REAL_NATIVE_MPFB_FAMILY_BAKEOFF_SMALL_HOLDOUT_ONLY"
          assert len(r["splits"])==2
          assert all(s["macro_leakage_count"]==0 and s["mesh_leakage_count"]==0 for s in r["splits"])
          print("PASS_ORIGINAL_NATIVE_GEOMETRY_FEATURE_BAKEOFF",r["test_profile"])
          PY
      - name: Retain public source hashes and aggregate metrics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r015-native-mapper-model-bakeoff-${{ matrix.profile }}
          path: ${{ runner.temp }}/r015-native/out/*.json
          if-no-files-found: warn
          retention-days: 7
