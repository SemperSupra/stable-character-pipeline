name: Spatial W4h public actual Blender 3D camera and annotated Foley mux
on:
  pull_request:
    paths:
      - 'qualification/walk_w4h/**'
      - '.github/workflows/spatial-w4h-blender-av.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-blender-3d:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-clean actual Blender and FFmpeg dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb libegl1 libgl1 libopengl0 libglx-mesa0 libosmesa6
          command -v ffmpeg
          command -v ffprobe
      - name: Reuse W14 original weighted 3D source instead of duplicate rig
        run: |
          set -euo pipefail
          python -u qualification/walk_w14/weighted_3d.py --profile forward --out w4h-w14-source
          test -s w4h-w14-source/original_two_weighted_3d_characters.blend
          test -s w4h-w14-source/original_two_weighted_3d_characters.glb
      - name: Native original weighted 3D camera frames + authored 48k Foley and lossless A/V
        run: |
          set -euo pipefail
          xvfb-run -a python -u qualification/walk_w4h/producer.py --source-blend w4h-w14-source/original_two_weighted_3d_characters.blend --out w4h-av
          test -s w4h-av/original_3d_camera_foley_master.mkv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-w4h-blender-source-av
          path: |
            w4h-av/
            w4h-w14-source/native_3d_skin_receipt.json
          retention-days: 3
          if-no-files-found: warn
  independent-native-decoder:
    needs: native-blender-3d
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require native producer success
        env:
          NATIVE_RESULT: ${{ needs.native-blender-3d.result }}
        run: test "$NATIVE_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          name: spatial-w4h-blender-source-av
          path: source-data
      - name: Separate actual lossless 72-frame camera video + PCM event sample oracle
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg
          command -v ffprobe
          mkdir -p result
          python3 qualification/walk_w4h/observer.py source-data/w4h-av result/w4h_3d_av_independent.json
          sha256sum result/w4h_3d_av_independent.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spatial-w4h-3d-independent-numeric
          path: result/
          retention-days: 3
          if-no-files-found: warn
