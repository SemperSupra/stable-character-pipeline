name: Release gate source-safe qualification
on:
  pull_request:
    paths:
      - 'releasegate/**'
      - '.github/workflows/releasegate.yml'
permissions:
  contents: read
concurrency:
  group: releasegate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: releasegate/go.mod
          cache: false
      - name: Unit, vet and standalone public-synthetic CLI
        shell: bash
        run: |
          set -euo pipefail
          cd releasegate
          go test -count=1 ./...
          go vet ./...
          go build ./cmd/releasegate
          ./releasegate sample.synthetic.json
