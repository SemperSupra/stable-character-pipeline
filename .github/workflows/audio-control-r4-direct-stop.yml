name: Audio Control R4 independent synthetic direct STOP gate
on:
  pull_request:
    paths:
      - 'audio-control/control/directstop/**'
      - '.github/workflows/audio-control-r4-direct-stop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-stop-with-blocked-persistence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Race-enabled direct STOP vs blocked datastore and delayed START
        working-directory: audio-control/control
        run: go test -race -count=1 -v ./directstop
      - name: Static analysis
        working-directory: audio-control/control
        run: go vet ./directstop
