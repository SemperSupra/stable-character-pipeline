name: R036 Real HuBMAP Anatomy Under MPFB Morph
on:
  push:
    branches:
      - research/r036-hra-morph-coupling-20261116
    paths:
      - 'research/anatomy-hra-morph/**'
      - '.github/workflows/anatomy-r036-hra-morph.yml'
  pull_request:
    paths:
      - 'research/anatomy-hra-morph/**'
      - '.github/workflows/anatomy-r036-hra-morph.yml'
permissions:
  contents: read
concurrency:
  group: r036-hra-morph-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-source-donor-refit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Disposable CPU native prerequisites
        run: |
          set -euo pipefail
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y -qq install blender python3-numpy
          blender --version | head -2
      - name: Source-pin official MPFB2 and install native Blender extension
        env:
          SOURCE: 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" init -q
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" fetch -q --depth 1 origin "$SOURCE"
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = "$SOURCE"
          test "$(git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj)" = 'd26635e9326e3cca30778fd7b9c00062b03cce09'
          blender --command extension build --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" --output-filepath "$RUNNER_TEMP/mpfb-pinned.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned.zip"
      - name: Pin exact rights-admitted real HuBMAP lung v1.2 source bytes
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --connect-timeout 10 --max-time 100 --max-filesize 20000000 \
            https://cdn.humanatlas.io/hra-releases/v1.2/models/VH_M_Lung.glb -o "$RUNNER_TEMP/HRA-v1.2-VH_M_Lung.glb"
          echo "e64351b72b0bc5289a4dc32ba2b402b9c974f9ec0b1972bf06b436864f917913  $RUNNER_TEMP/HRA-v1.2-VH_M_Lung.glb" | sha256sum --check --status
      - name: Generate native MakeHuman character and real source organ integration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r036"
          blender -b -t 2 --python-exit-code 12 --python research/anatomy-native-mpfb/official_mpfb_native.py -- --stage build --source "$RUNNER_TEMP/mpfb2" --out "$RUNNER_TEMP/r036"
          blender -b "$RUNNER_TEMP/r036/mpfb-official-anatomy.blend" -t 2 --python-exit-code 12 --python research/anatomy-hra/hra_lung_bind.py -- --stage build --organ "$RUNNER_TEMP/HRA-v1.2-VH_M_Lung.glb" --out "$RUNNER_TEMP/r036"
      - name: Composite official MPFB morph with real HRA organ geometry
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036/mpfb-with-hra-lung-provisional.blend" -t 2 --python-exit-code 12 --python research/anatomy-hra-morph/real_lung_refit.py -- --stage probe --out "$RUNNER_TEMP/r036"
      - name: Independently reopen exact real-organ macro-refitted native scene
        run: |
          set -euo pipefail
          blender -b "$RUNNER_TEMP/r036/mpfb-hra-lung-morphed.blend" -t 2 --python-exit-code 12 --python research/anatomy-hra-morph/real_lung_refit.py -- --stage verify --out "$RUNNER_TEMP/r036"
          echo "No source organ bytes or generated scene/media uploaded as public CI artifacts"
