name: ROM W4C - Native MuJoCo Joint Limit Qualification
on:
  pull_request:
    paths:
      - 'qualification/rom_fmt_schema/**'
      - '.github/workflows/rom-w4c-mujoco.yml'
permissions:
  contents: read
jobs:
  native-mujoco:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audited open-source native MuJoCo wheel and run source-typed constraints
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'mujoco==3.14.0'
          python -m unittest discover -s qualification/rom_fmt_schema -p 'test_export_projection.py' -v
          python qualification/rom_fmt_schema/native_mujoco.py --out rom-w4c-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rom-w4c-native-original-mujoco
          path: rom-w4c-native/
          retention-days: 3
          if-no-files-found: warn
