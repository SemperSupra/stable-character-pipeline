name: R14 independent source and SBOM identity fail closed
on:
  pull_request:
    paths:
      - 'qualification/sbom_inventory/**'
      - '.github/workflows/r14-supply-identity.yml'
permissions:
  contents: read
jobs:
  source-image-component-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Run source-safe observed identity and release-HOLD tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 -m unittest discover -s qualification/sbom_inventory -p 'test_*.py' -v
