name: W16-E rational AV clock
on:
  pull_request:
    paths:
      - 'qualification/walk_w16e/**'
      - '.github/workflows/walk-w16e-rational.yml'
permissions:
  contents: read
jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        profile: [forward, outward]
    env:
      GO111MODULE: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Source-only numerical checks
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          cd qualification/walk_w16e
          go vet ./...
          go test -race -count=1 ./...
          go run . "$PROFILE" "clock-$PROFILE.json"
          python3 independent_fraction.py "clock-$PROFILE.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w16e-rational-${{ matrix.profile }}
          path: qualification/walk_w16e/clock-*.json
          retention-days: 3
          if-no-files-found: warn
