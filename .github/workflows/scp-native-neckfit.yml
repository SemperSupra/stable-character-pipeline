name: SCP source-original native multiview neck parameter fit
on:
  pull_request:
    paths:
      - 'qualification/agent_native_neckfit/**'
      - '.github/workflows/scp-native-neckfit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native_blender_candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/blender/runner-images/bpy:1.0.0
    steps:
      - name: Checkout source-neutral measurement and candidate code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Checkout exact public-original 26-bone pony producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 1f2febbd28d508d1c3d9f2a644f861d634f65a9d
          path: pinned_pony_producer
      - name: Disposable official native Blender 4.5.15 verified against SHA
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl xz-utils python3 libegl1 libgl1 libgl1-mesa-dri libgbm1
          mkdir -p /tmp/blender
          curl --fail --location --retry 3 --silent --show-error https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o /tmp/blender/blender.sha256
          curl --fail --location --retry 3 --silent --show-error https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o /tmp/blender/blender-4.5.15-linux-x64.tar.xz
          (cd /tmp/blender; grep 'blender-4.5.15-linux-x64.tar.xz' blender.sha256 | sha256sum -c -)
          tar -xJf /tmp/blender/blender-4.5.15-linux-x64.tar.xz -C /tmp/blender
      - name: Reproduce frozen source-original pony
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/source_out" "$GITHUB_WORKSPACE/native_fit"
          python3 -m py_compile qualification/agent_native_neckfit/pony_fit_blender.py
          env LIBGL_ALWAYS_SOFTWARE=1 /tmp/blender/blender-4.5.15-linux-x64/blender --background --factory-startup --python-exit-code 8 --python pinned_pony_producer/qualification/shetland_pony/build_blender.py -- "$GITHUB_WORKSPACE/source_out"
          python3 pinned_pony_producer/qualification/shetland_pony/validate_outputs.py "$GITHUB_WORKSPACE/source_out"
      - name: Generate genuine 2 camera x 2 frame x 3 candidate mask witnesses
        shell: bash
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE/source_out/shetland_black_ghcr.blend" "$GITHUB_WORKSPACE/native_fit/source_pony.blend"
          env LIBGL_ALWAYS_SOFTWARE=1 /tmp/blender/blender-4.5.15-linux-x64/blender --background --factory-startup --python-exit-code 8 --python qualification/agent_native_neckfit/pony_fit_blender.py -- "$GITHUB_WORKSPACE/native_fit/source_pony.blend" "$GITHUB_WORKSPACE/native_fit"
          test "$(find native_fit -maxdepth 1 -name 'manifest_*.json' | wc -l)" -eq 12
      - name: Preserve all first-run artifacts for independent evaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scp-native-multiview-public-original
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6
          path: |
            native_fit/*.json
            native_fit/*.png
            native_fit/*.blend
  independent_go_measurement:
    needs: native_blender_candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: scp-native-multiview-public-original
          path: native_fit
      - name: Unit and hostile tests for independent multi-camera receipt reviewer
        run: |
          python3 -m unittest discover -s qualification/agent_native_neckfit -p 'test_*.py' -v
          (cd qualification/agent_render_metrics && go test -race -count=1 ./... && go vet ./...)
      - name: Verify actual native blender/image bytes and score 12 masks in Go
        shell: bash
        run: |
          set -euo pipefail
          (cd qualification/agent_render_metrics && go build -o "$RUNNER_TEMP/scp_image_metric" .)
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path("native_fit").resolve()
          source=json.loads((root/"source_receipt.json").read_text())
          assert source["source_blend_sha256"]==hashlib.sha256((root/"source_pony.blend").read_bytes()).hexdigest()
          manifests=sorted(root.glob("manifest_*.json"))
          assert len(manifests)==12,len(manifests)
          exe=pathlib.Path("/home/runner") # replaced by runner temp environment below
          import os
          binary=pathlib.Path(os.environ["RUNNER_TEMP"])/"scp_image_metric"
          for p in manifests:
            d=json.loads(p.read_text())
            for stage,key in (("baseline","baseline_sha256"),("candidate","candidate_sha256")):
              fn=p.name.replace("manifest_",stage+"_") # cannot trust name alone; use source receipt instead
            # Require actual independent bytes for both scene-state hashes.
            camera,frame,candidate=p.stem.removeprefix("manifest_").split("_")
            for fn,key in ((f"{camera}_{frame}_baseline.blend","baseline_sha256"),
                           (f"{camera}_{frame}_{candidate}.blend","candidate_sha256")):
              assert hashlib.sha256((root/fn).read_bytes()).hexdigest()==d[key],(fn,key)
            result=subprocess.run([str(binary),"measure",str(root),str(p)],capture_output=True,text=True,check=True)
            (root/p.name.replace("manifest_","measurement_")).write_text(result.stdout)
          PY
          python3 qualification/agent_native_neckfit/verify_fit.py native_fit > native_fit/summary.json
          python3 - <<'PY'
          import json
          r=json.load(open("native_fit/summary.json"))
          print(json.dumps({"disposition":r["disposition"],"mean_iou":r["mean_iou_by_candidate"],"gain":r["measured_gain"],"science":r["physical_anatomy"]},sort_keys=True))
          assert r["external_photo_fit"]=="NOT_RUN"
          PY
      - name: Store independent result separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scp-native-multiview-independent-measurements
          retention-days: 7
          if-no-files-found: warn
          path: |
            native_fit/measurement_*.json
            native_fit/summary.json
