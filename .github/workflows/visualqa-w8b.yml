name: VisualQA W8-B exact W7A CLEAN optical motion
on:
  pull_request:
    paths:
      - 'qualification/visualqa_w8b/**'
      - '.github/workflows/visualqa-w8b.yml'
permissions:
  contents: read
  actions: read
jobs:
  original-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        profile: [forward, outward]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned CPU optical observation
        run: |
          python -m pip install --no-cache-dir 'numpy==1.26.4' 'opencv-python-headless==4.10.0.84'
          python -m unittest discover -s qualification/visualqa_w8b -p 'test_*.py' -v
      - name: Rehydrate identical ORIGINAL public source video and inspect CLEAN pixels only
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          gh run download 41172356301 --repo "$GITHUB_REPOSITORY" --name "walk-w7a-original-approach-$PROFILE" --dir "original-$PROFILE"
          test -s "original-$PROFILE/rendered/OriginalFront.mp4"
          test -s "original-$PROFILE/rendered/OriginalOblique.mp4"
          python qualification/visualqa_w8b/motion.py --artifact "original-$PROFILE" --profile "$PROFILE" --out "w8b-$PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualqa-w8b-numeric-${{ matrix.profile }}
          path: w8b-${{ matrix.profile }}/
          retention-days: 3
          if-no-files-found: warn
