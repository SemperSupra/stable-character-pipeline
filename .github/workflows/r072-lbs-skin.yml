name: R072 real Blender two-bone LBS evaluated skin versus independent NumPy + Cycles

on:
  push:
    branches: [research/r072-real-armature-lbs-public-20261117]
    paths:
      - 'skinprobe/**'
      - '.github/workflows/r072-lbs-skin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r072-public-actual-armature-synthetic
  cancel-in-progress: true

jobs:
  boned-actual-skin-and-pixels:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Disposable original-only Blender CPU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender
          blender --version | head -3
      - name: Actually evaluate source-original weighted mesh with Blender Armature in 3 poses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          blender -b -t 2 --python skinprobe/scene.py -- --out out
          test -s out/r072_source.json
          for frame in 00 01 02; do
            test -s "out/frame_$frame/beauty.png"
            test -s "out/frame_$frame/render_passes.exr"
          done
      - name: Independent official EXR Z/ID and independent arithmetic LBS verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r072-exr"
          "$RUNNER_TEMP/r072-exr/bin/pip" install --disable-pip-version-check \
            --only-binary=:all: --no-cache-dir numpy==1.26.4 OpenEXR==3.3.3
          "$RUNNER_TEMP/r072-exr/bin/python" -m unittest discover \
            -s skinprobe -p test_audit.py -v
          "$RUNNER_TEMP/r072-exr/bin/python" skinprobe/audit.py \
            --root out --out out/r072_report.json
          grep -F '"status": "PASS_NARROW_ACTUAL_BLENDER_ARMATURE_LBS_EXR"' out/r072_report.json
          (cd out && find . -type f ! -name artifact_manifest.sha256 -print0 | sort -z | xargs -0 sha256sum > artifact_manifest.sha256)
          (cd out && sha256sum -c artifact_manifest.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r072-original-synthetic-real-armature-LBS-HOLD
          path: out/
          retention-days: 3
          if-no-files-found: warn
