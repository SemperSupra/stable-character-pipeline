name: SCP public synthetic observation capture-family admission
on:
  pull_request:
    paths:
      - 'qualification/agent_observation_admission/**'
      - '.github/workflows/scp-agent-observation-admission.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
          cache: false
      - name: Source-byte PNG and capture-family leakage tests
        working-directory: qualification/agent_observation_admission
        run: |
          go test -race -count=1 -v ./...
          go vet ./...
          go run . capabilities
