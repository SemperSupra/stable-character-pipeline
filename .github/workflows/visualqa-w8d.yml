name: VisualQA W8-D hidden-grid camera probe and native AOV ROI
on:
  pull_request:
    paths:
      - 'qualification/visualqa_w8d/**'
      - '.github/workflows/visualqa-w8d.yml'
permissions:
  contents: read
  actions: read
jobs:
  independent-calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [forward, outward]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original stdlib camera/clock hostile controls
        run: python -m unittest discover -s qualification/visualqa_w8d -p 'test_*.py' -v
      - name: Rehydrate exact W7A original source and camera receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          gh run download 41172356301 --repo "$GITHUB_REPOSITORY" --name "walk-w7a-original-approach-$PROFILE" --dir "original-$PROFILE"
          python qualification/visualqa_w8d/calibration.py --artifact "original-$PROFILE" --out "w8d-$PROFILE"
      - name: Optional bounded native Blender CPU Workbench and Cycles AOV ROI
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri xvfb
          python -m pip install --no-cache-dir 'bpy==4.5.0'
          xvfb-run -a python qualification/visualqa_w8d/native_roi.py --artifact "original-$PROFILE" --out "w8d-$PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visualqa-w8d-ephemeral-roi-${{ matrix.profile }}
          path: w8d-${{ matrix.profile }}/
          retention-days: 1
          if-no-files-found: warn
