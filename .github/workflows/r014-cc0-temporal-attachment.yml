name: R014 Source-Native CC0 Barycentric Transfer — Temporal Head/Rig and Accessory Fidelity
on:
  push:
    branches: [research/r014-cc0-transfer-temporal-fit-oracle-20261113]
    paths:
      - 'r014/cc0_transfer_temporal_headturn.py'
      - '.github/workflows/r014-cc0-temporal-attachment.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r014-source-corrected-head-attachment-temporal
  cancel-in-progress: true
jobs:
  actual-head-and-accessory-motion:
    name: Independent actual 163-bone rigged CC0 corrected source / ${{ matrix.sex }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        sex: [female,male]
    env:
      BLENDER_USER_CONFIG: /tmp/r014-head-turn/config
      BLENDER_USER_SCRIPTS: /tmp/r014-head-turn/scripts
    steps:
      - name: Read-only source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python compile
        run: |
          set -euo pipefail
          python3 -m compileall -q r014/cc0_transfer_temporal_headturn.py
      - name: Source-pinned corrected native adult Blender scenes and immutable SHA checks
        env:
          GH_TOKEN: ${{ github.token }}
          SEX: ${{ matrix.sex }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-head/out" "$RUNNER_TEMP/r014-head/source"
          gh run download 43365071496 --repo "$GITHUB_REPOSITORY" \
            --name "r014-cc0-experimental-barycentric-$SEX" \
            --dir "$RUNNER_TEMP/r014-head/source"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"r014-head/source"
          sex=os.environ["SEX"]
          receipt=json.loads((root/"candidate_transfer_receipt.json").read_text())
          assert receipt["status"]=="PASS_EXPERIMENTAL_NATIVE_MESH_TRANSFER_AND_REVIEW_FILES_ONLY"
          assert receipt["sex_macro"]==sex
          assert receipt["source_mpfb"]=="6ff1eb358f6c1959ced77e79e6dd2406d9a71f49"
          src=root/receipt["native_blend"]["name"]
          h=hashlib.sha256()
          with src.open("rb") as f:
              for b in iter(lambda:f.read(1<<20),b""):h.update(b)
          assert h.hexdigest()==receipt["native_blend"]["sha256"]
          assert src.stat().st_size==receipt["native_blend"]["bytes"]
          assert receipt["transferred_accessory_meshes"]>=6
          print("PASS_NATIVE_ORIGINAL_TO_CORRECTIVE_SOURCE_CHAIN",sex,h.hexdigest())
          PY
      - name: Acquire official checksum-verified source Blender 4.5.16 only in ephemeral runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-head"
          cd "$RUNNER_TEMP/r014-head"
          base=https://download.blender.org/release/Blender4.5
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 20 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl --fail --location --retry 8 --retry-all-errors --retry-delay 5 --connect-timeout 20 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          expected="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#expected}" -eq 64
          printf '%s  blender-4.5.16-linux-x64.tar.xz\n' "$expected" | sha256sum -c -
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          b="$(find "$RUNNER_TEMP/r014-head" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$b"
          echo "BLENDER_BIN=$b" >> "$GITHUB_ENV"
      - name: Admit exact codec metadata verifier
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffprobe -version | head -n 1
      - name: Evaluate real head/skin/accessory deformation and generate native animated model and film
        env:
          SEX: ${{ matrix.sex }}
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014-head/source/R014_${SEX}_experimental_accessory_transfer.blend" \
             --python-exit-code 4 --python r014/cc0_transfer_temporal_headturn.py -- \
             --sex "$SEX" \
             --source "$RUNNER_TEMP/r014-head/source/R014_${SEX}_experimental_accessory_transfer.blend" \
             --receipt "$RUNNER_TEMP/r014-head/source/candidate_transfer_receipt.json" \
             --out "$RUNNER_TEMP/r014-head/out"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          sex=os.environ["SEX"]
          src=Path(os.environ["RUNNER_TEMP"])/"r014-head/out/temporal_fit_receipt.json"
          receipt=json.loads(src.read_text())
          assert receipt["sex_macro"]==sex
          assert receipt["status"]=="PASS_BOUNDED_REAL_SOURCE_NATIVE_TEMPORAL_EVIDENCE_CAPTURE_ONLY"
          assert receipt["source_actual_accessories"]>=6
          assert receipt["movie"]["ffprobe"]["streams"][0]["codec_name"]=="h264"
          assert receipt["glb"]["skins"]>=1 and receipt["glb"]["animations"]>=1
          assert receipt["head_turn_fit_status"].startswith(("HOLD","FAIL_OR_UNQUALIFIED"))
          print("PASS_SOURCE_NATIVE_TEMPORAL_EVIDENCE_WITH_ACCEPTANCE_HOLD",sex,receipt["head_turn_fit_status"])
          PY
      - name: Produce SHA256 inventory of actual reusable source and motion artifacts
        if: always()
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/r014-head/out"
          if test -d "$folder"; then
            (cd "$folder" && find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 -r sha256sum > artifact_sha256.txt)
          fi
      - name: Retain real native editable scene, GLB, H264, PNG and temporal oracle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r014-real-cc0-source-headturn-${{ matrix.sex }}
          path: ${{ runner.temp }}/r014-head/out/*
          if-no-files-found: warn
          retention-days: 7
