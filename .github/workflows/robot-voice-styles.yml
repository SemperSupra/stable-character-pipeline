name: Public robot/computer voice style matrix
on:
  pull_request:
    paths:
      - 'voice-foundry/robot/**'
      - '.github/workflows/robot-voice-styles.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synth-robot-voice-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: voice-foundry/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU engines only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --no-cache-dir --disable-pip-version-check 'kokoro-onnx==0.6.1' 'soundfile==0.13.1'
      - name: Go static, race and DSP synthetic tests
        working-directory: voice-foundry
        run: |
          go test -race -count=1 ./...
          go vet ./...
      - name: Pin and check source neural voice model
        run: |
          set -euo pipefail
          models="$RUNNER_TEMP/kokoro-models"
          mkdir -p "$models"
          base='https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1'
          curl --fail --location --retry 3 --max-time 240 -sS "$base/kokoro-v1.0.int8.onnx" --output "$models/kokoro-v1.0.int8.onnx"
          curl --fail --location --retry 3 --max-time 240 -sS "$base/voices-v1.0.bin" --output "$models/voices-v1.0.bin"
          printf '%s  %s\n' \
            'ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c' "$models/kokoro-v1.0.int8.onnx" \
            'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d' "$models/voices-v1.0.bin" | sha256sum --check
      - name: Produce disposable synthetic source voices and 9 robot styles
        run: |
          set -euo pipefail
          python voice-foundry/providers/kokoro-onnx/synth.py --models "$RUNNER_TEMP/kokoro-models" --out "$RUNNER_TEMP/kokoro-source"
          mkdir -p "$RUNNER_TEMP/robot-source"
          cp "$RUNNER_TEMP/kokoro-source/human_kokoro.wav" "$RUNNER_TEMP/robot-source/feminine.wav"
          cp "$RUNNER_TEMP/kokoro-source/computer_kokoro.wav" "$RUNNER_TEMP/robot-source/masculine.wav"
          espeak-ng -v en-us -s 155 -p 50 -w "$RUNNER_TEMP/unspecified-raw.wav" \
            'Atmospheric conditions are stable. Awaiting instructions.'
          ffmpeg -hide_banner -loglevel error -nostdin -n -i "$RUNNER_TEMP/unspecified-raw.wav" \
            -ar 24000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/robot-source/unspecified.wav"
          cd voice-foundry
          go run ./robot/cmd/robotvoice -sources "$RUNNER_TEMP/robot-source" -out "$RUNNER_TEMP/robot-public-output" \
            -provider 'kokoro-onnx-0.6.1+espeak-ng' -classification PUBLIC_SYNTHETIC_CANDIDATE_NOT_FINAL
          python3 - "$RUNNER_TEMP/robot-public-output/receipt.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["classification"]=="PUBLIC_SYNTHETIC_CANDIDATE_NOT_FINAL"
          assert len(r["clips"])==9
          assert {x["presentation"] for x in r["clips"]}=={"masculine","feminine","unspecified"}
          assert {x["style"] for x in r["clips"]}=={"computer","classic-robot","social-robot"}
          assert all(-53<x["mean_dbfs"]<0 and -45<x["peak_dbfs"]<-0.2 for x in r["clips"])
          print("robot_matrix_RECEIPT_PASS", len(r["clips"]))
          PY
      - name: Export only generic nonidentity M4A QA samples
        uses: actions/upload-artifact@v4
        with:
          name: public-robot-voice-nine-style-candidates
          path: |
            ${{ runner.temp }}/robot-public-output/*.m4a
            ${{ runner.temp }}/robot-public-output/receipt.json
          retention-days: 7
          if-no-files-found: error
      - name: Clean model weights and ephemeral source recordings
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/kokoro-models" "$RUNNER_TEMP/kokoro-source" \
            "$RUNNER_TEMP/robot-source" "$RUNNER_TEMP/robot-public-output" "$RUNNER_TEMP/unspecified-raw.wav"
