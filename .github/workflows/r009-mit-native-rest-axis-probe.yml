name: R009 MIT native weighted-foot skin rest-axis diagnostic
on:
  pull_request:
    paths:
      - 'qualification/rocketbox_axes_probe/**'
      - '.github/workflows/r009-mit-native-rest-axis-probe.yml'
permissions:
  contents: read
  actions: read
jobs:
  native-original-mit-source-axes:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent source receipt hostility tests
        run: |
          set -euo pipefail
          cd qualification/rocketbox_axes_probe
          python3 -m unittest -v test_probe
      - name: Rehydrate immutable actual MIT 80-bone native source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mit-axis-src"
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/SemperSupra/stable-character-pipeline/actions/artifacts/13305643308/zip \
            -o "$RUNNER_TEMP/mit-axis-source.zip"
          echo '2bbf1036744e4fcd614cd207bc9e9eb2147b943f59c53d9de7dff1b324320204  '"$RUNNER_TEMP/mit-axis-source.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/mit-axis-source.zip"
          unzip -q "$RUNNER_TEMP/mit-axis-source.zip" -d "$RUNNER_TEMP/mit-axis-src"
          echo '2e5c5fcc826c95d200b06cc2dcd22138944102426a86f1f683689ae458aff7ab  '"$RUNNER_TEMP/mit-axis-src/motion/mit_rocketbox_walk_candidate.blend" | sha256sum -c -
      - name: Install SHA-verified official Blender 4.5.15 CPU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libegl1 libgl1 libgl1-mesa-dri libgbm1
          curl -fLsS --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o "$RUNNER_TEMP/blender.sha256"
          curl -fLsS --retry 2 https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP"; grep 'blender-4.5.15-linux-x64.tar.xz' blender.sha256 | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender-4.5.15-linux-x64.tar.xz" -C "$RUNNER_TEMP"
      - name: Actual native source-rest and skin-weighted 24-axis experiment
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xvfb-run -a -s '-screen 0 1280x720x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            "$RUNNER_TEMP/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 \
            --python qualification/rocketbox_axes_probe/probe_axes.py \
            -- "$RUNNER_TEMP/mit-axis-src/motion/mit_rocketbox_walk_candidate.blend" artifacts
          cd qualification/rocketbox_axes_probe
          python3 verify_probe.py --receipt ../../artifacts/native_rest_axis_skin_diagnostic.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r009-original-mit-native-rest-axis-24rows
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
