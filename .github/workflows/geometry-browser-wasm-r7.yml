name: R7 Actual Chromium WASM Geometry (public disposable)
run-name: R7 real browser SDF ${{ github.ref_name }}
on:
  push:
    branches: [research/geometry-browser-wasm-r7-20261112]
    paths:
      - 'qualification/geometry-donors/r7-browser/**'
      - '.github/workflows/geometry-browser-wasm-r7.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geometry-browser-r7-${{ github.ref }}
  cancel-in-progress: false
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.0'
          cache: false
      - name: Build and actually execute source-pinned WASM under real Chromium
        shell: bash
        run: |
          set -o pipefail
          bash qualification/geometry-donors/r7-browser/run.sh 2>&1 | tee qualification/geometry-donors/r7-browser/run.log
      - name: Preserve Chromium browser oracle and first failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: geometry-browser-r7-${{ github.run_attempt }}
          path: |
            qualification/geometry-donors/r7-browser/results/
            qualification/geometry-donors/r7-browser/run.log
          if-no-files-found: warn
          retention-days: 7
