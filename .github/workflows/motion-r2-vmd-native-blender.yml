name: Motion R2 real Blender VMD Bezier subframe and skin CPU
on:
  pull_request:
    paths:
      - 'research/motion-mmd-curve-r2/native_blender.py'
      - '.github/workflows/motion-r2-vmd-native-blender.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently-import-native-vmd:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [nonlinear, linear]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: ''
      - name: Install official Blender bpy CPU and MMD Tools translation prerequisite
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0' 'opencc-python-reimplemented==0.1.7'
          python -c 'import bpy; assert bpy.app.version >= (4,5,0); print(bpy.app.version_string)'
      - name: Evaluate actual MMD Tools Blender armature F-curves at subframes and skin
        shell: bash
        timeout-minutes: 4
        env:
          OMP_NUM_THREADS: '2'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python research/motion-mmd-curve-r2/native_blender.py --upstream vendor/mmd-tools --lane '${{ matrix.lane }}'
