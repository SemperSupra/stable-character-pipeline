name: R009 public-safe browser venue qualification

on:
  push:
    branches:
      - rdte/r009-public-playwright-venue-smoke-20261111
  pull_request:
    paths:
      - qualification/r009/public_browser_venue_smoke.py
      - .github/workflows/r009-public-browser-venue.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r009-public-browser-venue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-browser-smoke:
    name: Synthetic Playwright / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Playwright and Chromium in disposable runner
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Public synthetic browser checks (never private QA)
        run: python qualification/r009/public_browser_venue_smoke.py
      - name: Upload synthetic-only witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r009-public-synthetic-browser-venue
          path: synthetic-browser-evidence/
          if-no-files-found: warn
          retention-days: 3
