      - "qualification/parametric_humans/weight_transfer_regularize_v1.py"
      - "qualification/parametric_humans/test_weight_transfer_sourcefree_v1.py"
      - "qualification/parametric_humans/test_weight_transfer_regularize_v1.py"
      - "qualification/parametric_humans/build_regularization_evidence_v1.py"
      - "qualification/parametric_humans/WEIGHT_REGULARIZATION_V1.md"
