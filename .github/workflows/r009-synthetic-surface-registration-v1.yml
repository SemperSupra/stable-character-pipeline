name: R009 synthetic surface registration contract

on:
  pull_request:
    paths:
      - "qualification/parametric_humans/surface_registration_v1.py"
      - "qualification/parametric_humans/test_surface_registration_v1.py"
      - "qualification/parametric_humans/test_surface_registration_quality.py"
      - "qualification/parametric_humans/test_surface_registration_metamorphic.py"
      - "qualification/parametric_humans/disposable_parent_integration_trial.py"
      - ".github/workflows/r009-synthetic-surface-registration-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate synthetic-only geometric contract
        env:
          SCP_VALIDATOR_PERF_OUT: ${{ runner.temp }}/r009-surface-validator-performance.json
          SCP_SURFACE_METAMORPHIC_OUT: ${{ runner.temp }}/r009-surface-metamorphic.json
        run: |
          set -euo pipefail
          cd qualification/parametric_humans
          python3 -m compileall -q surface_registration_v1.py test_surface_registration_v1.py
          python3 -m unittest -v test_surface_registration_v1 test_surface_registration_quality test_surface_registration_metamorphic
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["SCP_VALIDATOR_PERF_OUT"])
          r=json.loads(p.read_text())
          assert r["schema"]=="scp.validator.performance.v1"
          assert r["case_count"]==13
          assert r["rejection_detection"]=={"detected":8,"total":8}
          assert r["confusion"]["ABSTAIN"]["ABSTAIN"]==3
          assert r["false_acceptance_count"]==r["false_rejection_count"]==0
          assert r["contract_mismatch_count"]==0
          assert r["verdict"]=="PASS_SYNTHETIC_VALIDATOR_CONTROLS_ONLY"
          print("SURFACE_VALIDATOR_QUALITY",r["validator_sha256"],r["runtime"])
          m=json.loads(pathlib.Path(os.environ["SCP_SURFACE_METAMORPHIC_OUT"]).read_text())
          assert m["schema"]=="scp.validator.metamorphic.v1"
          assert m["grid_vertices"]==1089 and m["grid_triangles"]==2048
          assert len(m["metamorphic_checks"])==4 and all(m["metamorphic_checks"].values())
          assert m["validator_sha256"]==r["validator_sha256"]
          assert m["external_photo_fit"]=="NOT_RUN"
          assert m["anatomical_fidelity"]=="UNKNOWN" and not m["merge_release_CPE_approval"]
          print("SURFACE_METAMORPHIC_FRAME_SCALE_INDEX_PASS",m["grid_latency_ns"])
          PY
      - name: Disposable exact-source parent BVH-v2 and child surface integration trial
        if: github.event_name == 'pull_request'
        env:
          PARENT_HEAD_PIN: bca50fe99ba7d84e1153cda5fbdb173d7631ce4a
          OLD_PARENT_PIN: 135d80dbec8ad0b3df15d85b426783e6d8d68d11
          CHILD_HEAD: ${{ github.event.pull_request.head.sha }}
          INTEGRATION_RECEIPT: ${{ runner.temp }}/r009-surface-parent-disposable-trial.json
        run: |
          set -euo pipefail
          python3 -m py_compile qualification/parametric_humans/disposable_parent_integration_trial.py
          python3 qualification/parametric_humans/disposable_parent_integration_trial.py
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["INTEGRATION_RECEIPT"])
          receipt=json.loads(p.read_text())
          assert receipt["schema"]=="scp.disposable_source_integration.v1"
          assert receipt["parent_pr"]==308 and receipt["child_pr"]==336
          assert receipt["combined_python_synthetic_tests"]=="PASS"
          assert receipt["parent_bvh_schema"]=="scp.r009.original_bvh_surface_contact.v2"
          assert receipt["child_source_scope_added"] and not receipt["unresolved_conflicts"]
          assert not receipt["joint_native_blender_render_evaluated"]
          assert receipt["scientific_anatomy"]=="UNKNOWN" and receipt["real_photo_fit"]=="NOT_RUN"
          assert receipt["no_remote_branch_merge_or_push"]
          assert not receipt["human_visual_acceptance"] and not receipt["merge_release_CPE_approval"]
          print("DISPOSABLE_SOURCE_SYNTHETIC_ONLY_NO_PARENT_MUTATION")
          PY
      - name: Preserve source-bounded synthetic validator performance receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r009-synthetic-surface-validator-performance
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/r009-surface-validator-performance.json
            ${{ runner.temp }}/r009-surface-metamorphic.json
            ${{ runner.temp }}/r009-surface-parent-disposable-trial.json
