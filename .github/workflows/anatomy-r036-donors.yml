name: R036 Donor Source Text Preflight
on:
  push:
    branches:
      - research/anatomy-r036-donor-metadata-20261116
    paths:
      - 'research/anatomy-donors/**'
      - '.github/workflows/anatomy-r036-donors.yml'
  pull_request:
    paths:
      - 'research/anatomy-donors/**'
      - '.github/workflows/anatomy-r036-donors.yml'
permissions:
  contents: read
concurrency:
  group: anatomy-donors-${{ github.ref }}
  cancel-in-progress: true
jobs:
  donor-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: research/anatomy-donors
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline unit tests and vet
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go version
          git rev-parse HEAD
          go test -count=1 ./...
          go vet ./...
      - name: Public source-only DOI/rights preflight
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GIT_TERMINAL_PROMPT: '0'
        run: go run ./cmd/preflight
