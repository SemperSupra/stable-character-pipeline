name: R014 failed high-resolution sculpt registration regional failure atlas
on:
  push:
    branches: [research/r014-regional-registration-error-atlas-v1]
    paths: [r014/registration/**, .github/workflows/r014-regional-registration-atlas.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r014-registration-atlas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_held_models:
    strategy:
      fail-fast: false
      matrix:
        sex: [female, male]
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Source syntax before any binary downloads
        run: python3 -m compileall -q r014/registration
      - name: Retrieve exact old public failure evidence, not protected people
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-reg/input" "$RUNNER_TEMP/r014-reg/output"
          gh run download 43218606862 --repo "$GITHUB_REPOSITORY" \
            --name "r014-sculpt-rig-transfer-${{ matrix.sex }}-research" \
            --dir "$RUNNER_TEMP/r014-reg/input"
          test -s "$RUNNER_TEMP/r014-reg/input/R014_${{ matrix.sex }}_sculpt_weight_transfer_research.blend"
          test -s "$RUNNER_TEMP/r014-reg/input/rig_transfer_receipt.json"
      - name: Pin disposable official Blender 4.5.16 binary SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r014-reg"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          sha="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#sha}" -eq 64
          printf '%s  %s\n' "$sha" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014-reg" -maxdepth 2 -type f -name blender | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Run registration-region proxy negative controls
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 3 \
            --python-expr "import unittest,sys;sys.path.insert(0,'r014/registration');import registration_math;unittest.main(module=registration_math,argv=['r014'],verbosity=2)"
      - name: Independent true-body mesh proximity and front/back heatmap rendering
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background \
            "$RUNNER_TEMP/r014-reg/input/R014_${{ matrix.sex }}_sculpt_weight_transfer_research.blend" \
            --python-exit-code 3 --python r014/registration/registration_region_atlas.py -- \
            --sex "${{ matrix.sex }}" \
            --source "$RUNNER_TEMP/r014-reg/input/R014_${{ matrix.sex }}_sculpt_weight_transfer_research.blend" \
            --baseline "$RUNNER_TEMP/r014-reg/input/rig_transfer_receipt.json" \
            --out "$RUNNER_TEMP/r014-reg/output"
          test -s "$RUNNER_TEMP/r014-reg/output/registration_region_receipt.json"
          test -s "$RUNNER_TEMP/r014-reg/output/per_vertex_registration.csv"
          test -s "$RUNNER_TEMP/r014-reg/output/error_atlas_front.png"
          test -s "$RUNNER_TEMP/r014-reg/output/error_atlas_back.png"
          test -s "$RUNNER_TEMP/r014-reg/output/R014_${{ matrix.sex }}_source_vs_sculpt_registration_error_research.blend"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'r014-reg/output/registration_region_receipt.json').read_text())
          assert q["status"]=="HOLD_ANATOMICAL_REGISTRATION_ERROR_LOCALIZED"
          assert q["global_registration"]["p95_m"]>.05
          assert q["source_mesh_vertices"]==13380 and q["target_sculpt_base_vertices"]==10582
          assert len(q["ranked_corrective_regions"])>=4
          print("REGIONAL_RESEARCH_EVIDENCE_PASS; HIGHRES_RIG_TRANSFER_HOLD")
          PY
          cd "$RUNNER_TEMP/r014-reg/output"
          sha256sum *.json *.png *.csv *.blend > sha256sum.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-registration-regional-failure-${{ matrix.sex }}
          path: ${{ runner.temp }}/r014-reg/output/*
          retention-days: 7
