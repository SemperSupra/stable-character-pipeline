name: R071 blind multilingual source-only small model polarity interview
on:
  push:
    branches: [research/r071-blind-intent-20261117]
    paths:
      - 'research/r071-blind-intent/**'
      - '.github/workflows/r071-blind-intent.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r071-${{ github.ref }}
  cancel-in-progress: true
jobs:
  blind-interview:
    name: R071 / ${{ matrix.suite }} / ${{ matrix.lang }} / ${{ matrix.model }}
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - {suite: path, lang: en, mode: fixed, model: none}
          - {suite: json, lang: en, mode: fixed, model: none}
          - {suite: path, lang: en, mode: model, model: 'qwen2.5-coder:1.5b'}
          - {suite: json, lang: en, mode: model, model: 'qwen2.5-coder:1.5b'}
          - {suite: path, lang: de, mode: model, model: 'qwen2.5-coder:1.5b'}
          - {suite: json, lang: de, mode: model, model: 'qwen2.5-coder:1.5b'}
          - {suite: path, lang: th, mode: model, model: 'qwen2.5-coder:1.5b'}
          - {suite: json, lang: th, mode: model, model: 'qwen2.5-coder:1.5b'}
          - {suite: path, lang: en, mode: model, model: 'qwen2.5-coder:3b-instruct'}
          - {suite: json, lang: en, mode: model, model: 'qwen2.5-coder:3b-instruct'}
          - {suite: path, lang: de, mode: model, model: 'qwen2.5-coder:3b-instruct'}
          - {suite: json, lang: de, mode: model, model: 'qwen2.5-coder:3b-instruct'}
          - {suite: path, lang: th, mode: model, model: 'qwen2.5-coder:3b-instruct'}
          - {suite: json, lang: th, mode: model, model: 'qwen2.5-coder:3b-instruct'}
    env:
      SUITE: ${{ matrix.suite }}
      LANG: ${{ matrix.lang }}
      MODE: ${{ matrix.mode }}
      MODEL: ${{ matrix.model }}
    steps:
      - name: Source-only read checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Toolchain pinned to local Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: research/r071-blind-intent/go.mod
          cache: false
      - name: Independent oracle preflight and first NEGATIVE
        shell: bash
        working-directory: research/r071-blind-intent
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off
          mkdir -p "$RUNNER_TEMP/r071"
          go test -race -count=1 ./...
          go vet ./...
          echo "R071_SOURCE_ORACLE_PREFLIGHT_OK source=$GITHUB_SHA suite=$SUITE lang=$LANG model=$MODEL"
      - name: Acquire bounded CPU-only local model checkpoint, no cloud inference API
        if: matrix.mode == 'model'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name r071-ollama -p 127.0.0.1:11434:11434 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_CONTEXT_LENGTH=2048 ollama/ollama:0.13.2
          for i in $(seq 1 35); do
            if curl -fsS --max-time 3 http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null
          docker exec r071-ollama ollama pull "$MODEL" > "$RUNNER_TEMP/r071/model-pull.log" 2>&1
          docker exec r071-ollama ollama list | tee "$RUNNER_TEMP/r071/model-digest.txt"
          docker exec r071-ollama ollama show "$MODEL" | head -45 > "$RUNNER_TEMP/r071/model-info.txt"
      - name: Blind case evaluation, independent Oracle never sent to model
        shell: bash
        working-directory: research/r071-blind-intent
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off
          set +e
          timeout --signal=INT --kill-after=12s 195s go run . --suite "$SUITE" --lang "$LANG" --mode "$MODE" --model "$MODEL" --raw "$RUNNER_TEMP/r071/candidate.json" > "$RUNNER_TEMP/r071/receipt.json" 2> "$RUNNER_TEMP/r071/stderr.txt"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/r071/receipt.json"
          echo "R071_MODEL_EXIT=$rc" | tee "$RUNNER_TEMP/r071/outcome.txt"
          grep -q '"Schema":"scp.r071.blind-interview-receipt.v1"' "$RUNNER_TEMP/r071/receipt.json"
          grep -q '"Total":6' "$RUNNER_TEMP/r071/receipt.json" || echo "R071_INCOMPLETE_OR_REJECTED_RESPONSE"
          test "$rc" -eq 0
          grep -q '"Status":"PASS_EXACT_SYNTHETIC_ONLY"' "$RUNNER_TEMP/r071/receipt.json"
      - name: Upload source-only receipts, including failed candidate first RED
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r071-${{ matrix.suite }}-${{ matrix.lang }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r071/*.json
            ${{ runner.temp }}/r071/*.txt
          retention-days: 3
          if-no-files-found: warn
