name: R014 native rig facial/hand channels and high-resolution multires census
on:
  push:
    branches: [research/r014-rig-and-highres-capability-audit-v1]
    paths: [r014/**, .github/workflows/r014-rig-lod-capability-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actors:
    strategy:
      fail-fast: false
      matrix:
        sex: [female, male]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate source script before downloading
        run: python3 -m compileall -q r014
      - name: Acquire exact public video-native and CC0 sculpt source scenes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-cap/motion" "$RUNNER_TEMP/r014-cap/studio" "$RUNNER_TEMP/r014-cap/out"
          gh run download 43229574927 --repo "$GITHUB_REPOSITORY" \
            --name "r014-mpfb-textured-motion-${{ matrix.sex }}-research" \
            --dir "$RUNNER_TEMP/r014-cap/motion"
          gh run download 43212080935 --repo "$GITHUB_REPOSITORY" \
            --name r014-blenderstudio-cc0-realistic-base-research \
            --dir "$RUNNER_TEMP/r014-cap/studio"
          test -s "$RUNNER_TEMP/r014-cap/motion/R014_MPFB_${{ matrix.sex }}_textured_motion_research.blend"
          test -s "$RUNNER_TEMP/r014-cap/motion/motion_receipt.json"
          test -s "$RUNNER_TEMP/r014-cap/studio/R014_BlenderStudio_CC0_realistic_sculpt_bases.blend"
      - name: Get official portable Blender4.5.16 with upstream checksum
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r014-cap"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          sha="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#sha}" -eq 64
          printf '%s  %s\n' "$sha" blender-4.5.16-linux-x64.tar.xz | sha256sum -c -
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014-cap" -maxdepth 2 -type f -name blender | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Inspect true multires topology, rig capacity and authored channels
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 3 \
            --python r014/rig_lod_capability_audit.py -- \
            --sex "${{ matrix.sex }}" \
            --motion-blend "$RUNNER_TEMP/r014-cap/motion/R014_MPFB_${{ matrix.sex }}_textured_motion_research.blend" \
            --studio-blend "$RUNNER_TEMP/r014-cap/studio/R014_BlenderStudio_CC0_realistic_sculpt_bases.blend" \
            --motion-receipt "$RUNNER_TEMP/r014-cap/motion/motion_receipt.json" \
            --out "$RUNNER_TEMP/r014-cap/out/rig_highres_capabilities.json"
          test -s "$RUNNER_TEMP/r014-cap/out/rig_highres_capabilities.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"r014-cap/out/rig_highres_capabilities.json").read_text())
          assert r["status"]=="PASS_NATIVE_CAPABILITY_INVENTORY_PROMOTION_HOLD"
          assert r["approval"]["high_res_rig_transfer_accepted"] is False
          assert r["approval"]["finger_animation_authored"] is False
          assert r["approval"]["facial_animation_authored"] is False
          print("PASS_INVENTORY_REPRODUCED; ACTOR_VIDEO_PROMOTION_HOLD")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-rig-highres-capability-${{ matrix.sex }}
          path: ${{ runner.temp }}/r014-cap/out/*
          retention-days: 7
