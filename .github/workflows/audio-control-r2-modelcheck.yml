name: Audio Control R2 bounded exhaustive reducer model
on:
  pull_request:
    paths:
      - 'audio-control/control/modelcheck/**'
      - '.github/workflows/audio-control-r2-modelcheck.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-five-event-traces:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Exhaustively verify 8-to-the-5 model sequences against real Go reducer
        working-directory: audio-control/control
        run: go test -race -count=1 -timeout=5m -run '^TestBoundedExhaustiveFiveEventTraces$' -v ./modelcheck
      - name: Static analysis
        working-directory: audio-control/control
        run: go vet ./modelcheck
