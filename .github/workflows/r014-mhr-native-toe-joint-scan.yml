name: R014 real MHR toe/ball/foot separate FK sensitivity at worst planted frame
on:
  push:
    branches: [research/r014-mhr-native-toe-joint-sensitivity-20261112]
    paths:
      - r014/mhr_native_toe_joint_scan.py
      - .github/workflows/r014-mhr-native-toe-joint-scan.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r014-native-toe-scan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_actual_mhr_leg:
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    strategy:
      fail-fast: false
      matrix:
        side: [l, r]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Source syntax check before binary acquisition
        run: python3 -m compileall -q r014
      - name: Rehydrate exact public generated source full-169f native Blender and Go contact times
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014toe/source" "$RUNNER_TEMP/r014toe/go" "$RUNNER_TEMP/r014toe/out"
          gh run download 43301146695 --repo "$GITHUB_REPOSITORY" \
            --name r014-mhr-pelvis-reach-neutral-HOLD --dir "$RUNNER_TEMP/r014toe/source"
          gh run download 43246188313 --repo "$GITHUB_REPOSITORY" \
            --name r014-gait-contact-math-and-technical-video --dir "$RUNNER_TEMP/r014toe/go"
          test -s "$RUNNER_TEMP/r014toe/source/R014_MHR_neutral_GO_GAIT_RIGGED_HOLD.blend"
          test -s "$RUNNER_TEMP/r014toe/source/mhr_gait_retarget_receipt.json"
          (cd "$RUNNER_TEMP/r014toe/source" && sha256sum -c sha256sum.txt)
          echo "44d8ebb4bee9a01f522a92ff4377c4cc66c9b19df835bb4b6a1e2a847179fd56  $RUNNER_TEMP/r014toe/go/gait_frames.json" | sha256sum -c -
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"r014toe/source/mhr_gait_retarget_receipt.json").read_text())
          assert r["variant"]=="neutral" and r["gait_frames"]==169
          assert r["mhr_model_release_sha256"]=="e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94"
          assert r["status"]=="HOLD_NATIVE_GAIT_ANATOMY_AND_CINEMATIC_VIDEO"
          assert r["pelvis_adjustment_world_units_applied_in_real_native_animation"] is True
          assert max(v["ankle_target_residual_max_m"] for v in r["contact"].values())<.001
          print("VERIFIED_HELD_ACTUAL_NATIVE_GAIT_SOURCE_43301146695")
          PY
      - name: Pin Blender 4.5.16 in stateless runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r014toe"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          hash="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#hash}" -eq 64
          printf '%s  %s\n' "$hash" blender-4.5.16-linux-x64.tar.xz | sha256sum -c -
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014toe" -maxdepth 2 -name blender -type f | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Execute source-native foot / transversetarsal / ball joint sweep
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014toe/source/R014_MHR_neutral_GO_GAIT_RIGGED_HOLD.blend" \
            --python-exit-code 3 --python r014/mhr_native_toe_joint_scan.py -- \
            --side '${{ matrix.side }}' \
            --gait "$RUNNER_TEMP/r014toe/go/gait_frames.json" \
            --receipt "$RUNNER_TEMP/r014toe/source/mhr_gait_retarget_receipt.json" \
            --out "$RUNNER_TEMP/r014toe/out"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r014toe/out"
          r=json.loads((p/"mhr_native_toe_actuator.json").read_text())
          assert r["status"]=="HOLD_TOE_STATIC_ACTUATOR_NOT_ANIMATED_GAIT_OR_PHOTOREAL"
          assert r["side"]=="${{ matrix.side }}" and r["actuator_cases"]==54
          assert r["native_body_vertices"]==18439 and r["rig_bones"]==126
          assert (p/r["native_blend"]).stat().st_size>100000
          assert (p/r["actual_technical_png"]).stat().st_size>5000
          print("R014_REAL_NATIVE_TOE_ACTUATOR_SWEEP_COMPLETE_NOT_PRODUCTION",r["side"],r["selected_single_frame_case"])
          PY
          (cd "$RUNNER_TEMP/r014toe/out" && sha256sum *.blend *.json *.png > sha256sum.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-native-toe-scan-${{ matrix.side }}-HOLD
          path: ${{ runner.temp }}/r014toe/out/*
          retention-days: 7
