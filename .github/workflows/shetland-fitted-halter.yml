name: Shetland compact equine muzzle and contoured halter native proof
on:
  pull_request:
    paths:
      - "qualification/shetland_pony/equine_sculpt.py"
      - "qualification/shetland_pony/fitted_halter.py"
      - "qualification/shetland_pony/test_fitted_halter.py"
      - "qualification/shetland_pony/build_blender.py"
      - ".github/workflows/shetland-fitted-halter.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  muzzle-halter-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/blender/runner-images/bpy:1.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run standalone hostile shape and tack tests
        shell: bash
        run: |
          set -euo pipefail
          (cd qualification/shetland_pony && python3 -m unittest -v test_fitted_halter.py)
          python3 -m py_compile qualification/shetland_pony/fitted_halter.py qualification/shetland_pony/equine_sculpt.py qualification/shetland_pony/build_blender.py
      - name: Install disposable SHA-checked official Blender
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl xz-utils libegl1 libgl1 libgl1-mesa-dri libgbm1
          mkdir -p "$RUNNER_TEMP/blender"
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256 -o "$RUNNER_TEMP/blender/checksums"
          curl -fLsS --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz -o "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64.tar.xz"
          (cd "$RUNNER_TEMP/blender" && grep 'blender-4.5.15-linux-x64.tar.xz' checksums | sha256sum -c -)
          tar -xJf "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64.tar.xz" -C "$RUNNER_TEMP/blender"
      - name: Render black and pinto ponies with separate original tack materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          env SCP_COATS=black,pinto LIBGL_ALWAYS_SOFTWARE=1 "$RUNNER_TEMP/blender/blender-4.5.15-linux-x64/blender" -b --factory-startup --python-exit-code 8 --python qualification/shetland_pony/build_blender.py -- "$GITHUB_WORKSPACE/results"
      - name: Independent GLB mesh and rig evidence gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,struct,pathlib
          for coat in ("black","pinto"):
              p=pathlib.Path("results/shetland_"+coat+"_ghcr.glb")
              raw=p.read_bytes()
              n=struct.unpack_from("<I",raw,12)[0]
              g=json.loads(raw[20:20+n].decode().strip())
              meshes=[m.get("name","") for m in g["meshes"]]
              assert any("sculpt_equine_brow_bridge_muzzle" in name for name in meshes)
              assert max(len(s["joints"]) for s in g["skins"])>=30
              assert g["animations"]
              tack=[x for x in meshes if x.startswith("halter_")]
              assert len(tack)==5,(coat,tack)
              assert all(not x.startswith("noseband_mesh") and not x.startswith("cheekstrap") for x in meshes)
              print("STRUCTURAL_CANDIDATE_PASS",coat,len(tack),p.stat().st_size)
          print("SCIENCE_UNKNOWN: visual tack fit, hoof contact, and veterinary ROM remain separate acceptance holds")
          PY
      - name: Preserve candidate renders, assets and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shetland-muzzle-halter-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            results/*_ghcr.glb
            results/*_ghcr.png
            results/manifest.json
