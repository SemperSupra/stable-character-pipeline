name: Audio control R0 pure reducer qualification (synthetic)
on:
  pull_request:
    paths:
      - 'audio-control/**'
      - '.github/workflows/audio-control-r0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay-and-stop:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: audio-control/control
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Synthetic adversarial command/idempotence/state tests
        run: go test -race -count=1 -v ./...
      - name: Static analysis
        run: go vet ./...
