name: Motion R3 original 3D skeletal kinematics and skin parity CPU
on:
  pull_request:
    paths:
      - 'research/motion-3d-invariants-r3/**'
      - '.github/workflows/motion-r3-3d-invariants.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parallel-3d-physical-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        lane: [quaternion, parity, weighted-skin, topology]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: research/motion-3d-invariants-r3/go.mod
          cache: false
      - name: Independent source-safe math invariant
        working-directory: research/motion-3d-invariants-r3
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.lane }}' in
            quaternion) go test -count=1 -v -run '^TestQuaternionStorageAndNoncommutingRotations$' ./... ;;
            parity) go test -count=1 -v -run '^TestProperReflectionParity3D$' ./... ;;
            weighted-skin) go test -count=1 -v -run '^TestBindPoseAndWeightedSkinMirror$' ./... ;;
            topology) go test -count=1 -v -run '^TestMalformedRigAndSourceImmutability$' ./...; go vet ./... ;;
          esac
