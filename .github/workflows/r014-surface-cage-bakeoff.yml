name: R014 actual CC0 sculpt surface-cage deformation counterexample
on:
  push:
    branches: [research/r014-surface-deform-cage-proof-v1]
    paths:
      - 'r014/surface_cage/**'
      - '.github/workflows/r014-surface-cage-bakeoff.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: r014-surface-cage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual_sculpt_cage_bakeoff:
    strategy:
      fail-fast: false
      matrix:
        sex: [female, male]
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail-fast script syntax
        run: python3 -m compileall -q r014/surface_cage
      - name: Rehydrate ONLY the held source-public Blender experiments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-cage/input" "$RUNNER_TEMP/r014-cage/output"
          gh run download 43218606862 --repo "$GITHUB_REPOSITORY"             --name "r014-sculpt-rig-transfer-${{ matrix.sex }}-research"             --dir "$RUNNER_TEMP/r014-cage/input"
          test -s "$RUNNER_TEMP/r014-cage/input/R014_${{ matrix.sex }}_sculpt_weight_transfer_research.blend"
          test -s "$RUNNER_TEMP/r014-cage/input/rig_transfer_receipt.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          q=json.loads((Path(os.environ['RUNNER_TEMP'])/'r014-cage/input/rig_transfer_receipt.json').read_text())
          assert q['sex_source_macro']=={'female':0.0,'male':1.0}['${{ matrix.sex }}']
          assert q['source_mesh_vertices']==13380 and q['target_mesh_vertices']==10582
          assert q['correspondence']['p95_m']>.10  # prior failure, never positive control
          print('REHYDRATED_PREVIOUS_REJECTED_RIG_TRANSFER')
          PY
      - name: Pin Blender 4.5.16 on the DISPOSABLE runner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/r014-cage"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          sha="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#sha}" -eq 64
          printf '%s  %s\n' "$sha" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014-cage" -maxdepth 2 -type f -name blender | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Real rigged source drives target sculpt through Surface Deform; HOLD qualification
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background             "$RUNNER_TEMP/r014-cage/input/R014_${{ matrix.sex }}_sculpt_weight_transfer_research.blend"             --python-exit-code 3 --python r014/surface_cage/surface_cage_probe.py --             --sex "${{ matrix.sex }}"             --source "$RUNNER_TEMP/r014-cage/input/R014_${{ matrix.sex }}_sculpt_weight_transfer_research.blend"             --baseline "$RUNNER_TEMP/r014-cage/input/rig_transfer_receipt.json"             --out "$RUNNER_TEMP/r014-cage/output"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'r014-cage/output'
          q=json.loads((out/'surface_cage_receipt.json').read_text())
          assert q['status']=='HOLD_NOT_PHOTOREAL_NOT_ANATOMY_QUALIFIED'
          assert q['sex_preset_macro']=={'female':0.0,'male':1.0}['${{ matrix.sex }}']
          assert q['source_mpbf_mesh_vertices']==13380 and q['target_studio_base_vertices']==10582
          assert q['source_bone_count']==163
          assert q['prebind_source_distance_p95_m']>.05
          assert 'posed_geometry' in q and 'authored_multires_test' in q
          # BIND FAILURE IS RESEARCH EVIDENCE, NOT A GREEN REALISM CLAIM.
          print('PASS_REAL_MESH_CAGE_EXPERIMENT_RECEIPT_ONLY')
          print('CAGE_BOUND',q['cage_bound'], 'STRUCTURAL_CANDIDATE',q['structural_cage_candidate'])
          print('ANATOMY_AND_PHOTOREAL_VIDEO_HOLD')
          PY
          (
            cd "$RUNNER_TEMP/r014-cage/output"
            find . -maxdepth 1 -type f ! -name sha256sum.txt -print0 | sort -z | xargs -0 -r sha256sum > sha256sum.txt
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-surface-cage-${{ matrix.sex }}-HOLD-evidence
          path: ${{ runner.temp }}/r014-cage/output/*
          retention-days: 7
