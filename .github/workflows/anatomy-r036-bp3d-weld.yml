name: R036 Original BodyParts3D Atomic Seam Diagnostic
on:
  push:
    branches:
      - research/r036-bp3d-seam-qualification-20261116
    paths:
      - 'research/anatomy-bp3d-elements/weld.go'
      - 'research/anatomy-bp3d-elements/weld_test.go'
      - '.github/workflows/anatomy-r036-bp3d-weld.yml'
  pull_request:
    paths:
      - 'research/anatomy-bp3d-elements/weld.go'
      - 'research/anatomy-bp3d-elements/weld_test.go'
      - '.github/workflows/anatomy-r036-bp3d-weld.yml'
permissions:
  contents: read
concurrency:
  group: r036-bp3d-seam-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-donor-seams:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    defaults:
      run:
        working-directory: research/anatomy-bp3d-elements
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Original Go offline race and vet tests
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          go version
          go test -race -count=1 ./...
          go vet ./...
      - name: Exact original source CC-BY BodyParts3D 2013 v4 mesh bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r036-bp3d-elements"
          ROOT=https://dbarchive.biosciencedbc.jp/data/bodyparts3d/20130619
          curl -fsSL --retry 1 --connect-timeout 12 --max-time 60 --max-filesize 1600000 "$ROOT/partof_element_parts.txt" -o "$RUNNER_TEMP/r036-bp3d-elements/partof_element_parts.txt"
          curl -fsSL --retry 1 --connect-timeout 12 --max-time 360 --max-filesize 80000000 "$ROOT/partof_BP3D_4.0_obj_99.zip" -o "$RUNNER_TEMP/r036-bp3d-elements/partof_BP3D_4.0_obj_99.zip"
          (cd "$RUNNER_TEMP/r036-bp3d-elements" && printf '%s\n' \
            '3f5f6df1028eb122b30de77c711597b6bb8e5541658e5985859fd228adbf88ea  partof_element_parts.txt' \
            '9fbc713fffeee924a5a657d9813d84d7eb957bded63adb854931dd5e3eb61c97  partof_BP3D_4.0_obj_99.zip' | sha256sum --check --status)
      - name: Inspect original atomic donor seams without modifying or publishing source geometry
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -euo pipefail
          go run . --weld --elements "$RUNNER_TEMP/r036-bp3d-elements/partof_element_parts.txt" --archive "$RUNNER_TEMP/r036-bp3d-elements/partof_BP3D_4.0_obj_99.zip"
          echo "Weld candidates are unqualified geometry diagnostics; no mesh data exported"
