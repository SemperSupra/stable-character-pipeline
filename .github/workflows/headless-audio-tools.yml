name: Public headless audio authoring tool qualification
on:
  pull_request:
    paths:
      - '.github/workflows/headless-audio-tools.yml'
      - 'audio-headless/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lmms-tracks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install real LMMS headless renderer and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lmms ffmpeg
          lmms --version
      - name: Fetch pinned upstream GPL tutorial source (ephemeral)
        run: |
          set -euo pipefail
          base=https://raw.githubusercontent.com/LMMS/lmms/bed447baab187ea6292449048e0b1aab16082e3b
          curl --fail --location --retry 3 --max-time 100 -sS \
            "$base/data/projects/tutorials/editing_note_volumes.mmp" \
            -o "$RUNNER_TEMP/editing_note_volumes.mmp"
          grep -q 'instrument name="tripleoscillator"' "$RUNNER_TEMP/editing_note_volumes.mmp"
          sha256sum "$RUNNER_TEMP/editing_note_volumes.mmp"
      - name: Render and verify actual instrument tracks without desktop UI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lmms-out"
          QT_QPA_PLATFORM=offscreen timeout 240s \
            lmms rendertracks "$RUNNER_TEMP/editing_note_volumes.mmp" \
              --output "$RUNNER_TEMP/lmms-out" --format wav --samplerate 48000
          python3 audio-headless/verify.py wav "$RUNNER_TEMP/lmms-out"
          echo 'LMMS_REAL_HEADLESS_TRACKS_PASS'
      - name: Change a note in the native editable LMMS project and prove sound changed
        run: |
          set -euo pipefail
          original="$RUNNER_TEMP/editing_note_volumes.mmp"
          edited="$RUNNER_TEMP/editing_note_volumes_edited.mmp"
          python3 - "$original" "$edited" <<'PY'
          import pathlib,sys
          src=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          target='<note key="72" vol="100" pos="0" pan="0" len="12"/>'
          assert src.count(target)==1, "source fixture changed; do not apply an ambiguous edit"
          modified=src.replace(target,'<note key="74" vol="100" pos="0" pan="0" len="12"/>',1)
          pathlib.Path(sys.argv[2]).write_text(modified,encoding='utf-8')
          print("lmms_native_note_source_edit_PASS")
          PY
          mkdir -p "$RUNNER_TEMP/lmms-edited"
          QT_QPA_PLATFORM=offscreen timeout 240s             lmms rendertracks "$edited" --output "$RUNNER_TEMP/lmms-edited"               --format wav --samplerate 48000
          python3 audio-headless/verify.py wav "$RUNNER_TEMP/lmms-edited"
          python3 - "$RUNNER_TEMP/lmms-out" "$RUNNER_TEMP/lmms-edited" <<'PY'
          import hashlib,pathlib,sys
          base,edit=(pathlib.Path(x) for x in sys.argv[1:])
          a={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in base.glob("*.wav")}
          b={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in edit.glob("*.wav")}
          assert a and a.keys()==b.keys()
          assert any(a[k]!=b[k] for k in a), "editing native score did not alter audible stem bytes"
          print("lmms_edit_changes_render_PASS tracks",len(a))
          PY

      - name: Cleanup synthetic output and copyrighted tutorial file
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/lmms-out" "$RUNNER_TEMP/lmms-edited" \
            "$RUNNER_TEMP/editing_note_volumes.mmp" "$RUNNER_TEMP/editing_note_volumes_edited.mmp"
  musescore-score:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install open MuseScore converter, X virtual framebuffer and score validator
        run: |
          sudo apt-get update -qq
          apt-cache policy musescore3
          sudo apt-get install -y musescore3 xvfb unzip
      - name: Fetch pinned CC0 OpenScore transcription
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/OpenScore/Lieder/38c5db510224d9facdc4b08d741fc788cfb58ea8'
          curl --fail --location --retry 3 --max-time 100 -sS \
            "$base/scores/Schumann,_Clara/6_Lieder,_Op.13/1_Ich_stand_in_dunklen_Tr%C3%A4umen/lc5133602.mxl" \
            -o "$RUNNER_TEMP/clara_schumann_op13_1.mxl"
          curl --fail --location --retry 3 --max-time 100 -sS \
            "$base/LICENSE.txt" -o "$RUNNER_TEMP/openscore-license.txt"
          grep -q 'CC0 1.0 Universal' "$RUNNER_TEMP/openscore-license.txt"
          unzip -t "$RUNNER_TEMP/clara_schumann_op13_1.mxl"
          sha256sum "$RUNNER_TEMP/clara_schumann_op13_1.mxl"
      - name: Actually convert score to editable standard MIDI, unattended
        run: |
          set -euo pipefail
          QT_QPA_PLATFORM=offscreen timeout 180s xvfb-run -a \
            musescore3 -o "$RUNNER_TEMP/openscore.mid" "$RUNNER_TEMP/clara_schumann_op13_1.mxl"
          python3 audio-headless/verify.py midi "$RUNNER_TEMP/openscore.mid"
          echo 'MUSESCORE_REAL_HEADLESS_SCORE_PASS'
      - name: Cleanup copyrighted output and source
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/clara_schumann_op13_1.mxl" "$RUNNER_TEMP/openscore-license.txt" \
            "$RUNNER_TEMP/openscore.mid"
