name: W16 C5A actual weighted original foot first-frame native
on:
  pull_request:
    paths:
      - 'qualification/walk_w16c5a/**'
      - '.github/workflows/walk-c5a-foot.yml'
permissions:
  contents: read
jobs:
  native-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [forward, outward]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source C4 and actual Blender weighted foot with independently inspected GLB
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri xvfb
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0'
          python -m unittest discover -s qualification/walk_w16c5a -p 'test_*.py' -v
          python qualification/walk_w16c4/ground_feasibility.py --profile "$PROFILE" --out "w16c5a-$PROFILE"
          xvfb-run -a python qualification/walk_w16c5a/native_sole.py --source "w16c5a-$PROFILE/source.json" --profile "$PROFILE" --out "w16c5a-$PROFILE"
          python qualification/walk_w16c5a/independent_glb.py "w16c5a-$PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w16c5a-firstframe-${{ matrix.profile }}
          path: w16c5a-${{ matrix.profile }}/
          retention-days: 3
          if-no-files-found: warn
