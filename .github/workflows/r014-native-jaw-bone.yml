name: R014 jaw-bone rotation alternative to inverted MHR jawDrop morph
on:
  push:
    branches: [research/r014-native-jaw-bone-alternative-20261112]
    paths: ['r014/mhr_jaw_native_bone_probe.py','.github/workflows/r014-native-jaw-bone.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r014-native-jaw-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_jaw_bone_methods:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    strategy:
      fail-fast: false
      matrix:
        mode: [bone, coupled]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fail fast source syntax
        run: python3 -m compileall -q r014
      - name: Install pinned official Blender 4.5.16 in disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014jaw/out"
          cd "$RUNNER_TEMP/r014jaw"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          sha="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#sha}" -eq 64
          printf '%s  %s\n' "$sha" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014jaw" -maxdepth 2 -type f -name blender | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Original MHR model verified license and exact source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip \
            -o "$RUNNER_TEMP/r014jaw/assets.zip"
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  $RUNNER_TEMP/r014jaw/assets.zip" | sha256sum --check
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 3 \
            --python r014/mhr_fbx_native_probe.py -- \
            --phase create --archive "$RUNNER_TEMP/r014jaw/assets.zip" \
            --sha256 e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94 \
            --output "$RUNNER_TEMP/r014jaw/out" \
            --receipt "$RUNNER_TEMP/r014jaw/out/native_create.json"
      - name: Sweep real c_jaw bone in 3 local axes and inspect face geometry
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014jaw/out/R014_MHR_neutral_lod1.blend" \
            --python-exit-code 3 --python r014/mhr_jaw_native_bone_probe.py -- \
            --mode '${{ matrix.mode }}' --out "$RUNNER_TEMP/r014jaw/out"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"r014jaw/out"
          r=json.loads((p/"jaw_native_bone_bakeoff_receipt.json").read_text())
          assert r["status"]=="HOLD_NATIVE_JAW_ANATOMY_AND_CINEMATIC_QUALITY"
          assert r["mode"]=="${{ matrix.mode }}"
          assert r["mesh_vertices"]==18439 and r["rig_bones"]==126
          assert len(r["cases"])==19
          assert all("triangle_inversions" in x and "jaw_tip_motion_raw_units" in x for x in r["cases"])
          assert all((p/x).stat().st_size>5000 for x in r["closeup_images"])
          print("PASS_REAL_JAW_BONE_RESEARCH_EVIDENCE_ONLY; FACIAL_REALISM_HOLD")
          PY
          (cd "$RUNNER_TEMP/r014jaw/out" && sha256sum *.json *.blend *.png > sha256sum.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-mhr-native-jaw-${{ matrix.mode }}-HOLD
          path: ${{ runner.temp }}/r014jaw/out/*
          retention-days: 7
