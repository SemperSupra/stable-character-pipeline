name: R014 MHR pinned public CPU functional smoke test
on:
  push:
    branches: [research/r014-mhr-cpu-inference-v1]
    paths: [r014/**, .github/workflows/r014-mhr-cpu-inference.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r014-mhr-cpu-${{ github.ref }}
  cancel-in-progress: true
jobs:
  torchscript:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build disposable Python runtime with CPU-only PyTorch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r014-venv"
          "$RUNNER_TEMP/r014-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
            'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          echo "PYTHON_EXE=$RUNNER_TEMP/r014-venv/bin/python" >> "$GITHUB_ENV"
      - name: Pin official MHR release blob and run deterministic inference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-mhr"
          curl -fL --retry 3 --connect-timeout 15 \
            https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip \
            -o "$RUNNER_TEMP/r014-mhr/assets.zip"
          "$PYTHON_EXE" r014/mhr_torchscript_probe.py \
            --archive "$RUNNER_TEMP/r014-mhr/assets.zip" \
            --sha256 e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94 \
            --out "$RUNNER_TEMP/r014-mhr/evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-mhr-cpu-receipt-only
          path: ${{ runner.temp }}/r014-mhr/evidence/inference_receipt.json
          retention-days: 7
