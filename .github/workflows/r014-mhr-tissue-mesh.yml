name: R014 MHR localized real-mesh secondary deformation (research)
on:
  push:
    branches: [research/r014-mhr-tissue-mesh-v1]
    paths: [r014/**, .github/workflows/r014-mhr-tissue-mesh.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r014-mhr-tissue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download portable Blender with upstream digest check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-tissue"
          cd "$RUNNER_TEMP/r014-tissue"
          url=https://download.blender.org/release/Blender4.5
          curl -fL --retry 3 "$url/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 3 "$url/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          hash="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "${#hash}" -eq 64
          printf '%s  %s\n' "$hash" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014-tissue" -maxdepth 2 -name blender -type f | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Retrieve pinned official Meta MHR archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 \
            https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip \
            -o "$RUNNER_TEMP/r014-tissue/assets.zip"
      - name: Recreate source MHR LOD1 rigged neutral model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-tissue/evidence"
          "$BLENDER_BIN" --background --factory-startup --python r014/mhr_fbx_native_probe.py -- \
            --phase create \
            --archive "$RUNNER_TEMP/r014-tissue/assets.zip" \
            --sha256 e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94 \
            --output "$RUNNER_TEMP/r014-tissue/evidence" \
            --receipt "$RUNNER_TEMP/r014-tissue/evidence/original.json"
      - name: Generate actual-skin localized morphs and render motion
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014-tissue/evidence/R014_MHR_neutral_lod1.blend" \
            --python r014/mhr_tissue_mesh_probe.py -- \
            --output "$RUNNER_TEMP/r014-tissue/evidence" \
            --receipt "$RUNNER_TEMP/r014-tissue/evidence/tissue.json"
      - name: Fresh-process native scene and GLB morph animation contract
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014-tissue/evidence/R014_MHR_local_tissue_morph_research.blend" \
            --python r014/mhr_tissue_mesh_verify.py -- \
            --blend "$RUNNER_TEMP/r014-tissue/evidence/R014_MHR_local_tissue_morph_research.blend" \
            --glb "$RUNNER_TEMP/r014-tissue/evidence/R014_MHR_local_tissue_morph_research.glb" \
            --receipt "$RUNNER_TEMP/r014-tissue/evidence/reopened.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-mhr-actual-mesh-tissue-experimental
          path: |
            ${{ runner.temp }}/r014-tissue/evidence/*.json
            ${{ runner.temp }}/r014-tissue/evidence/*local_tissue*.blend
            ${{ runner.temp }}/r014-tissue/evidence/*local_tissue*.glb
            ${{ runner.temp }}/r014-tissue/evidence/*tissue_mesh*.mp4
          retention-days: 7
