name: NASA R9 self-contained original source to R6 Blender and R7 independent vertex parity
on:
  pull_request:
    paths:
      - '.github/workflows/nasa-r9-self-contained.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nasa-r9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# SINGLE PUBLIC RUN: original NASA media and pinned source inference -> Go GLB
# -> parallel native bpy + pure glTF + generated iPhone H264 -> strict R7
# No historic Actions artifact, shared secret, private media, GPU, paid cloud.
jobs:
  source-replay-and-skin:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      GO111MODULE: 'off'
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Print exact checked source revision and baseline fixture provenance
        run: |
          git rev-parse HEAD
          echo 'R2 prior independent public CPU run: 40555220225; NO artifact retrieval permitted'
          echo 'NASA video SHA1: dfc000088cfff728b57fe0c8ae38a7266410caeb'
      - name: Offline Go and source-replay negative admission controls
        run: |
          go test -v ./qualification/nasa_rig_r3
          python -m unittest discover -v -s qualification/nasa_rig_r3 -p 'test_replay.py'
          python -m unittest discover -v -s qualification/nasa_pair -p 'test_*.py'
          python -m py_compile qualification/nasa_rig_r3/portable_verify.py
      - name: Install bounded fixed CPU inference and wheel-bundled encoder
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            'mediapipe==0.10.21' 'pillow==11.3.0' 'imageio-ffmpeg==0.6.0'
      - name: DIRECT full NASA original photo/video and model replay without prior artifacts
        run: |
          python qualification/nasa_rig_r3/replay_source.py --out nasa-pair-output
          test -s nasa-pair-output/direct_source_replay.json
          test -s nasa-pair-output/video_landmarks.json
          test -s nasa-pair-output/receipt.json
      - name: Go source-checked animated skin from fresh original observations
        run: |
          go run qualification/nasa_rig_r3/main.go \
            -input nasa-pair-output/video_landmarks.json \
            -receipt nasa-pair-output/receipt.json \
            -selection coverage \
            -out pose-rig-output
      - name: Independently decode and deform actual GLB, render CPU source frames
        run: |
          python qualification/nasa_rig_r3/portable_verify.py \
            --glb pose-rig-output/camera_plane_skinned_motion.glb \
            --manifest pose-rig-output/rig_manifest.json \
            --out pose-rig-output
      - name: Create iPhone H264 MP4 from evaluated skin preview
        run: |
          python - <<'PY'
          import imageio_ffmpeg
          import subprocess
          from pathlib import Path
          ff=imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([ff,'-hide_banner','-loglevel','error','-nostdin','-y',
              '-framerate','1','-start_number','0','-i','pose-rig-output/rig_frame_%03d.png',
              '-c:v','libx264','-pix_fmt','yuv420p','-movflags','+faststart',
              'pose-rig-output/camera_plane_rig_demo.mp4'],check=True,timeout=60)
          assert Path('pose-rig-output/camera_plane_rig_demo.mp4').stat().st_size > 3000
          print('R5_H264_BYTES',Path('pose-rig-output/camera_plane_rig_demo.mp4').stat().st_size)
          PY
      - name: Inspect every reproducible receipt and output existence
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['nasa-pair-output/receipt.json','nasa-pair-output/direct_source_replay.json',
                  'pose-rig-output/rig_manifest.json','pose-rig-output/portable_glb_validation.json',
                  'pose-rig-output/camera_plane_rig_demo.mp4']:
              p=Path(name)
              print('R5_RECEIPT',name,p.stat().st_size if p.exists() else 'NOT_PRODUCED')
              if p.exists() and p.suffix=='.json':print(p.read_text()[:9000])
          PY
      - name: Preserve source-to-rig evidence (not original media/model weights)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-r5-originals-replay-and-rig
          path: |
            nasa-pair-output/receipt.json
            nasa-pair-output/direct_source_replay.json
            nasa-pair-output/video_landmarks.json
            pose-rig-output/
          if-no-files-found: warn
          retention-days: 3
  r6-native-blender:
    needs: source-replay-and-skin
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - name: Checkout public R6 source only, no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download verified public same-repository NASA R5 result; do not re-run MediaPipe
        uses: actions/download-artifact@v4
        with:
          name: nasa-r5-originals-replay-and-rig
          path: r5-evidence
      - name: Pin original NASA R5 observations, skin and source times before any native import
        run: |
          set -euo pipefail
          echo '69a9869e21542dcdaade37f290c29b6d7217ae0e392f450aeb40efe00611ac6a  r5-evidence/pose-rig-output/camera_plane_skinned_motion.glb' | sha256sum -c -
          echo 'a6b56e7d794a5b74701031a75d350a9b2163182950861c1d135ec18b748c9b53  r5-evidence/nasa-pair-output/video_landmarks.json' | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('r5-evidence/pose-rig-output/rig_manifest.json').read_text())
          r=json.loads(Path('r5-evidence/nasa-pair-output/direct_source_replay.json').read_text())
          assert m['glb_sha256']=='69a9869e21542dcdaade37f290c29b6d7217ae0e392f450aeb40efe00611ac6a'
          assert m['glb_sample_count']==10 and m['frame_selection_method']=='coverage'
          assert m['glb_frame_start_source_ms']==13000 and m['glb_frame_end_source_ms']==22000
          assert r['bit_identical_observations_to_r2'] is True and r['pose_detected_frames']==21
          print('R6_PINNED_R5_PRECHECK_PASS source seconds 13-22, 10 frames')
          PY
      - name: Reject historical one-frame clock bug before Blender install
        run: |
          set -euo pipefail
          (cd qualification/nasa_rig_r3 && python -m unittest -v test_frame_clock)
      - name: Install official standalone Blender 4.5 bpy Python and CPU raster/encoder wheels
        timeout-minutes: 9
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir             'bpy==4.5.0' 'Pillow==11.3.0' 'imageio-ffmpeg==0.6.0'
          python - <<'PY'
          import bpy
          from PIL import Image
          import imageio_ffmpeg
          assert bpy.app.version >= (4,5,0), bpy.app.version_string
          print('BLENDER_WHEEL_READY',bpy.app.version_string,bpy.app.build_platform.decode() if isinstance(bpy.app.build_platform,bytes) else bpy.app.build_platform)
          print('STANDALONE_FFMPEG',imageio_ffmpeg.get_ffmpeg_exe())
          PY
      - name: Real native Blender glTF import and skinned evaluated geometry (CPU Pillow raster)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          mkdir -p r6-native-output
          python -u qualification/nasa_rig_r3/blender_verify.py --             r5-evidence/pose-rig-output/camera_plane_skinned_motion.glb             r5-evidence/pose-rig-output/rig_manifest.json r6-native-output
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.loads(Path('r6-native-output/blender_independent_readback.json').read_text())
          assert r['classification']=='INDEPENDENT_BLENDER_SKIN_AND_ANIMATION_READBACK'
          assert r['skin_import_and_cpu_preview_pass'] is True
          assert r['armatures']>=1 and r['skinned_meshes']>=1 and r['actions']>=1
          assert r['rendered_png_frames']==r['source_sampled_frames']==10
          assert r['source_glb_animation_time_origin_seconds'] == 0
          assert r['native_blender_scene_frames'] == list(range(0,217,24))
          assert r['source_frame_to_scene_mapping'].endswith('(zero-based)')
          assert r['evaluated_animated_vertex_max_displacement_camera_plane_units']>0.002
          assert r['camera_plane_not_true_3d'] is True
          axes=r['native_blender_axis_validation']
          assert axes['native_z_vertical_extent_at_first']>0.1
          assert axes['projection_axes']=='Blender native XZ (glTF source XY), depth Blender Y'
          assert r['blender_total_sampled_mesh_vertices']==192
          assert 'NOT Blender render engine' in r['raster_pipeline']
          # Qualify human inspectability independently from merely written PNGs.
          from PIL import Image
          im=Image.open('r6-native-output/rig_frame_000.png').convert('RGB')
          pts=[(x,y) for y in range(40,325) for x in range(640)
               if (lambda v: v[2]>140 and v[1]>120 and v[0]<150)(im.getpixel((x,y)))]
          assert pts, 'no visible Blender-evaluated skinned pixels'
          w=max(x for x,y in pts)-min(x for x,y in pts)
          h=max(y for x,y in pts)-min(y for x,y in pts)
          print('R6_VISUAL_GEOMETRY_EXTENTS_PIXELS',w,h)
          assert w>15 and h>25, 'flattened or tiny camera-plane rig preview'
          assert len(list(Path('r6-native-output').glob('rig_frame_*.png')))==10
          print('R6_BLENDER_NATIVE_DEFORMATION_PASS',json.dumps(r,sort_keys=True))
          PY
      - name: Quantify two-reader source-raster overlap (not a 3D oracle)
        run: |
          python -m py_compile qualification/nasa_rig_r3/compare_raster.py
          python qualification/nasa_rig_r3/compare_raster.py \
            --reference r5-evidence/pose-rig-output \
            --blender r6-native-output \
            --out r6-native-output/cross_reader_raster_observation.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('r6-native-output/cross_reader_raster_observation.json')
          r=json.loads(p.read_text())
          assert r['frame_count']==10
          assert r['actual_anatomical_3d_accuracy']=='NOT_TESTED'
          assert r['actual_model_inference'] is False
          assert r['source_identity_inference'] is False
          assert r['camera_plane_axis_mapping']=='glTF XY, Blender native XZ'
          print('R6_TWO_READER_RASTER_IOU_OBSERVED',r['min_overlap'],r['mean_overlap'],r['max_overlap'])
          PY
      - name: Encode iPhone H264 from Blender-evaluated polygons, no Blender GPU renderer
        run: |
          python - <<'PY'
          import imageio_ffmpeg, subprocess
          from pathlib import Path
          ff=imageio_ffmpeg.get_ffmpeg_exe()
          subprocess.run([ff,'-hide_banner','-loglevel','error','-nostdin','-y',
              '-framerate','1','-start_number','0','-i','r6-native-output/rig_frame_%03d.png',
              '-c:v','libx264','-pix_fmt','yuv420p','-movflags','+faststart',
              'r6-native-output/blender_evaluated_rig.mp4'],check=True,timeout=50)
          p=Path('r6-native-output/blender_evaluated_rig.mp4')
          assert p.stat().st_size>3000
          print('R6_BLENDER_CPU_IPHONE_MP4',p.stat().st_size)
          PY
      - name: Record native first failure or verified R6 receipt
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for f in ['r5-evidence/pose-rig-output/rig_manifest.json',
                    'r6-native-output/blender_independent_readback.json',
                    'r6-native-output/blender_evaluated_rig.mp4']:
            p=Path(f)
            print('R6_NATIVE_EVIDENCE',f,p.stat().st_size if p.exists() else 'NOT_PRODUCED')
            if p.suffix=='.json' and p.exists():print(p.read_text()[:4000])
          PY
      - name: Archive native bpy readback evidence and iPhone preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nasa-r6-blender-wheel-native-geometry
          path: r6-native-output/
          retention-days: 3
          if-no-files-found: warn
  evaluators:
    needs: source-replay-and-skin
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: R7 isolated CPU / ${{ matrix.reader }}
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        reader: [gltf, blender]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download same original source-bound R5 model output; no new model inference
        uses: actions/download-artifact@v4
        with:
          name: nasa-r5-originals-replay-and-rig
          path: r5
      - name: Prove exact source GLB and model-landmark observation SHA
        run: |
          set -euo pipefail
          echo '69a9869e21542dcdaade37f290c29b6d7217ae0e392f450aeb40efe00611ac6a  r5/pose-rig-output/camera_plane_skinned_motion.glb' | sha256sum -c -
          echo 'a6b56e7d794a5b74701031a75d350a9b2163182950861c1d135ec18b748c9b53  r5/nasa-pair-output/video_landmarks.json' | sha256sum -c -
      - name: Reject historical frame-one offset and invalid clocks
        run: |
          (cd qualification/nasa_rig_r3 && python -m unittest -v test_frame_clock)
      - name: Install only reader-specific public Python dependencies
        run: |
          set -euo pipefail
          if [ "${{ matrix.reader }}" = blender ]; then
            python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0' 'Pillow==11.3.0'
          else
            python -m pip install --disable-pip-version-check --no-cache-dir 'Pillow==11.3.0'
          fi
      - name: Independently evaluate 192 vertices across 10 source-bound frames
        run: |
          set -euo pipefail
          mkdir -p evaluated
          if [ "${{ matrix.reader }}" = blender ]; then
            python -u qualification/nasa_rig_r3/blender_verify.py -- \
              r5/pose-rig-output/camera_plane_skinned_motion.glb \
              r5/pose-rig-output/rig_manifest.json evaluated
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evaluated/r7_blender_vertices.json')
          r=json.loads(p.read_text())
          assert r['reader']=='bpy_evaluated_mesh_world_XYZ'
          br=json.loads(Path('evaluated/blender_independent_readback.json').read_text())
          assert br['native_blender_scene_frames']==list(range(0,217,24))
          assert br['source_glb_animation_time_origin_seconds']==0
          assert len(r['frames'])==10 and all(len(f['vertices'])==192 for f in r['frames'])
          print('R7_ACTUAL_BLENDER_SAMPLED',p.stat().st_size)
          PY
          else
            cp r5/pose-rig-output/camera_plane_skinned_motion.glb evaluated/
            python -u qualification/nasa_rig_r3/portable_verify.py \
              --glb r5/pose-rig-output/camera_plane_skinned_motion.glb \
              --manifest r5/pose-rig-output/rig_manifest.json --out evaluated
            python - <<'PY'
          import json
          from pathlib import Path
          p=Path('evaluated/r7_gltf_vertices.json')
          r=json.loads(p.read_text())
          assert r['reader']=='independent_glTF_source_XYZ'
          assert len(r['frames'])==10 and all(len(f['vertices'])==192 for f in r['frames'])
          print('R7_INDEPENDENT_GLTF_SAMPLED',p.stat().st_size)
          PY
          fi
      - name: Keep per-reader isolated numerical facts; no source asset redistribution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-numeric-${{ matrix.reader }}
          path: |
            evaluated/r7_${{ matrix.reader }}_vertices.json
            evaluated/*readback.json
          retention-days: 3
          if-no-files-found: warn

  parity-reconcile:
    name: R7 independent numerical parity and falsifiers
    needs: evaluators
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Explicitly preserve failure of either original evaluator
        env:
          EVALUATORS: ${{ needs.evaluators.result }}
        run: |
          echo "R7_TWO_EVALUATORS=$EVALUATORS"
          test "$EVALUATORS" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: r7-numeric-*
          path: r7-input
          merge-multiple: true
      - name: Test comparison semantics and exact source readback
        run: |
          set -euo pipefail
          (cd qualification/nasa_rig_r3 && python -m unittest -v test_r7_vertex_parity)
          mkdir -p r7-receipt
          python qualification/nasa_rig_r3/r7_vertex_parity.py \
            --gltf r7-input/r7_gltf_vertices.json \
            --blender r7-input/r7_blender_vertices.json \
            --out r7-receipt/vertex_numeric_parity.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('r7-receipt/vertex_numeric_parity.json')
          r=json.loads(p.read_text())
          assert r['sample_count']==10 and r['vertices_per_sample']==192
          assert r['source_person_identity_accuracy']=='NOT_TESTED'
          assert r['real_body_anatomy_accuracy']=='NOT_TESTED'
          assert r['independent_source_truth_oracle'] is False
          print('R7_FINAL_CROSS_READER_CLASSIFICATION',r['status'])
          PY
      - name: Keep all source-bound comparisons or first failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-numeric-parity-receipt
          path: r7-receipt/
          retention-days: 3
          if-no-files-found: warn
