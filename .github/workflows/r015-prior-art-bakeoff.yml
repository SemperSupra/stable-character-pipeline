name: R015 Existing Text-to-Body Technique Bakeoff
on:
  push:
    branches:
      - research/r015-prior-art-bakeoff-r1-20261112
    paths:
      - '.github/workflows/r015-prior-art-bakeoff.yml'
      - 'research/r015_prior_art/bakeoff.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r015-prior-art-bakeoff
  cancel-in-progress: true
jobs:
  existing-techniques:
    name: R015 source-pinned $0 CPU — ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: bodyshapegpt
            repo: https://github.com/baldoarbol/BodyShapeGPT.git
            pin: 758bf5a1b3dbd12984de6f68ad4d3bf8c95ef409
          - lane: semantify
            repo: https://github.com/Omergral/Semantify.git
            pin: 78b001d3dc4ea4efa428e3aff1213cefddf6ebd8
    steps:
      - name: Checkout isolated public research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure ephemeral Python environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/r015-venv"
          . "$RUNNER_TEMP/r015-venv/bin/activate"
          python -m pip --version
          case "$LANE" in
            bodyshapegpt)
              python -m pip install --disable-pip-version-check --no-input --no-cache-dir numpy==2.1.3 scipy==1.15.2 scikit-learn==1.6.1
              ;;
            semantify)
              python -m pip install --disable-pip-version-check --no-input --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
              ;;
            *) exit 22;;
          esac
        env:
          LANE: ${{ matrix.lane }}
      - name: Pin and retrieve public upstream (without executing setup scripts)
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" fetch -q --depth 1 "$REPO" "$PIN"
          git -C "$RUNNER_TEMP/upstream" checkout -q --detach FETCH_HEAD
          [ "$(git -C "$RUNNER_TEMP/upstream" rev-parse HEAD)" = "$PIN" ]
          git -C "$RUNNER_TEMP/upstream" status --short
        env:
          REPO: ${{ matrix.repo }}
          PIN: ${{ matrix.pin }}
      - name: Execute lane and emit explicit research receipt
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/r015-venv/bin/activate"
          python research/r015_prior_art/bakeoff.py --lane "$LANE" --source "$RUNNER_TEMP/upstream" --expected-sha "$PIN" --out "receipts/$LANE.json"
        env:
          LANE: ${{ matrix.lane }}
          PIN: ${{ matrix.pin }}
      - name: Archive bounded public receipts (even on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r015-${{ matrix.lane }}
          path: receipts/*.json
          if-no-files-found: warn
          retention-days: 7
