name: R2 Procedural Mesh Interchange (public disposable)
run-name: R2 mesh ${{ github.ref_name }}

on:
  push:
    branches: [research/geometry-mesh-interchange-r2-20261112]
    paths:
      - 'qualification/geometry-donors/r2-mesh/**'
      - '.github/workflows/geometry-mesh-interchange-r2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometry-mesh-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mesh:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: linux-amd64
          - runner: ubuntu-24.04-arm
            arch: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Syntax-check independent STL oracle
        run: python3 -m py_compile qualification/geometry-donors/r2-mesh/oracle.py
      - name: Build clean consumers and export actual donor meshes
        shell: bash
        run: |
          set -o pipefail
          bash qualification/geometry-donors/r2-mesh/run.sh 2>&1 | tee qualification/geometry-donors/r2-mesh/run.log
      - name: Retain original generated meshes, measurements and failed-case evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: geometry-mesh-r2-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            qualification/geometry-donors/r2-mesh/results/
            qualification/geometry-donors/r2-mesh/run.log
          if-no-files-found: warn
          retention-days: 7
