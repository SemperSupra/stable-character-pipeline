name: N03D BG original CC0 exact matched shape 163 vs53 2camera 6sec real native H264
on:
  push:
    branches: [research/n03d-bg-visual-witness-20261121]
    paths:
      - 'research/n03d-bg-visual-witness/**'
      - '.github/workflows/n03d-bg-visual-witness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n03d-bg-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent-source-and-matched-morph-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Bad phenotype, source, frame, false shoe, force and protected MVP tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/n03d-bg-visual-witness -p 'test_critic.py' -v
          python3 -m unittest discover -s research/r078-r009-mpfb-pair -p 'test_contract.py' -v
          python3 -m unittest discover -s research/r088-motion-real -p 'test_bvh_preflight.py' -v
          python3 -m py_compile research/n03d-bg-visual-witness/*.py
  actual-authenticated-matched-phenotype-native-rigs:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: True source and rights preflight
        run: |
          set -euo pipefail
          python3 -m unittest discover -s research/n03d-bg-visual-witness -p 'test_critic.py' -v
          python3 -m py_compile research/n03d-bg-visual-witness/*.py
      - name: Exact official Blender 5.2.4 pinned upstream archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/official-blender"
          cd "$RUNNER_TEMP/official-blender"
          base="https://mirror.blender.org/release/Blender5.2"
          fallback="https://download.blender.org/release/Blender5.2"
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-5.2.4.sha256" -o blender.sha256 || curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$fallback/blender-5.2.4.sha256" -o blender.sha256
          curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$base/blender-5.2.4-linux-x64.tar.xz" -o blender-5.2.4-linux-x64.tar.xz || curl --retry 2 --connect-timeout 20 --max-time 300 -fLsS "$fallback/blender-5.2.4-linux-x64.tar.xz" -o blender-5.2.4-linux-x64.tar.xz
          hash="$(grep -F blender-5.2.4-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "$hash" = 2fd14c50987426897ba60237ee996edf2b4151f4b1a72a460ca20be58c1d2d86
          printf '%s  %s\n' "$hash" blender-5.2.4-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-5.2.4-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/official-blender" -maxdepth 2 -type f -name blender | head -1)"
          test -x "$bin"
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
      - name: Official original source pinned MPFB3D body, skeleton and vertex weight builder
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/mpfb2"
          git -C "$RUNNER_TEMP/mpfb2" remote add origin https://github.com/makehumancommunity/mpfb2.git
          git -C "$RUNNER_TEMP/mpfb2" -c protocol.version=2 fetch -q --depth 1 origin 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          git -C "$RUNNER_TEMP/mpfb2" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = 9de0707fdc88438d7c53a1a2ac7937d9221e2431
          test "$(git -C "$RUNNER_TEMP/mpfb2" hash-object src/mpfb/data/3dobjs/base.obj)" = d26635e9326e3cca30778fd7b9c00062b03cce09
          blender --command extension build --source-dir "$RUNNER_TEMP/mpfb2/src/mpfb" --output-filepath "$RUNNER_TEMP/mpfb-pinned.zip"
          blender --command extension install-file -r user_default -e "$RUNNER_TEMP/mpfb-pinned.zip"
      - name: Exact original licensed 100STYLE full 60Hz source motion pinned Git content
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/be-source"
          curl --retry 2 --connect-timeout 12 --max-time 120 -fLsS "https://raw.githubusercontent.com/tomcatmew/simple_motion_matching/10938b4881b55c5801faded89e427407ddf14bce/data/100style/Neutral_FW.bvh" -o "$RUNNER_TEMP/be-source/Neutral_FW.bvh"
          test "$(git hash-object "$RUNNER_TEMP/be-source/Neutral_FW.bvh")" = a534f69b1d7a867f9b7d4dccefcf3f1d255c4a61
          python3 research/r088-motion-real/bvh_preflight.py --source "$RUNNER_TEMP/be-source/Neutral_FW.bvh" --sha1 a534f69b1d7a867f9b7d4dccefcf3f1d255c4a61 --out "$RUNNER_TEMP/be-source/preflight.json"
      - name: Acquire exact SHA and CC0-validated original source shoes01 archive from community
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bf-wardrobe"
          curl --retry 2 --connect-timeout 15 --max-time 240 -fLsS "https://files.makehumancommunity.org/asset_packs/shoes01/shoes01_cc0.zip" -o "$RUNNER_TEMP/bf-wardrobe/shoes01_cc0.zip"
          echo "ded3f70428505eabbf1f6d7b5f61196a7366ef20757103d276ad0ed336c35ada  $RUNNER_TEMP/bf-wardrobe/shoes01_cc0.zip" | sha256sum -c -
      - name: SHA256 pinned 0.6.0 imageio FFmpeg wheel from existing proven original film workcell
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bg-wheels" "$RUNNER_TEMP/bg-python"
          python3 -m pip download -q --disable-pip-version-check --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/bg-wheels" imageio-ffmpeg==0.6.0
          test "$(sha256sum "$RUNNER_TEMP/bg-wheels"/*.whl | awk '{print $1}')" = c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282
          python3 -m pip install -q --disable-pip-version-check --no-deps --no-index --find-links "$RUNNER_TEMP/bg-wheels" --target "$RUNNER_TEMP/bg-python" imageio-ffmpeg==0.6.0
          ffmpeg="$(PYTHONPATH="$RUNNER_TEMP/bg-python" python3 -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$ffmpeg"
          "$ffmpeg" -hide_banner -version | head -1
          echo "SCP_FFMPEG=$ffmpeg" >> "$GITHUB_ENV"
      - name: Real native original actor H264 dual cameras and six-second keyframed CC0 shoe movement
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bf-wardrobe/unpack"
          blender -b -t 2 --python-exit-code 12 --python research/n03d-bg-visual-witness/video.py -- --source "$RUNNER_TEMP/mpfb2" --motion "$RUNNER_TEMP/be-source/Neutral_FW.bvh" --shoe-archive "$RUNNER_TEMP/bf-wardrobe/shoes01_cc0.zip" --work "$RUNNER_TEMP/bf-wardrobe/unpack" --out "$RUNNER_TEMP/be-source/bg-visual" --ffmpeg "$SCP_FFMPEG"
      - name: Independent FFprobe 72 true decoded frames, 2 cameras, H264 and three changing pixels/scene states
        run: |
          set -euo pipefail
          test -x "$SCP_FFMPEG"
          python3 - <<'PY'
          import os,sys,json
          from pathlib import Path
          sys.path.insert(0,"research/n03d-bg-visual-witness")
          from critic import validate
          root=Path(os.environ["RUNNER_TEMP"])/"be-source/bg-visual"
          report=json.loads((root/"n03d-bg-video-witness.json").read_text())
          qualified=validate(report,root,allow_decoding=True,ffmpeg_exe=os.environ["SCP_FFMPEG"])
          assert qualified["status"]=="PASS_NARROW_VIDEO_FORMAT_AND_PIXEL_CHANGE_HOLD_GAIT"
          assert qualified["real_native_H264_12fps_72_decoded_frames"] and not qualified["physical_gait_accepted"]
          (root/"n03d-bg-video-independent-critic.json").write_text(json.dumps(qualified,sort_keys=True,indent=2)+"\n")
          print("N03D_BG_INDEPENDENT_TWO_ACTUAL_VIDEOS_HOLD",json.dumps(qualified,sort_keys=True))
          PY
      - name: Short-retention source-free JSON only, never raw generated .blend/body/motion/keys
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: n03d-bg-visual-witness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/be-source/preflight.json
            ${{ runner.temp }}/be-source/bg-visual/*.json
            ${{ runner.temp }}/be-source/bg-visual/*.mp4
            ${{ runner.temp }}/be-source/bg-visual/ATTRIBUTION.txt

          if-no-files-found: ignore
          retention-days: 3
