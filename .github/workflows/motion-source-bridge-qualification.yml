name: motion-source-bridge-qualification
on:
  pull_request:
    paths:
      - 'qualification/motion_source_bridge/**'
      - '.github/workflows/motion-source-bridge-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Exact source-only tests, race and vet
        working-directory: qualification/motion_source_bridge
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
          go vet ./...
          go run . -capabilities
