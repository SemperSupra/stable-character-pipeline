name: R17 independent source-safe SBOM provenance falsifiers
on:
  pull_request:
    paths:
      - 'qualification/review_r17/**'
      - 'qualification/sbom_inventory/r14_integrity.py'
      - '.github/workflows/r17-sbom-provenance-review.yml'
permissions:
  contents: read
jobs:
  offline-provenance-negative-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise exact parent SBOM review source without native OCI rebuild
        run: python3 -m unittest discover -s qualification/review_r17 -p 'test_*.py' -v
