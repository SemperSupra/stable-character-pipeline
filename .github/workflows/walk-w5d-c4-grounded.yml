name: WALK W5D - Original C4 24-frame native weighted sole source verification
on:
  pull_request:
    paths:
      - 'qualification/walk_w16c5a/**'
      - '.github/workflows/walk-w5d-c4-grounded.yml'
permissions:
  contents: read
jobs:
  native-c4-24-frame:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        profile: [forward, outward]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source C4 original rights and actual native Blender 24-frame six-bone evaluated sole
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libegl1 libgl1 libgl1-mesa-dri xvfb
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0'
          python -m unittest discover -s qualification/walk_w16c5a -p 'test_w4d_liveness.py' -v
          python qualification/walk_w16c4/ground_feasibility.py --profile "$PROFILE" --out "walk-w5d-$PROFILE"
          xvfb-run -a python qualification/walk_w16c5a/w5d_grounded_native.py --source "walk-w5d-$PROFILE/source.json" --profile "$PROFILE" --out "walk-w5d-$PROFILE"
          python qualification/walk_w16c5a/w4d_liveness.py "walk-w5d-$PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: walk-w5d-grounded-original-${{ matrix.profile }}
          path: walk-w5d-${{ matrix.profile }}/
          retention-days: 3
          if-no-files-found: warn
