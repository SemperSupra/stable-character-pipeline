name: Motion R3 independent Godot 4.5.2 GLB skeletal animation runtime CPU
on:
  pull_request:
    paths:
      - 'research/motion-mmd-curve-r2/glb_roundtrip.py'
      - 'research/motion-mmd-curve-r2/godot_hil/**'
      - '.github/workflows/motion-r3-godot-glb.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        lane: [linear, nonlinear]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: MMD-Blender/blender_mmd_tools
          ref: f1d8a98db5e185cfa73c9b8a8a67fa42d9eb4b14
          path: vendor/mmd-tools
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: ''
      - name: Install source-authorized Blender and original MMD Tools dependencies
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0' 'opencc-python-reimplemented==0.1.7'
      - name: Build and independently validate one original synthetic skinned GLB
        shell: bash
        timeout-minutes: 4
        env:
          OMP_NUM_THREADS: '2'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          python research/motion-mmd-curve-r2/glb_roundtrip.py --upstream vendor/mmd-tools --lane '${{ matrix.lane }}' --export-out "$RUNNER_TEMP/r3-source.glb"
          test -s "$RUNNER_TEMP/r3-source.glb"
          sha256sum "$RUNNER_TEMP/r3-source.glb"
      - name: Download exact official Godot 4.5.2 release into ephemeral worker
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          curl -fLSs --retry 2 --max-time 90 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o "$RUNNER_TEMP/r3-godot.zip"
          sha256sum "$RUNNER_TEMP/r3-godot.zip"
          mkdir -p "$RUNNER_TEMP/godot-bin" "$RUNNER_TEMP/r3-godot-project"
          unzip -q "$RUNNER_TEMP/r3-godot.zip" -d "$RUNNER_TEMP/godot-bin"
          test -s "$RUNNER_TEMP/godot-bin/Godot_v4.5.2-stable_linux.x86_64"
          chmod +x "$RUNNER_TEMP/godot-bin/Godot_v4.5.2-stable_linux.x86_64"
          "$RUNNER_TEMP/godot-bin/Godot_v4.5.2-stable_linux.x86_64" --version
      - name: Actual independent Godot glTF import and 3D skeleton motion replay
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/r3-godot-project"
          G="$RUNNER_TEMP/godot-bin/Godot_v4.5.2-stable_linux.x86_64"
          cp research/motion-mmd-curve-r2/godot_hil/project.godot "$P/project.godot"
          cp research/motion-mmd-curve-r2/godot_hil/probe.gd "$P/probe.gd"
          cp "$RUNNER_TEMP/r3-source.glb" "$P/fixture.glb"
          timeout 90 "$G" --headless --path "$P" --editor --import
          timeout 45 "$G" --headless --path "$P" --script probe.gd -- --lane '${{ matrix.lane }}'
          echo 'No original GLB/model/image/video artifact uploaded; all source bytes ephemeral'
