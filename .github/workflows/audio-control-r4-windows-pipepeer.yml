name: Audio Control R4 native Windows named-pipe host origin
on:
  pull_request:
    paths:
      - 'audio-control/platform/windows-pipepeer/**'
      - '.github/workflows/audio-control-r4-windows-pipepeer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-child-peer-token:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: '10.0.x'
      - name: Actual Windows named-pipe child PID / impersonation evidence
        run: dotnet run --configuration Release --project audio-control/platform/windows-pipepeer/PipePeer.csproj
