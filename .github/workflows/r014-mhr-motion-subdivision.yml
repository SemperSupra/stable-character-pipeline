name: R014 MHR native arm+face rig motion through subdivision
on:
  push:
    branches: [research/r014-mhr-motion-subdivision-qualification-20261112]
    paths:
      - 'r014/mhr_motion_subdivision_probe.py'
      - '.github/workflows/r014-mhr-motion-subdivision.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r014-mhr-motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independent_native_mhr_motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        mode: [arm, face]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Compile all source before acquiring binaries
        run: python3 -m compileall -q r014
      - name: Pinned Blender 4.5.16 in disposable workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r014-mhr/output"
          cd "$RUNNER_TEMP/r014-mhr"
          base=https://download.blender.org/release/Blender4.5
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16.sha256" -o blender.sha256
          curl -fL --retry 5 --retry-all-errors --retry-delay 3 "$base/blender-4.5.16-linux-x64.tar.xz" -o blender-4.5.16-linux-x64.tar.xz
          sha="$(grep -F blender-4.5.16-linux-x64.tar.xz blender.sha256 | awk '{print $1}')"
          test "$(printf '%s' "$sha" | wc -c)" -eq 64
          printf '%s  %s\n' "$sha" blender-4.5.16-linux-x64.tar.xz | sha256sum --check
          tar -xJf blender-4.5.16-linux-x64.tar.xz
          bin="$(find "$RUNNER_TEMP/r014-mhr" -maxdepth 2 -name blender -type f | head -1)"
          test -n "$bin"
          echo "BLENDER_BIN=$bin" >> "$GITHUB_ENV"
      - name: Hash pin official public MHR model asset and import original rig
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            https://github.com/facebookresearch/MHR/releases/download/v1.0.1/assets.zip \
            -o "$RUNNER_TEMP/r014-mhr/assets.zip"
          echo "e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94  $RUNNER_TEMP/r014-mhr/assets.zip" | sha256sum --check
          "$BLENDER_BIN" --background --factory-startup --python-exit-code 3 \
            --python r014/mhr_fbx_native_probe.py -- \
            --phase create --archive "$RUNNER_TEMP/r014-mhr/assets.zip" \
            --sha256 e4f4f205cd87c0fa106577ba1de4fc763e4eb197c924461d2ef7e6944e9d6b94 \
            --output "$RUNNER_TEMP/r014-mhr/output" \
            --receipt "$RUNNER_TEMP/r014-mhr/output/create.json"
      - name: Reopen original native Blender model; deform and render actual animation
        shell: bash
        run: |
          set -euo pipefail
          "$BLENDER_BIN" --background "$RUNNER_TEMP/r014-mhr/output/R014_MHR_neutral_lod1.blend" \
            --python-exit-code 3 --python r014/mhr_motion_subdivision_probe.py -- \
            --out "$RUNNER_TEMP/r014-mhr/output" --mode '${{ matrix.mode }}'
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['RUNNER_TEMP'])/'r014-mhr/output'
          r=json.loads((out/'mhr_motion_subdivision_receipt.json').read_text())
          assert r['status']=='HOLD_CINEMATIC_AND_ANATOMICAL_QUALIFICATION'
          assert r['mode']=='${{ matrix.mode }}'
          assert r['subdivision_levels']['2']['vertices']>r['subdivision_levels']['1']['vertices']>r['subdivision_levels']['0']['vertices']
          assert r['subdivision_levels']['0']['moving_vertices_over_1mm']>50
          assert (out/r['actual_motion_mp4']).stat().st_size>1000
          print('PASS_REAL_NATIVE_MOTION_EVIDENCE_ONLY; ANATOMY AND PHOTOREALISM HOLD')
          PY
          (cd "$RUNNER_TEMP/r014-mhr/output" && sha256sum *.json *.blend *.glb *.mp4 *.png > sha256sum.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: r014-mhr-native-subdiv-${{ matrix.mode }}-HOLD
          path: ${{ runner.temp }}/r014-mhr/output/*
          retention-days: 7
