name: W16-C source-original actual IK weighted Blender and independent glTF video
on:
  pull_request:
    paths:
      - 'qualification/walk_w16c/**'
      - '.github/workflows/walk-w16c-native-integrated-ik.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-integrated-ik:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [forward, outward]
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native two-actor 3D IK root locomotion weighted Blender and H264
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'bpy==4.5.0'
          python qualification/walk_w16c/integrated_3d.py --profile "$PROFILE" --out "w16c-$PROFILE"
          test -s "w16c-$PROFILE/native_source_vertex_truth.json"
          test -s "w16c-$PROFILE/original_integrated_3d_ik_preview.mp4"
      - name: Independent third glTF reader and MP4 numerical acceptance
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          export W15_GLB="$GITHUB_WORKSPACE/w16c-$PROFILE/original_two_weighted_3d_characters.glb"
          export W15_TMP="$RUNNER_TEMP"
          (cd qualification/walk_w15 && python -m unittest -v test_glb_reader)
          python qualification/walk_w15/pure_glb_reader.py --glb "$W15_GLB" --truth "w16c-$PROFILE/native_source_vertex_truth.json" --out "w16c-$PROFILE/pure_gltf_vertex_receipt.json"
          python qualification/walk_w16c/verify_scene.py "w16c-$PROFILE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w16c-native-${{ matrix.profile }}
          path: w16c-${{ matrix.profile }}/
          retention-days: 3
          if-no-files-found: warn
